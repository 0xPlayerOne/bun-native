<!doctype html>
<html lang="en" data-surface="overlay">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bunly — Application overlay</title>
    <link rel="stylesheet" href="workbench.css" />
    <script type="module" src="page.js"></script>
    <script type="module" src="client.js"></script>
  </head>
  <body>
    <main>
      <span class="eyebrow">INDEPENDENT NATIVE OVERLAY / NONMODAL</span>
      <h1 id="surface-name">Application overlay</h1>
      <button id="dismiss-overlay">Dismiss and return to controls</button>
      <p id="connection" role="status">Connecting to native application…</p>
      <label for="draft">Overlay IME and text field</label
      ><textarea
        id="draft"
        rows="3"
        maxlength="4096"
        spellcheck="false"
        autocomplete="off"
      ></textarea>
      <div class="buttons">
        <button id="reset-text">Reset controlled text</button
        ><button id="select-text">Select text</button
        ><button id="local-action">Local action</button>
      </div>
      <p id="local-action-result" role="status"></p>
      <p id="page-observation" class="readback"></p>
      <details>
        <summary>Local input and composition events</summary>
        <ol id="page-events"></ol>
      </details>
      <p>
        This surface can dismiss itself. It cannot control other panes or the window. Physical
        pointer, keyboard and screen-reader behavior require observation.
      </p>
    </main>
  </body>
</html>
