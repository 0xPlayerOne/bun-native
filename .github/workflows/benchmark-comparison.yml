name: Benchmark comparison

# Non-gating measurement job: never a required check. It records raw results
# for core/Solid/React in development and AOT modes, including real XTest
# input-to-native-paint latency, and uploads them as an artifact. A passed job
# means every launch and equivalence check passed, not that performance improved.
on:
  workflow_dispatch:
    inputs:
      trials:
        description: Measured timed trials per artifact (3 to 30)
        default: '5'
      input-trials:
        description: XTest click-to-paint launches per artifact (0, or 3 to 30)
        default: '5'
      cold-cache:
        description: Sync and drop the page cache before every timed launch (sudo on the runner)
        type: boolean
        default: false
      streaming-trials:
        description: Streaming-list soaks per framework and mode (1 to 10)
        default: '3'
  schedule:
    - cron: '47 6 * * 3'
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - .github/workflows/benchmark-comparison.yml
      - benchmarks/comparison/**
      - benchmarks/rust-gpui/**
      - native/gpui-host/examples/workload-baseline.rs
      - benchmarks/solid/**
      - benchmarks/streaming-list-fixture.ts
      - tests/native/*streaming-list*
      - scripts/quality/regression-check.ts
      - scripts/quality/native-input-linux.py
      - scripts/quality/native-paint-observer.py

permissions:
  contents: read

concurrency:
  group: benchmark-comparison-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux core/Solid/React development and AOT comparison
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      PYTHONDONTWRITEBYTECODE: 1
      # Dispatch inputs reach the shell only through the environment.
      TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs.trials || '5' }}
      INPUT_TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs['input-trials'] || '5' }}
      COLD_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs['cold-cache'] || 'false' }}
      STREAMING_TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs['streaming-trials'] || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare result directory
        run: |
          mkdir "$RUNNER_TEMP/comparison"
          echo "COMPARISON=$RUNNER_TEMP/comparison" >> "$GITHUB_ENV"
      - name: Install checksum-pinned Bun compiler
        run: node scripts/install-bun.mjs --destination "$RUNNER_TEMP/bun-native-bun"
      - name: Install pinned Rust toolchain and isolated X11 prerequisites
        run: |
          rustup show active-toolchain
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libfontconfig-dev libglib2.0-dev libssl-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libzstd-dev \
            mesa-vulkan-drivers xvfb xauth x11-utils openbox xdotool imagemagick \
            dbus-x11 fonts-dejavu-core
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: gpui-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.json', 'bun.lock', 'rust-toolchain.toml', 'Cargo.lock') }}
      - run: bun install --frozen-lockfile
      - name: Build release native host
        run: |
          { time -p cargo build --locked --release --manifest-path Cargo.toml -p bun-native-host --bin bun-native-host; } 2>&1 | tee "$COMPARISON/host-build.log"
          sha256sum target/release/bun-native-host > "$COMPARISON/host-sha256.txt"
      - name: Build the direct Rust GPUI baseline
        run: |
          cargo build --locked --release --manifest-path Cargo.toml -p bun-native-host --example workload-baseline 2>&1 | tee "$COMPARISON/rust-baseline-build.log"
          sha256sum target/release/examples/workload-baseline > "$COMPARISON/rust-baseline-sha256.txt"
      - name: Run the equivalent-workload comparison in one isolated native session
        timeout-minutes: 40
        run: |
          extra=()
          if [[ "$COLD_CACHE" == 'true' ]]; then extra+=(--cold-cache); fi
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$COMPARISON/session" -- bun benchmarks/comparison/run.ts \
            --host "$GITHUB_WORKSPACE/target/release/bun-native-host" --host-profile release \
            --output "$COMPARISON/run" --trials "$TRIALS" --input-trials "$INPUT_TRIALS" \
            "${extra[@]}"
      # Same runner and session type, after the Bun Native trials. Its operation
      # timings are state application, not acknowledgements; compare process metrics.
      - name: Run the direct Rust GPUI baseline in one isolated native session
        timeout-minutes: 10
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$COMPARISON/rust-session" -- bun benchmarks/rust-gpui/run.ts \
            --binary "$GITHUB_WORKSPACE/target/release/examples/workload-baseline" \
            --output "$COMPARISON/rust-gpui" --trials "$TRIALS"
          {
            echo '## Direct Rust GPUI baseline (same runner)'
            echo
            echo '| Metric | median | 95% CI |'
            echo '| --- | --- | --- |'
            jq -r '.summary.perLaunch | to_entries[] | select(.key | test("spawnTo|processWall|cpu|peakTree")) | "| \(.key) | \(.value.median) | \(.value.medianInterval.low) to \(.value.medianInterval.high) |"' "$COMPARISON/rust-gpui/rust-gpui.json"
          } >> "$GITHUB_STEP_SUMMARY"
      # The versioned streaming/virtualization fixture (#257) through Solid and
      # React in development and AOT on the same host and runner. Each soak is
      # one fresh launch and one sample per metric for the regression gate.
      - name: Run the streaming-list fixture through Solid and React in development and AOT
        if: ${{ !cancelled() && hashFiles('target/release/bun-native-host') != '' }}
        timeout-minutes: 20
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          if [[ ! "$STREAMING_TRIALS" =~ ^([1-9]|10)$ ]]; then
            echo "streaming-trials must be 1 to 10, got $STREAMING_TRIALS" >&2
            exit 1
          fi
          mkdir -p "$COMPARISON/streaming"
          for framework in solid react; do
            entry="$framework-streaming-list"
            package="$COMPARISON/streaming/$entry-package"
            bun experiments/aot-gpui/build-window.ts \
              --source "$GITHUB_WORKSPACE" --host "$BUN_NATIVE_HOST" \
              --host-profile release --entry "$entry" --outdir "$package"
            for trial in $(seq 1 "$STREAMING_TRIALS"); do
              for mode in development aot; do
                command=(bun "$package/development/application.js")
                if [[ "$mode" == aot ]]; then
                  command=("$package/$entry")
                fi
                evidence="$COMPARISON/streaming/$framework-$mode-$trial"
                xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
                  dbus-run-session -- bash scripts/quality/native-linux-session.sh \
                  "$evidence-session" -- python3 tests/native/streaming-list.py \
                  --framework "$framework" --mode "$mode" --host-profile release \
                  --output "$evidence" -- "${command[@]}"
              done
            done
          done
          python3 tests/native/streaming-list.py summarize \
            --output "$COMPARISON/streaming/streaming-list-baseline.json" \
            "$COMPARISON"/streaming/*-[0-9]*/result.json
      - name: Export the compact record and summary table
        if: ${{ always() && env.COMPARISON != '' }}
        run: |
          if [[ ! -f "$COMPARISON/run/comparison.json" ]]; then
            echo 'The comparison wrote no comparison.json; the artifact keeps its logs.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bun benchmarks/comparison/export.ts "$COMPARISON/run" "$COMPARISON/export" | tee "$COMPARISON/summary.md"
          {
            echo '## Equivalent-workload comparison (Linux, software renderer request)'
            echo
            jq -r '"Status: \(.status); failed launches: \(.failedLaunches // [] | length)"' "$COMPARISON/run/comparison.json"
            echo
            cat "$COMPARISON/summary.md"
            echo
            echo 'Click to native paint is the driver interval from immediately before the XTest click command to the validated complete native paint record; it is not display presentation. See benchmarks/COMPARISON.md.'
          } >> "$GITHUB_STEP_SUMMARY"
      # Regression gate (#259): per-launch samples against the committed baseline
      # with the identical environment label. A model with no baseline is
      # reported, not gated. Fails on a stable >25% regression or missing metric:
      # two hosted VMs with the same CPU model measured identical code 12-15%
      # apart (run 42432829952), so 10% is a dedicated-machine threshold.
      - name: Regression gate against the committed baseline for this runner
        if: ${{ !cancelled() && env.COMPARISON != '' }}
        run: |
          if [[ ! -f "$COMPARISON/export/comparison.json" ]]; then
            echo 'No exported comparison, so nothing was gated; the comparison step failed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          streaming=()
          for result in "$COMPARISON"/streaming/*-[0-9]*/result.json; do
            [[ -f "$result" ]] && streaming+=("$result")
          done
          bun benchmarks/comparison/metrics.ts export "$COMPARISON/export" \
            --output "$COMPARISON/metrics.json" --streaming "${streaming[@]}"
          status=0
          bun benchmarks/comparison/metrics.ts gate "$COMPARISON/metrics.json" \
            benchmarks/comparison/baselines --threshold 0.25 > "$COMPARISON/regression.md" || status=$?
          {
            echo '## Regression gate'
            echo
            cat "$COMPARISON/regression.md"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$COMPARISON/regression.md"
          if [[ "$status" != 0 ]]; then
            echo '::error title=Performance regression::A stable regression or missing metric against the committed baseline; see the Regression gate summary.'
          fi
          exit "$status"
      - name: Retain raw results, including failures
        if: ${{ always() && env.COMPARISON != '' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-comparison-linux-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/comparison/
            !${{ runner.temp }}/comparison/run/*/application
            !${{ runner.temp }}/comparison/session/runtime/
            !${{ runner.temp }}/comparison/rust-session/runtime/
            !${{ runner.temp }}/comparison/streaming/*-package/
            !${{ runner.temp }}/comparison/streaming/*-session/runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
