name: Benchmark comparison

# Non-gating measurement job: never a required check. It records raw results
# for core/Solid/React in development and AOT modes, including real XTest
# input-to-native-paint latency, and uploads them as an artifact. A passed job
# means every launch and equivalence check passed, not that performance improved.
on:
  workflow_dispatch:
    inputs:
      trials:
        description: Measured timed trials per artifact (3 to 30)
        default: '5'
      input-trials:
        description: XTest click-to-paint launches per artifact (0, or 3 to 30)
        default: '5'
      cold-cache:
        description: Sync and drop the page cache before every timed launch (sudo on the runner)
        type: boolean
        default: false
      streaming-trials:
        description: Streaming-list soaks per framework and mode (1 to 10)
        default: '3'
      concurrent-jit:
        description: Diagnostic for #629. 'off' sets BUN_JSC_useConcurrentJIT=0 for every launch; assertions are unchanged
        type: choice
        options: ['on', 'off']
        default: 'on'
      paired-only:
        description: Run the bounded same-runner Core/AOT investigation for #675 only
        type: boolean
        default: false
      startup-only:
        description: Run the macOS Core startup trace investigation for #678 only
        type: boolean
        default: false
      paired-macos:
        description: Run the same-runner macOS Core AOT startup comparison for #678 only
        type: boolean
        default: false
      paired-macos-trials:
        description: Alternating macOS host pairs (3 to 20)
        default: '10'
      electrobun-smoke:
        description: Qualify the Electrobun visible-input fixture on hosted macOS only
        type: boolean
        default: false
  schedule:
    - cron: '47 6 * * 3'
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - .github/workflows/benchmark-comparison.yml
      - .github/actions/linux-native-prerequisites/**
      - benchmarks/comparison/**
      - benchmarks/rust-gpui/**
      - native/gpui-host/examples/workload-baseline.rs
      - benchmarks/solid/**
      - benchmarks/streaming-list-fixture.ts
      - tests/native/*streaming-list*
      - scripts/quality/regression-check.ts
      - scripts/quality/native-input-linux.py
      - scripts/quality/native_harness/**

permissions:
  contents: read

concurrency:
  group: benchmark-comparison-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux core/Solid/React development and AOT comparison
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || (inputs['paired-only'] != true && inputs['startup-only'] != true && inputs['paired-macos'] != true && inputs['electrobun-smoke'] != true))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      PYTHONDONTWRITEBYTECODE: 1
      # Dispatch inputs reach the shell only through the environment.
      TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs.trials || '5' }}
      INPUT_TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs['input-trials'] || '5' }}
      COLD_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs['cold-cache'] || 'false' }}
      STREAMING_TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs['streaming-trials'] || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare result directory
        run: |
          mkdir "$RUNNER_TEMP/comparison"
          echo "COMPARISON=$RUNNER_TEMP/comparison" >> "$GITHUB_ENV"
      - name: Disable the concurrent JIT for this diagnostic dispatch (#629)
        if: github.event_name == 'workflow_dispatch' && inputs['concurrent-jit'] == 'off'
        run: echo 'BUN_JSC_useConcurrentJIT=0' >> "$GITHUB_ENV"
      - name: Install the pinned Bun and Rust toolchains and downloads
        id: toolchain
        uses: ./.github/actions/native-toolchain
      # The same index-verified archive set (and cache key) as Native Linux, so a
      # mirror outage does not fail the comparison once Native Linux has cached it.
      - name: Install native build and isolated X11 prerequisites
        timeout-minutes: 25
        uses: ./.github/actions/linux-native-prerequisites
      - name: Build release native host
        run: |
          { time -p cargo build --locked --release --manifest-path Cargo.toml -p bun-native-host --bin bun-native-host; } 2>&1 | tee "$COMPARISON/host-build.log"
          sha256sum target/release/bun-native-host > "$COMPARISON/host-sha256.txt"
      - name: Build the direct Rust GPUI baseline
        run: |
          cargo build --locked --release --manifest-path Cargo.toml -p bun-native-host --example workload-baseline 2>&1 | tee "$COMPARISON/rust-baseline-build.log"
          sha256sum target/release/examples/workload-baseline > "$COMPARISON/rust-baseline-sha256.txt"
      - name: Run the equivalent-workload comparison in one isolated native session
        timeout-minutes: 40
        run: |
          extra=()
          if [[ "$COLD_CACHE" == 'true' ]]; then extra+=(--cold-cache); fi
          bash scripts/quality/native-x11-session.sh \
            "$COMPARISON/session" -- bun benchmarks/comparison/run.ts \
            --host "$GITHUB_WORKSPACE/target/release/bun-native-host" --host-profile release \
            --output "$COMPARISON/run" --trials "$TRIALS" --input-trials "$INPUT_TRIALS" \
            "${extra[@]}"
      # Same runner and session type, after the Bun Native trials. Its operation
      # timings are state application, not acknowledgements; compare process metrics.
      - name: Run the direct Rust GPUI baseline in one isolated native session
        timeout-minutes: 10
        run: |
          bash scripts/quality/native-x11-session.sh \
            "$COMPARISON/rust-session" -- bun benchmarks/rust-gpui/run.ts \
            --binary "$GITHUB_WORKSPACE/target/release/examples/workload-baseline" \
            --output "$COMPARISON/rust-gpui" --trials "$TRIALS"
          {
            echo '## Direct Rust GPUI baseline (same runner)'
            echo
            echo '| Metric | median | 95% CI |'
            echo '| --- | --- | --- |'
            jq -r '.summary.perLaunch | to_entries[] | select(.key | test("spawnTo|processWall|cpu|peakTree")) | "| \(.key) | \(.value.median) | \(.value.medianInterval.low) to \(.value.medianInterval.high) |"' "$COMPARISON/rust-gpui/rust-gpui.json"
          } >> "$GITHUB_STEP_SUMMARY"
      # The versioned streaming/virtualization fixture (#257) through Solid and
      # React in development and AOT on the same host and runner. Each soak is
      # one fresh launch and one sample per metric for the regression gate.
      - name: Run the streaming-list fixture through Solid and React in development and AOT
        if: ${{ !cancelled() && hashFiles('target/release/bun-native-host') != '' }}
        timeout-minutes: 20
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          if [[ ! "$STREAMING_TRIALS" =~ ^([1-9]|10)$ ]]; then
            echo "streaming-trials must be 1 to 10, got $STREAMING_TRIALS" >&2
            exit 1
          fi
          mkdir -p "$COMPARISON/streaming"
          for framework in solid react; do
            entry="$framework-streaming-list"
            package="$COMPARISON/streaming/$entry-package"
            bun experiments/aot-gpui/build-window.ts \
              --source "$GITHUB_WORKSPACE" --host "$BUN_NATIVE_HOST" \
              --host-profile release --entry "$entry" --outdir "$package"
            for trial in $(seq 1 "$STREAMING_TRIALS"); do
              for mode in development aot; do
                command=(bun "$package/development/application.js")
                if [[ "$mode" == aot ]]; then
                  command=("$package/$entry")
                fi
                evidence="$COMPARISON/streaming/$framework-$mode-$trial"
                bash scripts/quality/native-x11-session.sh \
                  "$evidence-session" -- python3 tests/native/streaming-list.py \
                  --framework "$framework" --mode "$mode" --host-profile release \
                  --output "$evidence" -- "${command[@]}"
              done
            done
          done
          python3 tests/native/streaming-list.py summarize \
            --output "$COMPARISON/streaming/streaming-list-baseline.json" \
            "$COMPARISON"/streaming/*-[0-9]*/result.json
      - name: Export the compact record and summary table
        if: ${{ always() && env.COMPARISON != '' }}
        run: |
          if [[ ! -f "$COMPARISON/run/comparison.json" ]]; then
            echo 'The comparison wrote no comparison.json; the artifact keeps its logs.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bun benchmarks/comparison/export.ts "$COMPARISON/run" "$COMPARISON/export" | tee "$COMPARISON/summary.md"
          {
            echo '## Equivalent-workload comparison (Linux, software renderer request)'
            echo
            jq -r '"Status: \(.status); failed launches: \(.failedLaunches // [] | length)"' "$COMPARISON/run/comparison.json"
            echo
            cat "$COMPARISON/summary.md"
            echo
            echo 'Click to native paint is the driver interval from immediately before the XTest click command to the validated complete native paint record; it is not display presentation. See benchmarks/COMPARISON.md.'
          } >> "$GITHUB_STEP_SUMMARY"
      # Regression gate (#259): per-launch samples against the committed baseline
      # with the identical environment label. A model with no baseline is
      # reported, not gated. Fails on a stable >25% regression or missing metric:
      # two hosted VMs with the same CPU model measured identical code 12-15%
      # apart (run 42432829952), so 10% is a dedicated-machine threshold.
      - name: Regression gate against the committed baseline for this runner
        if: ${{ !cancelled() && env.COMPARISON != '' }}
        run: |
          if [[ ! -f "$COMPARISON/export/comparison.json" ]]; then
            echo 'No exported comparison, so nothing was gated; the comparison step failed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          streaming=()
          for result in "$COMPARISON"/streaming/*-[0-9]*/result.json; do
            [[ -f "$result" ]] && streaming+=("$result")
          done
          bun benchmarks/comparison/metrics.ts export "$COMPARISON/export" \
            --output "$COMPARISON/metrics.json" --streaming "${streaming[@]}"
          status=0
          bun benchmarks/comparison/metrics.ts gate "$COMPARISON/metrics.json" \
            benchmarks/comparison/baselines --threshold 0.25 > "$COMPARISON/regression.md" || status=$?
          {
            echo '## Regression gate'
            echo
            cat "$COMPARISON/regression.md"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$COMPARISON/regression.md"
          if [[ "$status" != 0 ]]; then
            echo '::error title=Performance regression::A stable regression or missing metric against the committed baseline; see the Regression gate summary.'
          fi
          exit "$status"
      - name: Retain raw results, including failures
        if: ${{ always() && env.COMPARISON != '' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-comparison-linux-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/comparison/
            !${{ runner.temp }}/comparison/run/*/application
            !${{ runner.temp }}/comparison/session/runtime/
            !${{ runner.temp }}/comparison/rust-session/runtime/
            !${{ runner.temp }}/comparison/streaming/*-package/
            !${{ runner.temp }}/comparison/streaming/*-session/runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # The same comparison and direct Rust GPUI baseline on a hosted Apple silicon
  # VM (#244). XTest click-to-paint is Linux only, so input trials are 0 here.
  # The hosted VM's paravirtual Metal device is not a physical GPU.
  macos:
    name: macOS core/Solid/React and direct Rust GPUI comparison
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || (inputs['paired-only'] != true && inputs['electrobun-smoke'] != true))
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: 0
      PYTHONDONTWRITEBYTECODE: 1
      TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs.trials || '5' }}
      STARTUP_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs['startup-only'] || false }}
      PAIRED_MACOS: ${{ github.event_name == 'workflow_dispatch' && inputs['paired-macos'] || false }}
      PAIRED_MACOS_TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs['paired-macos-trials'] || '10' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned baseline source
        if: github.event_name == 'workflow_dispatch' && inputs['paired-macos'] == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5cfbb71c83a5f3937543ee08aa8159960c1d80a0
          path: .paired-baseline
          persist-credentials: false
      - name: Isolate pinned baseline checkout
        if: github.event_name == 'workflow_dispatch' && inputs['paired-macos'] == true
        run: |
          test "$(cat .paired-baseline/.git/HEAD)" = 5cfbb71c83a5f3937543ee08aa8159960c1d80a0
          mv .paired-baseline "$RUNNER_TEMP/paired-baseline"
      - name: Prepare result directory
        run: |
          mkdir "$RUNNER_TEMP/comparison"
          echo "COMPARISON=$RUNNER_TEMP/comparison" >> "$GITHUB_ENV"
      - name: Disable the concurrent JIT for this diagnostic dispatch (#629)
        if: github.event_name == 'workflow_dispatch' && inputs['concurrent-jit'] == 'off'
        run: echo 'BUN_JSC_useConcurrentJIT=0' >> "$GITHUB_ENV"
      - name: Install the pinned Bun and Rust toolchains and downloads
        id: toolchain
        uses: ./.github/actions/native-toolchain
      - name: Build release native host and the direct Rust GPUI baseline
        run: |
          { time -p cargo build --locked --release --manifest-path Cargo.toml -p bun-native-host --bin bun-native-host --example workload-baseline; } 2>&1 | tee "$COMPARISON/host-build.log"
          shasum -a 256 target/release/bun-native-host target/release/examples/workload-baseline > "$COMPARISON/binary-sha256.txt"
          system_profiler SPDisplaysDataType SPHardwareDataType > "$COMPARISON/hardware.txt" 2>&1 || true
      - name: Build pinned baseline native host
        if: github.event_name == 'workflow_dispatch' && inputs['paired-macos'] == true
        timeout-minutes: 25
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/paired-target" cargo build --locked --release \
            --manifest-path "$RUNNER_TEMP/paired-baseline/Cargo.toml" -p bun-native-host --bin bun-native-host
          cp "$RUNNER_TEMP/paired-target/release/bun-native-host" "$RUNNER_TEMP/paired-baseline-host"
          shasum -a 256 "$RUNNER_TEMP/paired-baseline-host" > "$COMPARISON/paired-baseline-sha256.txt"
      - name: Run the equivalent-workload comparison
        timeout-minutes: 40
        run: |
          extra=()
          if [[ "$STARTUP_ONLY" == 'true' ]]; then extra+=(--startup-trace-calibration --adapters core); fi
          if [[ "$PAIRED_MACOS" == 'true' ]]; then extra+=(--adapters core --paired-host "$RUNNER_TEMP/paired-baseline-host" --paired-trials "$PAIRED_MACOS_TRIALS"); fi
          bun benchmarks/comparison/run.ts \
            --host "$GITHUB_WORKSPACE/target/release/bun-native-host" --host-profile release \
            --output "$COMPARISON/run" --trials "$TRIALS" --input-trials 0 "${extra[@]}"
      - name: Run the direct Rust GPUI baseline
        if: ${{ !cancelled() && env.PAIRED_MACOS != 'true' && hashFiles('target/release/examples/workload-baseline') != '' }}
        timeout-minutes: 10
        run: |
          bun benchmarks/rust-gpui/run.ts \
            --binary "$GITHUB_WORKSPACE/target/release/examples/workload-baseline" \
            --output "$COMPARISON/rust-gpui" --trials "$TRIALS"
      - name: Verify paired startup evidence
        if: ${{ !cancelled() && env.PAIRED_MACOS == 'true' && env.COMPARISON != '' }}
        run: |
          test -f "$COMPARISON/run/comparison.json"
          bun benchmarks/comparison/paired-analysis.ts "$COMPARISON/run" > "$COMPARISON/paired-analysis.json"
      - name: Export the compact record and summary table
        if: ${{ always() && env.COMPARISON != '' }}
        run: |
          if [[ -f "$COMPARISON/run/comparison.json" ]]; then
            bun benchmarks/comparison/export.ts "$COMPARISON/run" "$COMPARISON/export" | tee "$COMPARISON/summary.md"
            {
              echo '## Equivalent-workload comparison (macOS, hosted VM)'
              echo
              jq -r '"Status: \(.status); failed launches: \(.failedLaunches // [] | length)"' "$COMPARISON/run/comparison.json"
              echo
              cat "$COMPARISON/summary.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "$COMPARISON/rust-gpui/rust-gpui.json" ]]; then
            {
              echo '## Direct Rust GPUI baseline (same runner)'
              echo
              echo '| Metric | median | 95% CI |'
              echo '| --- | --- | --- |'
              jq -r '.summary.perLaunch | to_entries[] | select(.key | test("spawnTo|processWall|cpu|peakTree")) | "| \(.key) | \(.value.median) | \(.value.medianInterval.low) to \(.value.medianInterval.high) |"' "$COMPARISON/rust-gpui/rust-gpui.json"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain raw results, including failures
        if: ${{ always() && env.COMPARISON != '' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-comparison-macos-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/comparison/
            !${{ runner.temp }}/comparison/run/*/application
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # The same comparison and direct Rust GPUI baseline on a hosted Windows x64
  # VM (#244). XTest click-to-paint is Linux only, so input trials are 0 here.
  # Process-tree working set, CPU time and load come from
  # benchmarks/comparison/windows-processes.ts. The VM has no physical GPU.
  windows:
    name: Windows core/Solid/React and direct Rust GPUI comparison
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || (inputs['paired-only'] != true && inputs['startup-only'] != true && inputs['paired-macos'] != true && inputs['electrobun-smoke'] != true))
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: 0
      PYTHONDONTWRITEBYTECODE: 1
      TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs.trials || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare result directory
        run: |
          $comparison = Join-Path $env:RUNNER_TEMP 'comparison'
          New-Item -ItemType Directory $comparison | Out-Null
          "COMPARISON=$comparison" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Disable the concurrent JIT for this diagnostic dispatch (#629)
        if: github.event_name == 'workflow_dispatch' && inputs['concurrent-jit'] == 'off'
        run: "'BUN_JSC_useConcurrentJIT=0' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8"
      - name: Install the pinned Bun and Rust toolchains and downloads
        id: toolchain
        uses: ./.github/actions/native-toolchain
      - name: Locate the installed Windows SDK shader compiler
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $fxc = Get-ChildItem -Directory $sdk |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64/fxc.exe' } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (!$fxc) { throw 'GPUI release shaders require the Windows SDK fxc.exe' }
          "GPUI_FXC_PATH=$fxc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build release native host and the direct Rust GPUI baseline
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          cargo build --locked --release --manifest-path Cargo.toml -p bun-native-host --bin bun-native-host --example workload-baseline 2>&1 |
            Tee-Object -FilePath (Join-Path $env:COMPARISON 'host-build.log')
          $code = $LASTEXITCODE
          "real $($timer.Elapsed.TotalSeconds)" | Out-File -Append (Join-Path $env:COMPARISON 'host-build.log')
          if ($code -ne 0) { throw "Native build failed: $code" }
          Get-FileHash -Algorithm SHA256 target/release/bun-native-host.exe, target/release/examples/workload-baseline.exe |
            Format-List | Out-File (Join-Path $env:COMPARISON 'binary-sha256.txt')
          & {
            Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture
            Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed
            Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, AdapterRAM, VideoModeDescription
            "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          } | Format-List | Out-File (Join-Path $env:COMPARISON 'hardware.txt')
      - name: Run the equivalent-workload comparison
        timeout-minutes: 45
        run: |
          bun benchmarks/comparison/run.ts `
            --host (Join-Path $env:GITHUB_WORKSPACE 'target/release/bun-native-host.exe') --host-profile release `
            --output (Join-Path $env:COMPARISON 'run') --trials $env:TRIALS --input-trials 0
          if ($LASTEXITCODE -ne 0) { throw "The comparison exited $LASTEXITCODE" }
      - name: Run the direct Rust GPUI baseline
        if: ${{ !cancelled() && hashFiles('target/release/examples/workload-baseline.exe') != '' }}
        timeout-minutes: 10
        run: |
          bun benchmarks/rust-gpui/run.ts `
            --binary (Join-Path $env:GITHUB_WORKSPACE 'target/release/examples/workload-baseline.exe') `
            --output (Join-Path $env:COMPARISON 'rust-gpui') --trials $env:TRIALS
          if ($LASTEXITCODE -ne 0) { throw "The Rust GPUI baseline exited $LASTEXITCODE" }
      - name: Export the compact record and summary table
        if: ${{ always() && env.COMPARISON != '' }}
        run: |
          $comparison = Join-Path $env:COMPARISON 'run/comparison.json'
          if (Test-Path -LiteralPath $comparison) {
            bun benchmarks/comparison/export.ts (Join-Path $env:COMPARISON 'run') (Join-Path $env:COMPARISON 'export') |
              Tee-Object -FilePath (Join-Path $env:COMPARISON 'summary.md')
            if ($LASTEXITCODE -ne 0) { throw "The export exited $LASTEXITCODE" }
            $record = Get-Content -Raw $comparison | ConvertFrom-Json
            $failedLaunches = ($record.failedLaunches | Measure-Object).Count
            & {
              '## Equivalent-workload comparison (Windows, hosted VM)'
              ''
              "Status: $($record.status); failed launches: $failedLaunches"
              ''
              Get-Content -Raw (Join-Path $env:COMPARISON 'summary.md')
            } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          $rust = Join-Path $env:COMPARISON 'rust-gpui/rust-gpui.json'
          if (Test-Path -LiteralPath $rust) {
            $baseline = Get-Content -Raw $rust | ConvertFrom-Json
            & {
              '## Direct Rust GPUI baseline (same runner)'
              ''
              '| Metric | median | 95% CI |'
              '| --- | --- | --- |'
              $baseline.summary.perLaunch.PSObject.Properties |
                Where-Object { $_.Name -match 'spawnTo|processWall|cpu|peakTree' } |
                ForEach-Object { "| $($_.Name) | $($_.Value.median) | $($_.Value.medianInterval.low) to $($_.Value.medianInterval.high) |" }
            } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
      - name: Retain raw results, including failures
        if: ${{ always() && env.COMPARISON != '' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-comparison-windows-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/comparison/
            !${{ runner.temp }}/comparison/run/*/application.exe
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  paired-click:
    name: Paired Linux Core AOT input investigation
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs['paired-only'] == true && inputs['paired-macos'] != true && inputs['electrobun-smoke'] != true && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      PYTHONDONTWRITEBYTECODE: 1
      PAIR_BASELINE_SHA: d67794d1bde2eeb3621f2cd1f96d1379ea87a400
      PAIR_CANDIDATE_SHA: 88e48ac73f6286cfde5124eb6741998ccc6bb144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare output directory
        run: |
          mkdir "$RUNNER_TEMP/paired-click"
          {
            echo "PAIR_OUTPUT=$RUNNER_TEMP/paired-click"
            echo "PAIR_ROOT=$GITHUB_WORKSPACE"
            echo "PAIR_BASELINE_SOURCE=$GITHUB_WORKSPACE/.bun-native/paired/baseline"
            echo "PAIR_CANDIDATE_SOURCE=$GITHUB_WORKSPACE/.bun-native/paired/candidate"
            echo "PAIR_BASELINE_HOST=$RUNNER_TEMP/paired-click/baseline-host"
            echo "PAIR_CANDIDATE_HOST=$RUNNER_TEMP/paired-click/candidate-host"
          } >> "$GITHUB_ENV"
      - name: Install the pinned toolchain and native prerequisites
        uses: ./.github/actions/native-toolchain
      - uses: ./.github/actions/linux-native-prerequisites
      - name: Checkout historical baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d67794d1bde2eeb3621f2cd1f96d1379ea87a400
          path: .bun-native/paired/baseline
          persist-credentials: false
      - name: Checkout current comparison source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 88e48ac73f6286cfde5124eb6741998ccc6bb144
          path: .bun-native/paired/candidate
          persist-credentials: false
      - name: Build both exact release hosts
        timeout-minutes: 45
        run: |
          set -o pipefail
          [[ "$(git -C "$PAIR_BASELINE_SOURCE" rev-parse HEAD)" == "$PAIR_BASELINE_SHA" ]]
          [[ "$(git -C "$PAIR_CANDIDATE_SOURCE" rev-parse HEAD)" == "$PAIR_CANDIDATE_SHA" ]]
          export CARGO_TARGET_DIR="$RUNNER_TEMP/paired-target"
          for variant in baseline candidate; do
            if [[ "$variant" == baseline ]]; then source_dir="$PAIR_BASELINE_SOURCE"; host="$PAIR_BASELINE_HOST"; else source_dir="$PAIR_CANDIDATE_SOURCE"; host="$PAIR_CANDIDATE_HOST"; fi
            (
              cd "$source_dir"
              bun install --frozen-lockfile
              cargo build --locked --release -p bun-native-host --bin bun-native-host
            ) 2>&1 | tee "$PAIR_OUTPUT/$variant-build.log"
            cp "$CARGO_TARGET_DIR/release/bun-native-host" "$host"
            sha256sum "$host" > "$PAIR_OUTPUT/$variant-host.sha256"
          done
      - name: Calibrate and measure alternating input pairs
        timeout-minutes: 40
        run: |
          bash scripts/quality/native-x11-session.sh "$RUNNER_TEMP/paired-session" -- \
            bash benchmarks/comparison/paired-input-session.sh
      - name: Retain paired evidence, including failures
        if: ${{ always() && env.PAIR_OUTPUT != '' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paired-core-aot-input-linux-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/paired-click/
            !${{ runner.temp }}/paired-click/*-host
            !${{ runner.temp }}/paired-click/*/core/application
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  electrobun-smoke:
    name: Electrobun visible-input fixture smoke
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs['electrobun-smoke'] == true && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare isolated fixture and evidence directory
        run: |
          mkdir "$RUNNER_TEMP/eb-smoke" "$RUNNER_TEMP/eb-source" "$RUNNER_TEMP/eb-inner"
          cp -R benchmarks/electrobun/app/. "$RUNNER_TEMP/eb-source/"
          {
            sw_vers
            uname -a
            system_profiler SPHardwareDataType SPDisplaysDataType
          } > "$RUNNER_TEMP/eb-smoke/environment.txt"
      - name: Install pinned toolchain and workspace dependencies
        uses: ./.github/actions/native-toolchain
      - name: Build pinned Electrobun reference
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/eb-source"
          BUN_INSTALL_CACHE_DIR="$RUNNER_TEMP/eb-bun-cache" bunx electrobun@2.0.6 build --env=stable 2>&1 | tee "$RUNNER_TEMP/eb-smoke/build.log"
          archive="$RUNNER_TEMP/eb-source/artifacts/stable-macos-arm64-workload-baseline.app.tar.zst"
          shasum -a 256 "$archive" > "$RUNNER_TEMP/eb-smoke/archive.sha256"
          /usr/bin/tar -tf "$archive" > "$RUNNER_TEMP/eb-smoke/archive-files.txt"
          /usr/bin/tar -tvf "$archive" > "$RUNNER_TEMP/eb-smoke/archive-details.txt"
          awk 'BEGIN { ok=1; n=0 } { n++; if ($0 !~ /^workload-baseline\.app\// || $0 ~ /(^|\/)\.\.(\/|$)/) ok=0 } END { if (!n || !ok) exit 1 }' "$RUNNER_TEMP/eb-smoke/archive-files.txt"
          if grep -Eq '^[lh]' "$RUNNER_TEMP/eb-smoke/archive-details.txt"; then
            echo 'Reference archive contains links; refusing extraction.' >&2
            exit 1
          fi
          /usr/bin/tar -xf "$archive" -C "$RUNNER_TEMP/eb-inner"
      - name: Compile owned-window and offline OCR helpers
        run: |
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework CoreGraphics -framework ApplicationServices scripts/quality/native-platform-macos.m -o "$RUNNER_TEMP/eb-smoke/window-helper"
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation -framework CoreGraphics -framework ImageIO -framework Vision benchmarks/electrobun/observe-text-macos.m -o "$RUNNER_TEMP/eb-smoke/text-helper"
      - name: Qualify owned window, OS click and captured label
        run: |
          bun benchmarks/electrobun/visible-smoke-macos.ts \
            --app "$RUNNER_TEMP/eb-inner/workload-baseline.app" \
            --output "$RUNNER_TEMP/eb-smoke/run" \
            --helper "$RUNNER_TEMP/eb-smoke/window-helper" \
            --ocr "$RUNNER_TEMP/eb-smoke/text-helper"
      - name: Build the native release host and inspected Core AOT fixture
        run: |
          set -euo pipefail
          cargo build --locked --release -p bun-native-host --bin bun-native-host 2>&1 | tee "$RUNNER_TEMP/eb-smoke/native-host-build.log"
          cp target/release/bun-native-host "$RUNNER_TEMP/eb-smoke/native-host"
          shasum -a 256 "$RUNNER_TEMP/eb-smoke/native-host" > "$RUNNER_TEMP/eb-smoke/native-host.sha256"
          bun benchmarks/electrobun/build-native.ts --output "$RUNNER_TEMP/eb-smoke/native-build"
      - name: Qualify native AOT window, OS click and captured label
        run: |
          bun benchmarks/electrobun/visible-smoke-macos.ts \
            --native-app "$RUNNER_TEMP/eb-smoke/native-build/application" \
            --native-host "$RUNNER_TEMP/eb-smoke/native-host" \
            --output "$RUNNER_TEMP/eb-smoke/native-run" \
            --helper "$RUNNER_TEMP/eb-smoke/window-helper" \
            --ocr "$RUNNER_TEMP/eb-smoke/text-helper"
      - name: Check both qualified reports and native build identity
        run: |
          bun -e '
            import assert from "node:assert/strict";
            import { join } from "node:path";
            const root = join(process.env.RUNNER_TEMP, "eb-smoke");
            const read = async (path) => Bun.file(join(root, path)).json();
            const [reference, native, build, refApp, nativeApp] = await Promise.all([
              read("run/result.json"), read("native-run/result.json"), read("native-build/build.json"),
              read("run/application.json"), read("native-run/application.json"),
            ]);
            assert.equal(reference.status, "passed");
            assert.equal(native.status, "passed");
            assert.equal(native.artifacts.launcher.sha256, build.binary.sha256);
            assert.equal(native.artifacts.launcher.bytes, build.binary.bytes);
            assert.equal(native.artifacts.inspection.hasCompiledProgram, true);
            assert.equal(refApp.workload.rows, 32);
            assert.equal(nativeApp.workload.rows, 32);
            assert.equal(nativeApp.workload.scenario, "visible-input");
          '
      - name: Collect alternating visible-input pairs and controls
        if: inputs['paired-macos'] == true
        env:
          VISIBLE_PAIRS: ${{ inputs['paired-macos-trials'] }}
        run: |
          bun benchmarks/electrobun/visible-pairs-macos.ts \
            --app "$RUNNER_TEMP/eb-inner/workload-baseline.app" \
            --native-app "$RUNNER_TEMP/eb-smoke/native-build/application" \
            --native-host "$RUNNER_TEMP/eb-smoke/native-host" \
            --output "$RUNNER_TEMP/eb-smoke/pairs" \
            --helper "$RUNNER_TEMP/eb-smoke/window-helper" \
            --ocr "$RUNNER_TEMP/eb-smoke/text-helper" \
            --pairs "$VISIBLE_PAIRS"
      - name: Retain smoke evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electrobun-visible-input-smoke-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/eb-smoke/
            !${{ runner.temp }}/eb-smoke/native-host
            !${{ runner.temp }}/eb-smoke/native-build/application
            !${{ runner.temp }}/eb-smoke/native-build/module/
          if-no-files-found: warn
          retention-days: 30

  tree-path-pairs:
    name: Ancestor path release-host comparison
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs['paired-only'] == true && inputs['paired-macos'] == true && inputs['electrobun-smoke'] != true && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: 0
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact pre-change source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 879df62168267ec49a6d6358b5c6c57c10718c9d
          path: .tree-pairs-baseline
          persist-credentials: false
      - name: Checkout pre-overlap startup files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5cfbb71c83a5f3937543ee08aa8159960c1d80a0
          path: .tree-pairs-startup
          persist-credentials: false
      - name: Isolate baseline and verify source boundary
        run: |
          set -euo pipefail
          test "$(cat .tree-pairs-baseline/.git/HEAD)" = 879df62168267ec49a6d6358b5c6c57c10718c9d
          test "$(cat .tree-pairs-startup/.git/HEAD)" = 5cfbb71c83a5f3937543ee08aa8159960c1d80a0
          mv .tree-pairs-baseline "$RUNNER_TEMP/tree-pairs-baseline"
          mv .tree-pairs-startup "$RUNNER_TEMP/tree-pairs-startup"
          mkdir "$RUNNER_TEMP/tree-pairs"
          # Reproduce the reverted startup path in the baseline as well. The
          # test-only lifecycle file is copied to keep the source record exact.
          for path in native/gpui-host/src/frame_pacing.rs native/gpui-host/src/main.rs native/macos-surface/src/lib.rs tests/native/lifecycle.ts; do
            cp "$RUNNER_TEMP/tree-pairs-startup/$path" "$RUNNER_TEMP/tree-pairs-baseline/$path"
            cmp "$RUNNER_TEMP/tree-pairs-baseline/$path" "$GITHUB_WORKSPACE/$path"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          candidate = Path(os.environ['GITHUB_WORKSPACE'])
          baseline = Path(os.environ['RUNNER_TEMP']) / 'tree-pairs-baseline'
          for name in ('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'toolchain.json', 'bun.lock'):
              assert (candidate / name).read_bytes() == (baseline / name).read_bytes(), name
          def manifest(root):
              result = {}
              for p in (root / 'native').rglob('*'):
                  if p.is_file():
                      name = str(p.relative_to(root))
                      if name not in ('native/protocol/src/tree.rs', 'native/protocol/src/popup_tests.rs'):
                          result[name] = hashlib.sha256(p.read_bytes()).hexdigest()
              return result
          assert manifest(candidate) == manifest(baseline), 'Unexpected native source difference'
          original = (baseline / 'native/protocol/src/tree.rs').read_text()
          expected = original.replace('        let mut pending = Vec::new();\n        for &id in attached {',
              '        let mut pending = Vec::new();\n        // Reuse path capacity across subtrees while resetting each context.\n        let mut layers = Vec::new();\n        for &id in attached {', 1)
          expected = expected.replace('            let mut layers = Vec::new();\n            while let Some(parent)',
              '            layers.clear();\n            while let Some(parent)', 1)
          assert expected != original and (candidate / 'native/protocol/src/tree.rs').read_text() == expected, 'Unexpected tree change'
          PY
          {
            git rev-parse HEAD
            echo 'Baseline: 879df62168267ec49a6d6358b5c6c57c10718c9d with four startup files from 5cfbb71c83a5f3937543ee08aa8159960c1d80a0'
            shasum -a 256 "$RUNNER_TEMP/tree-pairs-baseline/native/gpui-host/src/frame_pacing.rs" "$RUNNER_TEMP/tree-pairs-baseline/native/gpui-host/src/main.rs" "$RUNNER_TEMP/tree-pairs-baseline/native/macos-surface/src/lib.rs" "$RUNNER_TEMP/tree-pairs-baseline/tests/native/lifecycle.ts"
            sw_vers
            uname -a
            system_profiler SPHardwareDataType SPDisplaysDataType
          } > "$RUNNER_TEMP/tree-pairs/environment.txt"
      - name: Install pinned toolchain
        uses: ./.github/actions/native-toolchain
      - name: Build isolated release hosts
        timeout-minutes: 40
        run: |
          set -euo pipefail
          rustc -Vv > "$RUNNER_TEMP/tree-pairs/rustc.txt"
          CARGO_TARGET_DIR="$RUNNER_TEMP/tree-target-candidate" cargo build --locked --release -p bun-native-host --bin bun-native-host
          CARGO_TARGET_DIR="$RUNNER_TEMP/tree-target-candidate" cargo build --locked --release -p bun-native-protocol --example mount_perf
          CARGO_TARGET_DIR="$RUNNER_TEMP/tree-target-baseline" cargo build --locked --release --manifest-path "$RUNNER_TEMP/tree-pairs-baseline/Cargo.toml" -p bun-native-host --bin bun-native-host
          CARGO_TARGET_DIR="$RUNNER_TEMP/tree-target-baseline" cargo build --locked --release --manifest-path "$RUNNER_TEMP/tree-pairs-baseline/Cargo.toml" -p bun-native-protocol --example mount_perf
          cp "$RUNNER_TEMP/tree-target-candidate/release/bun-native-host" "$RUNNER_TEMP/tree-pairs-candidate-host"
          cp "$RUNNER_TEMP/tree-target-baseline/release/bun-native-host" "$RUNNER_TEMP/tree-pairs-baseline-host"
          shasum -a 256 "$RUNNER_TEMP/tree-pairs-candidate-host" "$RUNNER_TEMP/tree-pairs-baseline-host" > "$RUNNER_TEMP/tree-pairs/hosts.sha256"
          shasum -a 256 "$RUNNER_TEMP/tree-target-candidate/release/examples/mount_perf" "$RUNNER_TEMP/tree-target-baseline/release/examples/mount_perf" > "$RUNNER_TEMP/tree-pairs/probes.sha256"
      - name: Collect alternating protocol mount probes
        run: |
          python3 - <<'PY'
          import json, os, statistics, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          binaries = {v: root / f'tree-target-{v}/release/examples/mount_perf' for v in ('baseline', 'candidate')}
          raw = []
          for mode in ('single', 'parallel'):
              for pair in range(30):
                  for variant in (('baseline', 'candidate') if pair % 2 == 0 else ('candidate', 'baseline')):
                      args = [str(binaries[variant])] + (['parallel'] if mode == 'parallel' else [])
                      rows = [list(map(int, line.split(','))) for line in subprocess.check_output(args, text=True).splitlines()]
                      assert len(rows) == (60 if mode == 'single' else 240)
                      assert all(len(r) == 3 and r[0] in (32, 1024) and 5 <= r[1] < 35 and r[2] > 0 for r in rows)
                      raw.append({'mode': mode, 'pair': pair, 'variant': variant, 'rows': rows})
                      (root / 'tree-pairs/mount-raw.json').write_text(json.dumps(raw, indent=2) + '\n')
          summary = {}
          for mode in ('single', 'parallel'):
              for size in (32, 1024):
                  differences = []
                  for pair in range(30):
                      values = {r['variant']: statistics.median(x[2] for x in r['rows'] if x[0] == size)
                                for r in raw if r['mode'] == mode and r['pair'] == pair}
                      assert set(values) == {'baseline', 'candidate'}
                      differences.append(values['candidate'] - values['baseline'])
                  summary[f'{mode}-{size}'] = {'pairedDeltasNs': differences,
                      'medianDeltaNs': statistics.median(differences),
                      'candidateFasterPairs': sum(d < 0 for d in differences)}
          (root / 'tree-pairs/mount-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY
      - name: Compare calibrated Core AOT workloads in alternating pairs
        timeout-minutes: 30
        run: |
          bun benchmarks/comparison/run.ts \
            --host "$RUNNER_TEMP/tree-pairs-candidate-host" --host-profile release \
            --paired-host "$RUNNER_TEMP/tree-pairs-baseline-host" --paired-trials 20 \
            --adapters core --trials 3 --input-trials 0 --output "$RUNNER_TEMP/tree-pairs/run"
          bun benchmarks/comparison/paired-analysis.ts "$RUNNER_TEMP/tree-pairs/run" > "$RUNNER_TEMP/tree-pairs/paired-analysis.json"
      - name: Retain raw results and failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree-path-pairs-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/tree-pairs/
            !${{ runner.temp }}/tree-pairs/run/*/application
          if-no-files-found: warn
          retention-days: 30

  tree-path-allocations:
    name: Ancestor path allocation attribution
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs['paired-only'] == true && inputs['paired-macos'] == true && inputs['electrobun-smoke'] != true && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 1
      CARGO_PROFILE_RELEASE_STRIP: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact pre-change source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 879df62168267ec49a6d6358b5c6c57c10718c9d
          path: .tree-alloc-baseline
          persist-credentials: false
      - name: Verify source boundary and isolate baseline
        run: |
          set -euo pipefail
          test "$(cat .tree-alloc-baseline/.git/HEAD)" = 879df62168267ec49a6d6358b5c6c57c10718c9d
          mv .tree-alloc-baseline "$RUNNER_TEMP/tree-alloc-baseline"
          mkdir "$RUNNER_TEMP/tree-alloc"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          candidate = Path(os.environ['GITHUB_WORKSPACE'])
          baseline = Path(os.environ['RUNNER_TEMP']) / 'tree-alloc-baseline'
          for name in ('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'native/protocol/Cargo.toml'):
              assert (candidate / name).read_bytes() == (baseline / name).read_bytes(), name
          def manifest(root):
              result = {}
              for p in (root / 'native/protocol').rglob('*'):
                  if p.is_file():
                      name = str(p.relative_to(root))
                      if name not in ('native/protocol/src/tree.rs', 'native/protocol/src/popup_tests.rs'):
                          result[name] = hashlib.sha256(p.read_bytes()).hexdigest()
              return result
          assert manifest(candidate) == manifest(baseline), 'Unexpected protocol source difference'
          original = (baseline / 'native/protocol/src/tree.rs').read_text()
          expected = original.replace('        let mut pending = Vec::new();\n        for &id in attached {',
              '        let mut pending = Vec::new();\n        // Reuse path capacity across subtrees while resetting each context.\n        let mut layers = Vec::new();\n        for &id in attached {', 1)
          expected = expected.replace('            let mut layers = Vec::new();\n            while let Some(parent)',
              '            layers.clear();\n            while let Some(parent)', 1)
          assert expected != original and (candidate / 'native/protocol/src/tree.rs').read_text() == expected, 'Unexpected tree change'
          PY
      - name: Install bounded allocation profiler
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends heaptrack binutils
          heaptrack --version > "$RUNNER_TEMP/tree-alloc/profiler-version.txt"
          heaptrack_print --version >> "$RUNNER_TEMP/tree-alloc/profiler-version.txt"
          rustc -Vv > "$RUNNER_TEMP/tree-alloc/rustc.txt"
          uname -a > "$RUNNER_TEMP/tree-alloc/environment.txt"
          git rev-parse HEAD >> "$RUNNER_TEMP/tree-alloc/environment.txt"
      - name: Build isolated symbolized release probes
        timeout-minutes: 15
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/tree-alloc-target-candidate" cargo build --locked --release -p bun-native-protocol --example mount_perf
          CARGO_TARGET_DIR="$RUNNER_TEMP/tree-alloc-target-baseline" cargo build --locked --release --manifest-path "$RUNNER_TEMP/tree-alloc-baseline/Cargo.toml" -p bun-native-protocol --example mount_perf
          shasum -a 256 "$RUNNER_TEMP/tree-alloc-target-candidate/release/examples/mount_perf" "$RUNNER_TEMP/tree-alloc-target-baseline/release/examples/mount_perf" > "$RUNNER_TEMP/tree-alloc/probes.sha256"
      - name: Capture and interpret allocation traces
        timeout-minutes: 4
        run: |
          set -euo pipefail
          library=/usr/lib/heaptrack/libheaptrack_preload.so
          interpreter=/usr/lib/heaptrack/libexec/heaptrack_interpret
          test -f "$library" && test -x "$interpreter"
          shasum -a 256 "$library" "$interpreter" "$(command -v heaptrack_print)" > "$RUNNER_TEMP/tree-alloc/profiler.sha256"
          for variant in baseline candidate; do
            raw="$RUNNER_TEMP/tree-alloc/$variant.raw"
            binary="$RUNNER_TEMP/tree-alloc-target-$variant/release/examples/mount_perf"
            (ulimit -f 131072; timeout 90s env LD_PRELOAD="$library" DUMP_HEAPTRACK_OUTPUT="$raw" "$binary" > "$RUNNER_TEMP/tree-alloc/$variant.stdout")
            test -s "$raw"
            shasum -a 256 "$raw" > "$RUNNER_TEMP/tree-alloc/$variant.raw.sha256"
            "$interpreter" < "$raw" | gzip -n > "$RUNNER_TEMP/tree-alloc/$variant.heaptrack.gz"
            heaptrack_print --file "$RUNNER_TEMP/tree-alloc/$variant.heaptrack.gz" --merge-backtraces 0 > "$RUNNER_TEMP/tree-alloc/$variant.summary.txt"
            rm "$raw"
          done
          echo 'Instrumented whole-process allocation events; timings and RSS are not latency baselines. Allocator paths bypassing malloc are not counted.' > "$RUNNER_TEMP/tree-alloc/scope.txt"
      - name: Retain allocation evidence and failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree-path-allocations-${{ runner.arch }}
          path: ${{ runner.temp }}/tree-alloc/
          if-no-files-found: warn
          retention-days: 30
