name: M1 lifecycle qualification
on:
  pull_request:
    types: [synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHON: python
concurrency:
  group: qualification-${{ github.ref }}${{ github.event_name == 'pull_request' && (github.event.pull_request.draft && '-draft' || '-ready') || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lifecycle:
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 12 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; node24
        with:
          python-version: '3.11'
      - name: Install process-observer prerequisites
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-dev.txt
          python -c 'import os,sys; open(os.environ["GITHUB_ENV"],"a").write("PYTHON="+sys.executable+"\n")'
      - run: bun install --frozen-lockfile
      - run: |
          python tests/process_observer_test.py
      - run: rustup toolchain install 1.85.1 --profile minimal
      - run: bun run native:build
      - run: bun scripts/qualify-lifecycle.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; node24
        if: ${{ !cancelled() }}
        with:
          name: lifecycle-${{ matrix.target }}
          path: .bunly/qualification/lifecycle-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
