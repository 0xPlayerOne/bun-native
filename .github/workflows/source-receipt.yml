name: Pinned quality tool receipt
on:
  push:
    branches: [test/source-receipt-20261105-1255]
permissions:
  contents: read
jobs:
  export:
    if: ${{ vars.CI_BILLING_PAUSED == 'false' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9520477038da7b3a3bf88af9eef98ce6aeeb45ef
          persist-credentials: false
      - name: Install only the repository-hashed quality wheel and retain its public binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9520477038da7b3a3bf88af9eef98ce6aeeb45ef
          out="$RUNNER_TEMP/quality-receipt"
          mkdir -p "$out"
          python3 -m venv "$RUNNER_TEMP/native-quality"
          "$RUNNER_TEMP/native-quality/bin/pip" install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r scripts/quality/requirements.txt > "$out/install.log" 2>&1
          cp "$RUNNER_TEMP/native-quality/bin/ruff" "$out/ruff"
          cp scripts/quality/requirements.txt "$out/requirements.txt"
          "$out/ruff" --version > "$out/version.txt"
          git rev-parse HEAD HEAD^{tree} > "$out/source.txt"
          cd "$out"
          sha256sum ruff requirements.txt install.log version.txt source.txt > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pinned-ruff-0-17-3-linux-x64
          path: ${{ runner.temp }}/quality-receipt/
          if-no-files-found: error
          retention-days: 1
