name: Immutable source receipt
on:
  push:
    branches: [test/source-receipt-20261105-1255]
permissions:
  contents: read
jobs:
  export:
    if: ${{ vars.CI_BILLING_PAUSED == 'false' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9706eb685d6222c520f66927770cfc3359bcd07b
          persist-credentials: false
      - name: Export only immutable tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9706eb685d6222c520f66927770cfc3359bcd07b
          test "$(git rev-parse HEAD^{tree})" = ad5ceb516c69a2ce06d74e62a0be43aeaa60e248
          mkdir -p "$RUNNER_TEMP/source-receipt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source-receipt/source.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source-receipt/source-tree.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source-receipt/identity.txt"
          cd "$RUNNER_TEMP/source-receipt"
          sha256sum source.tar.gz source-tree.txt identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: immutable-main-9706eb68-source
          path: ${{ runner.temp }}/source-receipt/
          if-no-files-found: error
          retention-days: 1
