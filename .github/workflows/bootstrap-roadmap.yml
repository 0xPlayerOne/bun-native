name: Verify roadmap metadata

on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-roadmap.yml]
  workflow_dispatch:

permissions:
  issues: read

concurrency:
  group: bootstrap-roadmap-metadata
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == '0xPlayerOne/bunly'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify issues, milestones, labels, and references
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          import re
          import urllib.request

          repo = os.environ['TARGET_REPOSITORY']
          assert repo == '0xPlayerOne/bunly'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'bunly-roadmap-audit',
          }
          def collect(path):
              out = []
              page = 1
              while True:
                  sep = '&' if '?' in path else '?'
                  url = f'https://api.github.com/repos/{repo}{path}{sep}per_page=100&page={page}'
                  request = urllib.request.Request(url, headers=headers, method='GET')
                  with urllib.request.urlopen(request, timeout=30) as response:
                      rows = json.load(response)
                  out.extend(rows)
                  if len(rows) < 100:
                      return out
                  page += 1

          issues = [x for x in collect('/issues?state=all') if 'pull_request' not in x]
          by_number = {x['number']: x for x in issues}
          milestones = {x['number']: x for x in collect('/milestones?state=all')}
          labels = {x['name'] for x in collect('/labels')}
          expected_counts = {1:6, 2:4, 3:6, 4:5, 5:5, 6:6, 7:5, 8:5, 9:5, 10:4, 11:4, 12:3}
          expected_labels = {
              'type:epic', 'type:architecture', 'type:spike', 'type:feature',
              'type:test', 'type:benchmark', 'type:infra', 'type:docs',
              'phase:mvp', 'phase:webview', 'phase:adea',
              'priority:p0', 'priority:p1', 'priority:p2',
              'area:runtime', 'area:cef', 'area:tooling', 'area:ipc',
              'area:security', 'area:reload', 'area:packaging',
              'area:platform', 'area:webview', 'area:dx',
          }
          assert set(by_number) == set(range(1, 60)), 'Expected root and 58 implementation issues'
          assert set(milestones) == set(expected_counts), 'Unexpected milestone set'
          assert expected_labels <= labels, 'Missing planning labels'
          assert all(x['state'] == 'open' for x in issues), 'Unexpected closed issue'
          assert by_number[1]['milestone'] is None
          assert 'type:epic' in {x['name'] for x in by_number[1]['labels']}
          index = re.findall(r'^- \[ \] #(\d+)\b', by_number[1]['body'], flags=re.M)
          assert collections.Counter(map(int, index)) == collections.Counter(range(2, 60)), 'Roadmap index mismatch'

          counts = collections.Counter()
          contextual_dependencies = {}
          references_checked = 0
          for n in range(2, 60):
              item = by_number[n]
              match = re.match(r'^\[M(\d+)\] ', item['title'])
              assert match, f'Issue {n}: missing milestone prefix'
              m = int(match.group(1))
              assert item['milestone'] and item['milestone']['number'] == m, f'Issue {n}: wrong milestone'
              counts[m] += 1
              names = {x['name'] for x in item['labels']}
              for prefix in ('type:', 'priority:', 'area:'):
                  assert any(x.startswith(prefix) for x in names), f'Issue {n}: missing {prefix}'
              phase = 'phase:mvp' if m <= 9 else 'phase:webview' if m <= 11 else 'phase:adea'
              assert phase in names, f'Issue {n}: wrong phase'
              body = item.get('body') or ''
              for heading in ('## Outcome', '## Acceptance criteria', '## Dependencies', '## Validation'):
                  assert heading in body, f'Issue {n}: missing {heading}'
              assert '- [ ]' in body, f'Issue {n}: missing acceptance checklist'
              refs = {int(x) for x in re.findall(r'(?<!\w)#(\d+)\b', body)}
              assert refs <= set(by_number), f'Issue {n}: dangling references {refs - set(by_number)}'
              assert n not in refs, f'Issue {n}: self-reference'
              references_checked += len(refs)
              section = body.split('## Dependencies', 1)[1].split('\n## ', 1)[0]
              contextual_dependencies[n] = {int(x) for x in re.findall(r'(?<!\w)#(\d+)\b', section)} - {1}
          assert dict(counts) == expected_counts, f'Count mismatch: {dict(counts)}'

          visiting, visited = set(), set()
          def visit(node):
              assert node not in visiting, f'Dependency-section reference cycle at issue {node}'
              if node in visited:
                  return
              visiting.add(node)
              for dependency in contextual_dependencies.get(node, set()):
                  visit(dependency)
              visiting.remove(node)
              visited.add(node)
          for n in contextual_dependencies:
              visit(n)

          lines = []
          for m in sorted(milestones):
              item = milestones[m]
              assert item['title'].startswith(f'M{m} - ')
              assert item['state'] == 'open' and item['due_on'] is None
              assert item['description'], f'Milestone {m}: missing description'
              assert item['open_issues'] == counts[m] and item['closed_issues'] == 0
              line = f"{item['title']}: {counts[m]} open tasks; {item['html_url']}"
              lines.append(line)
              print(line, flush=True)
          summary = {
              'issues': len(issues),
              'roadmap_issues': 1,
              'implementation_issues': 58,
              'cef_mvp_tasks': sum(counts[m] for m in range(1, 10)),
              'post_mvp_tasks': sum(counts[m] for m in range(10, 13)),
              'milestones': len(milestones),
              'planning_labels': len(expected_labels),
              'issue_references_checked': references_checked,
              'roadmap_index_complete': True,
              'dependency_section_references_acyclic': True,
              'metadata_validation': 'passed',
          }
          print('VERIFIED ' + json.dumps(summary, sort_keys=True), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Bunly roadmap audit\n\n')
              out.write('```json\n' + json.dumps(summary, indent=2) + '\n```\n\n')
              out.write('\n'.join('- ' + line for line in lines) + '\n')
          PY
