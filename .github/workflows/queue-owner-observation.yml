# Research branch only. No required workflow or merge gate is replaced.
name: Windows idle transaction ownership observation
on:
  push:
    branches: [test/queue-owner-retention-20261104]
permissions:
  contents: read
jobs:
  observe:
    name: Fixed queue ownership contrast (not qualification)
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node scripts/install-bun.mjs --destination "$RUNNER_TEMP/bun-native-bun"
      - run: bun install --frozen-lockfile
      - name: Run every predeclared original and queue-ownership case once
        run: python experiments/queue-owner/run.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: queue-owner-${{ github.sha }}
          path: ${{ runner.temp }}/queue-owner-evidence/
          if-no-files-found: error
          retention-days: 7
