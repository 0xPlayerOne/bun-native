name: M3 CEF API typecheck
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cef-typecheck-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: CEF API check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: ${{ github.workspace }}/.bunly/cef-typecheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; node24
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .bunly/cef-typecheck
          key: ${{ runner.os }}-cef-api-rust191-${{ hashFiles('native/cef-host/Cargo.toml', 'native/cef-host/Cargo.lock') }}
      - name: Install pinned contributor compiler
        shell: bash
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Test navigation callback ordering without a browser dependency
        shell: bash
        run: |
          mkdir -p .bunly
          rustup run 1.91.0 rustc --edition=2021 --test native/cef-host/src/navigation.rs -o .bunly/navigation-tests${{ runner.os == 'Windows' && '.exe' || '' }}
          .bunly/navigation-tests${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Typecheck native APIs without downloading or linking CEF
        shell: bash
        # Upstream's documentation feature skips browser acquisition/linking.
        # These artifacts are never packaged or executed; the separate native
        # workflow must still build and run with real CEF and sandbox support.
        run: |
          cargo +1.91.0 check --locked --manifest-path native/cef-host/Cargo.toml --all-targets --features packaging,cef/dox
          cargo +1.91.0 check --locked --manifest-path native/cef-host/Cargo.toml --all-targets --features packaging,browser-actions,cef/dox
