name: M1 foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Validate runtime and target
        run: |
          test "$(bun --version)" = "1.4.3"
          test "$(bun -e 'console.log(`${process.platform}-${process.arch}`)')" = "${{ matrix.target }}"
      - name: Install pinned dependencies
        id: dependencies
        run: bun install
      - name: Dependency lock evidence
        if: matrix.target == 'linux-x64'
        run: |
          echo 'BUNLY_LOCK_BEGIN'
          cat bun.lock
          echo 'BUNLY_LOCK_END'
      - name: Typecheck, lint, boundaries, tests, and compiler-free build
        run: |
          bun run check
          bun run typecheck:browser
          bun run example
          bun packages/cli/dist/main.js doctor
      - name: Install framework-contributor toolchain
        id: toolchain
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Build and test real native probe
        id: native
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cargo test --locked --manifest-path native/Cargo.toml
          cargo build --locked --manifest-path native/Cargo.toml --release
      - name: Qualify Bun FFI, Node-API, and subprocess handoff
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: bun run qualify:host
      - name: Package and consume verified native probe
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: bun run artifact:probe
      - name: Preserve qualification evidence and native artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m1-${{ matrix.target }}
          path: |
            .bunly/qualification/*.json
            .bunly/artifacts/**
            bun.lock
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
