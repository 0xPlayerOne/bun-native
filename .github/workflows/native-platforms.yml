        run: |
          bun scripts/quality/macos-feature-evidence.ts --evidence $env:NATIVE_EVIDENCE `
            --source $env:GITHUB_WORKSPACE --host $env:BUN_NATIVE_HOST `
            --output (Join-Path $env:NATIVE_EVIDENCE 'macos-feature-record.json')
          if ($LASTEXITCODE -ne 0) { throw 'The macOS feature evidence is incomplete or not bound to this source' }
      - name: Development and AOT macOS Solid and React workspace references (#248, #250)
        if: ${{ matrix.shard == 1 && (runner.os == 'macOS' && !cancelled() && steps.native-build.outcome == 'success') }}
        timeout-minutes: 12
        run: |
          # The Linux workspace scenarios, unchanged, driven by CoreGraphics
          # pointer, wheel and key events and Accessibility resize/close.
          if (-not (Get-Command magick -ErrorAction SilentlyContinue) -and -not (Get-Command convert -ErrorAction SilentlyContinue)) {
            brew install imagemagick
            if ($LASTEXITCODE -ne 0) { throw 'ImageMagick for the workspace pixel checks did not install' }
          }
          # The fixtures open 1000x760 and 1120x760 windows, which AppKit fits
          # to the hosted 1024x768 display. Use the smallest 1x desktop mode that
          # holds them for this step only, and restore the original afterwards.
          $oracle = Join-Path $env:NATIVE_EVIDENCE 'macos-workspace-display-oracle'
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework CoreGraphics `
            -framework ApplicationServices tests/native/macos-display-oracle.m -o $oracle
          if ($LASTEXITCODE -ne 0) { throw 'The display oracle did not compile' }
          $main = (& $oracle screens | ConvertFrom-Json) | Where-Object { $_.main } | Select-Object -First 1
          if (!$main) { throw 'No main display is available' }
          $modes = & $oracle modes $main.number | ConvertFrom-Json
          $original = $modes.currentIndex
          $large = $modes.modes | Where-Object { $_.pixelWidth -eq $_.width -and $_.width -ge 1200 -and $_.height -ge 900 } |
            Sort-Object { $_.width * $_.height } | Select-Object -First 1
          if (!$large) { throw 'The hosted display offers no desktop mode that holds the workspace fixtures' }
          # Record the session's held modifier flags around each display change:
          # the OS input helper refuses to inject while any is held.
          $flags = { & '${{ matrix.python }}' -c "import ctypes; a=ctypes.CDLL('/System/Library/Frameworks/ApplicationServices.framework/ApplicationServices'); a.CGEventSourceFlagsState.restype=ctypes.c_uint64; print(hex(a.CGEventSourceFlagsState(0)))" }
          Write-Output "modifier flags before the display change: $(& $flags)"
          try {
            if ($modes.current.height -lt 900 -or $modes.current.width -lt 1200) {
              & $oracle set $main.number $large.index | Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'workspace-display-mode.json')
              if ($LASTEXITCODE -ne 0) { throw 'The workspace display mode was not applied' }
              Start-Sleep -Seconds 2
              Write-Output "modifier flags after the display change: $(& $flags)"
            }
            $failed = @()
            foreach ($scenario in @('react-workspace', 'solid-workspace')) {
              $package = Join-Path $env:NATIVE_EVIDENCE "$scenario-flow-package"
              bun experiments/aot-gpui/build-window.ts --entry "$scenario-flow" `
                --source $env:GITHUB_WORKSPACE --host $env:BUN_NATIVE_HOST `
                --host-profile release --outdir $package
              if ($LASTEXITCODE -ne 0) { throw "The macOS $scenario AOT compiler or inspection failed" }
              foreach ($mode in @('development', 'aot')) {
                [string[]]$command = if ($mode -eq 'aot') { @((Join-Path $package "$scenario-flow")) } else { @('bun', (Join-Path $package 'development/application.js')) }
                & '${{ matrix.python }}' scripts/quality/native-workspace-macos.py `
                  --scenario $scenario --mode $mode `
                  --output (Join-Path $env:NATIVE_EVIDENCE "$scenario-macos-$mode") -- @command
                if ($LASTEXITCODE -ne 0) { $failed += "$scenario $mode (exit $LASTEXITCODE)" }
              }
            }
            # Every case runs so one failure does not hide the others' evidence.
            if ($failed) { throw "macOS workspace references not verified: $($failed -join ', ')" }
          } finally {
            if ($original -ge 0) { & $oracle set $main.number $original | Out-Null }
            Write-Output "modifier flags after the restore: $(& $flags)"
          }
      - name: Development and AOT macOS Solid and React workspace long sessions (#248, #250)
        if: ${{ matrix.shard == 1 && (runner.os == 'macOS' && !cancelled() && steps.native-build.outcome == 'success') }}
        timeout-minutes: 13
        run: |
          # A bounded long session of each workspace soak fixture on the same
          # hosted macOS VM (not a physical Mac), timed apart from the
          # reference scenarios above so they keep their own deadline.
          # The fixtures open 1000x760 and 1120x760 windows, which AppKit fits
          # to the hosted 1024x768 display. Use the smallest 1x desktop mode that
          # holds them for this step only, and restore the original afterwards.
          $oracle = Join-Path $env:NATIVE_EVIDENCE 'macos-workspace-display-oracle'
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework CoreGraphics `
            -framework ApplicationServices tests/native/macos-display-oracle.m -o $oracle
          if ($LASTEXITCODE -ne 0) { throw 'The display oracle did not compile' }
          $main = (& $oracle screens | ConvertFrom-Json) | Where-Object { $_.main } | Select-Object -First 1
          if (!$main) { throw 'No main display is available' }
          $modes = & $oracle modes $main.number | ConvertFrom-Json
          $original = $modes.currentIndex
          $large = $modes.modes | Where-Object { $_.pixelWidth -eq $_.width -and $_.width -ge 1200 -and $_.height -ge 900 } |
            Sort-Object { $_.width * $_.height } | Select-Object -First 1
          if (!$large) { throw 'The hosted display offers no desktop mode that holds the workspace fixtures' }
          # Record the session's held modifier flags around each display change:
          # the OS input helper refuses to inject while any is held.
          $flags = { & '${{ matrix.python }}' -c "import ctypes; a=ctypes.CDLL('/System/Library/Frameworks/ApplicationServices.framework/ApplicationServices'); a.CGEventSourceFlagsState.restype=ctypes.c_uint64; print(hex(a.CGEventSourceFlagsState(0)))" }
          Write-Output "modifier flags before the display change: $(& $flags)"
          try {
            if ($modes.current.height -lt 900 -or $modes.current.width -lt 1200) {
              & $oracle set $main.number $large.index | Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'workspace-display-mode.json')
              if ($LASTEXITCODE -ne 0) { throw 'The workspace display mode was not applied' }
              Start-Sleep -Seconds 2
              Write-Output "modifier flags after the display change: $(& $flags)"
            }
            $failed = @()
            # The fixed soak round repeated for 120 s per framework and mode,
            # with one CoreGraphics-typed entry, Return and 24 wheel notches per
            # round through the bounded helper, sampled every 10 s.
            foreach ($framework in @('solid', 'react')) {
              $package = Join-Path $env:NATIVE_EVIDENCE "$framework-workspace-soak-package"
              bun experiments/aot-gpui/build-window.ts --entry "$framework-workspace-soak" `
                --source $env:GITHUB_WORKSPACE --host $env:BUN_NATIVE_HOST `
                --host-profile release --outdir $package
              if ($LASTEXITCODE -ne 0) { throw "The macOS $framework soak AOT compiler or inspection failed" }
              foreach ($mode in @('development', 'aot')) {
                [string[]]$command = if ($mode -eq 'aot') { @((Join-Path $package "$framework-workspace-soak")) } else { @('bun', (Join-Path $package 'development/application.js')) }
                $evidence = Join-Path $env:NATIVE_EVIDENCE "$framework-workspace-session-macos-$mode"
                New-Item -ItemType Directory -Path $evidence | Out-Null
                $env:BUN_NATIVE_DIAGNOSTICS_DIR = $evidence
                $env:BUN_NATIVE_SOAK_SECONDS = '120'
                $env:BUN_NATIVE_SOAK_SAMPLE_SECONDS = '10'
                $env:BUN_NATIVE_SOAK_OS_INPUT = '1'
                $env:BUN_NATIVE_PHASE_TRACE = Join-Path $evidence 'phases.json'
                try {
                  & $command[0] @($command | Select-Object -Skip 1) *> (Join-Path $evidence 'fixture.log')
                  $exit = $LASTEXITCODE
                } finally {
                  Remove-Item Env:BUN_NATIVE_DIAGNOSTICS_DIR, Env:BUN_NATIVE_SOAK_SECONDS, Env:BUN_NATIVE_SOAK_SAMPLE_SECONDS, Env:BUN_NATIVE_SOAK_OS_INPUT, Env:BUN_NATIVE_PHASE_TRACE
                }
                if ($exit -ne 0) {
                  Get-Content (Join-Path $evidence 'fixture.log') -Tail 40
                  $failed += "$framework long session $mode (exit $exit)"
                  continue
                }
                & '${{ matrix.python }}' "scripts/quality/native-$framework-workspace-soak.py" `
                  (Join-Path $evidence 'soak-result.json') --long-session 120 `
                  --phases (Join-Path $evidence 'phases.json') |
                  Tee-Object -FilePath (Join-Path $evidence 'summary.json')
                if ($LASTEXITCODE -ne 0) { $failed += "$framework long session $mode check" }
              }
            }
            # Every case runs so one failure does not hide the others' evidence.
            if ($failed) { throw "macOS workspace long sessions not verified: $($failed -join ', ')" }
          } finally {
            if ($original -ge 0) { & $oracle set $main.number $original | Out-Null }
            Write-Output "modifier flags after the restore: $(& $flags)"
          }
      - name: Development and AOT Windows React and Solid workspace references (#248, #250)
        if: ${{ matrix.shard == 1 && (runner.os == 'Windows' && !cancelled() && steps.native-build.outcome == 'success') }}
        timeout-minutes: 15
        run: |
          # The Linux workspace scenarios, unchanged, driven by SendInput,
          # SetWindowPos and the system Close command on the owned window.
          if (-not (Get-Command magick -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:\Program Files\ImageMagick-*\magick.exe')) {
            choco install imagemagick --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'ImageMagick for the workspace pixel checks did not install' }
          }
          # The fixtures open 1000x760 and 1120x760 client areas, which with
          # their frames do not fit the hosted 1024x768 display. Use the smallest
          # mode that holds them for this step only, then restore the registry mode.
          $oracle = (Resolve-Path 'tests/native/windows-display-oracle.ps1').Path
          $display = { pwsh -NoProfile -NonInteractive -File $oracle @args }
          $primary = (& $display screens | ConvertFrom-Json).screens | Where-Object { $_.primary } | Select-Object -First 1
          if (!$primary) { throw 'No primary display is available' }
          $modes = & $display modes -Device $primary.deviceName | ConvertFrom-Json
          $large = $modes.modes | Where-Object {
            $_.width -ge 1280 -and $_.height -ge 960 -and `
            $_.bitsPerPel -eq $modes.current.bitsPerPel -and $_.frequency -eq $modes.current.frequency
          } | Sort-Object { $_.width * $_.height } | Select-Object -First 1
          $changed = $false
          try {
            if ($modes.current.width -lt 1280 -or $modes.current.height -lt 960) {
              if (!$large) { throw 'The hosted display offers no mode that holds the workspace fixture' }
              & $display set -Device $primary.deviceName -Width $large.width -Height $large.height |
                Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'workspace-display-mode.json')
              if ($LASTEXITCODE -ne 0) { throw 'The workspace display mode was not applied' }
              $changed = $true
              Start-Sleep -Seconds 2
            }
            $failed = @()
            foreach ($scenario in @('react-workspace', 'solid-workspace')) {
              $package = Join-Path $env:NATIVE_EVIDENCE "$scenario-flow-windows-package"
              bun experiments/aot-gpui/build-window.ts --entry "$scenario-flow" `
                --source $env:GITHUB_WORKSPACE --host $env:BUN_NATIVE_HOST `
                --host-profile release --outdir $package
              if ($LASTEXITCODE -ne 0) { throw "The Windows $scenario AOT compiler or inspection failed" }
              $manifest = Get-Content -Raw (Join-Path $package 'manifest.json') | ConvertFrom-Json
              foreach ($mode in @('development', 'aot')) {
                [string[]]$command = if ($mode -eq 'aot') { @((Join-Path $package $manifest.application.file)) } else { @('bun', (Join-Path $package 'development/application.js')) }
                & '${{ matrix.python }}' scripts/quality/native-workspace-windows.py `
                  --scenario $scenario --mode $mode `
                  --output (Join-Path $env:NATIVE_EVIDENCE "$scenario-windows-$mode") -- @command
                if ($LASTEXITCODE -ne 0) { $failed += "$scenario $mode (exit $LASTEXITCODE)" }
              }
            }
            # Every case runs so one failure does not hide the others' evidence.
            if ($failed) { throw "Windows workspace references not verified: $($failed -join ', ')" }
          } finally {
            if ($changed) { & $display restore -Device $primary.deviceName | Out-Null }
          }
      - name: Retain unsigned native host for reproducibility
        if: ${{ matrix.shard == 1 && (!cancelled() && steps.native-build.outcome == 'success') }}
        run: |
          $archive = Join-Path $env:NATIVE_EVIDENCE 'unsigned-native-host.tar.gz'
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
