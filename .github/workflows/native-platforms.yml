      # 43093920340). Windows stays experimental until it passes there (#629);
      # its failure is reported in the step outcome without failing the job.
      # Neither replaces or relaxes the AX/UI Automation step above.
      - name: macOS VoiceOver and experimental Windows NVDA speech in development and AOT (#241)
        id: screen-reader
        if: ${{ matrix.shard == 2 && (!cancelled() && steps.native-build.outcome == 'success') }}
        continue-on-error: ${{ runner.os == 'Windows' }}
        timeout-minutes: 15
        run: |
          if ($IsMacOS) {
            bash scripts/quality/macos-voiceover-setup.sh (Join-Path $env:NATIVE_EVIDENCE 'voiceover-setup')
            if ($LASTEXITCODE -ne 0) { throw 'VoiceOver AppleScript control could not be enabled on this runner' }
            $driver = Join-Path $env:NATIVE_EVIDENCE 'macos-input-oracle'
            xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework Carbon `
              tests/native/macos-input-oracle.m -o $driver
            if ($LASTEXITCODE -ne 0) { throw 'The macOS input controller did not compile' }
            $env:BUN_NATIVE_SR_INPUT = $driver
            # The independent AX client reads the host's AXFocusedUIElement at
            # every focus step, separating host exposure from VoiceOver speech.
            $axOracle = Join-Path $env:NATIVE_EVIDENCE 'macos-accessibility-oracle'
            if (-not (Test-Path $axOracle)) {
              xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework ApplicationServices `
                tests/native/macos-accessibility-oracle.m -o $axOracle
              if ($LASTEXITCODE -ne 0) { throw 'The independent Accessibility client did not compile' }
            }
            $env:BUN_NATIVE_A11Y_ORACLE = $axOracle
          } else {
            # NV Access's signed NVDA 2024.4.2 launcher, pinned by SHA-256. Its
            # NSIS payload holds the complete program directory, which runs
            # without installation.
            $installer = Join-Path $env:RUNNER_TEMP 'nvda_2024.4.2.exe'
            Invoke-WebRequest -Uri 'https://download.nvaccess.org/releases/2024.4.2/nvda_2024.4.2.exe' -OutFile $installer
            $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
            if ($hash -ne 'b66bbc3d87f11140fe9493ca22955c401c0b09abd0bf3c9d49260807986d4f05') {
              throw "The NVDA download hash $hash does not match the pin"
            }
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid') { throw "The NVDA launcher signature is $($signature.Status)" }
            $nvda = Join-Path $env:RUNNER_TEMP 'nvda'
            7z x -y "-o$nvda" $installer | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'The NVDA launcher did not extract' }
            $env:BUN_NATIVE_NVDA = Join-Path $nvda '$PLUGINSDIR\app\nvda_noUIAccess.exe'
            if (-not (Test-Path -LiteralPath $env:BUN_NATIVE_NVDA)) { throw 'nvda_noUIAccess.exe is not in the NVDA launcher' }
            $env:BUN_NATIVE_SR_INPUT = (Resolve-Path 'tests/native/windows-input-oracle.ps1').Path
            [ordered]@{ version = '2024.4.2'; sha256 = $hash; signer = $signature.SignerCertificate.Subject } |
              ConvertTo-Json | Out-File (Join-Path $env:NATIVE_EVIDENCE 'nvda-download.json')
          }
          $package = Join-Path $env:NATIVE_EVIDENCE 'screen-reader-package'
          bun experiments/aot-gpui/build-window.ts --entry screen-reader `
            --source $env:GITHUB_WORKSPACE --host $env:BUN_NATIVE_HOST `
            --host-profile release --outdir $package
          if ($LASTEXITCODE -ne 0) { throw 'The screen-reader AOT compiler or inspection failed' }
          $manifest = Get-Content -Raw (Join-Path $package 'manifest.json') | ConvertFrom-Json
          try {
            foreach ($mode in @('development', 'aot')) {
              $evidence = Join-Path $env:NATIVE_EVIDENCE "screen-reader-$mode"
              New-Item -ItemType Directory $evidence | Out-Null
              $env:BUN_NATIVE_SR_EVIDENCE = $evidence
              $env:BUN_NATIVE_SR_MODE = $mode
              if ($mode -eq 'development') {
                bun tests/native/screen-reader.ts 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'run.log')
              } else {
                & (Join-Path $package $manifest.application.file) 2>&1 |
                  Tee-Object -FilePath (Join-Path $evidence 'run.log')
              }
              if ($LASTEXITCODE -ne 0) { throw "${{ runner.os }} $mode screen-reader qualification failed" }
              $report = Get-Content -Raw (Join-Path $evidence 'result.json') | ConvertFrom-Json
              if ($report.status -ne 'passed' -or $report.mode -ne $mode) {
                throw "${{ runner.os }} $mode screen-reader evidence does not record a pass"
              }
            }
          } finally {
            # Never leave a screen reader running into later steps.
            if ($IsMacOS) {
              osascript -e 'tell application "VoiceOver" to quit' 2>$null
              pkill -15 -x VoiceOver
            } else {
              Get-Process -Name 'nvda*' -ErrorAction SilentlyContinue | Stop-Process -Force
            }
            $global:LASTEXITCODE = 0
          }
