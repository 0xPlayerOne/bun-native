name: Native Platforms

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-platforms-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: GPUI release and native paint (${{ matrix.os }})
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: python3
            binary: bun-native-host
            application: platform-smoke
          - os: windows-2022
            python: python
            binary: bun-native-host.exe
            application: platform-smoke.exe
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: 0
      BUN_NATIVE_HOST_PROFILE: release
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare bounded evidence location
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'bun-native-platform-evidence'
          New-Item -ItemType Directory $evidence | Out-Null
          "NATIVE_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          @{
            source = (git rev-parse HEAD)
            platform = [Runtime.InteropServices.RuntimeInformation]::OSDescription
            architecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            imageOS = $env:ImageOS
            imageVersion = $env:ImageVersion
            node = (node --version)
            phase = 'before Bun bootstrap; native build and input not yet verified'
          } | ConvertTo-Json | Out-File (Join-Path $evidence 'bootstrap-environment.json')
      - name: Install checksum-pinned Bun compiler
        run: node scripts/install-bun.mjs --destination (Join-Path $env:RUNNER_TEMP 'bun-native-bun')
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify Xcode and precompiled Metal tools
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          xcodebuild -version | Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'xcode.txt')
          if ($LASTEXITCODE -ne 0) { throw 'A complete Xcode toolchain is required' }
          xcrun --sdk macosx --show-sdk-path | Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'macos-sdk.txt')
          if ($LASTEXITCODE -ne 0) { throw 'The macOS SDK is unavailable' }
          xcrun --sdk macosx metal --version
          if ($LASTEXITCODE -ne 0) {
            xcodebuild -downloadComponent MetalToolchain 2>&1 |
              Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'metal-toolchain-install.log')
            if ($LASTEXITCODE -ne 0) { throw 'The hosted Xcode Metal component could not be installed' }
          }
          xcrun --sdk macosx metal --version |
            Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'metal-version.txt')
          if ($LASTEXITCODE -ne 0) { throw 'GPUI requires the Xcode Metal compiler' }
          xcrun --sdk macosx --find metallib
          if ($LASTEXITCODE -ne 0) { throw 'GPUI requires the Xcode metallib linker' }
      - name: Locate the installed Windows SDK shader compiler
        if: runner.os == 'Windows'
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $fxc = Get-ChildItem -Directory $sdk |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64/fxc.exe' } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (!$fxc) { throw 'GPUI release shaders require the Windows SDK fxc.exe' }
          "GPUI_FXC_PATH=$fxc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item -LiteralPath $fxc | Select-Object FullName,Length,VersionInfo |
            Format-List | Out-File (Join-Path $env:NATIVE_EVIDENCE 'windows-sdk.txt')
          Get-FileHash -Algorithm SHA256 -LiteralPath $fxc |
            Format-List | Out-File (Join-Path $env:NATIVE_EVIDENCE 'fxc-sha256.txt')
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: gpui-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.json', 'bun.lock', 'rust-toolchain.toml', 'Cargo.lock') }}
      - run: bun install --frozen-lockfile
      # Dependency build outputs come from the last protected-main build of the
      # same lockfile and toolchain. Workspace crates still rebuild from this
      # checkout. The scheduled audit restores nothing, keeping a cold build.
      - name: Restore release dependency build outputs
        id: target-cache
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/build
            target/release/deps
            target/release/.fingerprint
          key: native-release-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'native/vendor/**') }}
          # Only pull requests fall back to an older key; main rebuilds cold
          # after a lockfile or toolchain change, so stale outputs never pile up.
          restore-keys: ${{ github.event_name == 'pull_request' && format('native-release-target-{0}-{1}-', runner.os, runner.arch) || '' }}
      - name: Check portable paint guards on the actual target Python
        run: |
          & '${{ matrix.python }}' -m unittest discover -s tests/quality -p 'test_native_platform*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Portable evidence guard tests failed' }
      - name: Record source and actual target tools
        run: |
          & {
            git rev-parse HEAD
            "ImageOS=$env:ImageOS"
            "ImageVersion=$env:ImageVersion"
            [Runtime.InteropServices.RuntimeInformation]::OSDescription
            bun --revision
            rustc --version --verbose
            cargo --version
            & '${{ matrix.python }}' --version
            bun -e 'console.log(JSON.stringify({os:process.platform,arch:process.arch,hostProfile:"release",scope:"native paint/lifecycle and separate owned OS-input qualification; results recorded per phase"}))'
          } | Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'toolchain.txt')
      - name: Keep the runner's Cargo home path out of native binaries
        # Dependency panic locations otherwise embed CARGO_HOME verbatim; see
        # docs/reproducible-builds.md.
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          "CARGO_ENCODED_RUSTFLAGS=--remap-path-prefix=$cargoHome=/cargo" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the genuine target-platform GPUI executable
        id: native-build
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          cargo build --locked --release -p bun-native-host 2>&1 |
            Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'native-build.log')
          $code = $LASTEXITCODE
          $timer.Stop()
          @{ elapsedMs = $timer.Elapsed.TotalMilliseconds; exitCode = $code; profile = 'release'; targetCacheKey = '${{ steps.target-cache.outputs.cache-matched-key || 'none' }}' } |
            ConvertTo-Json | Out-File (Join-Path $env:NATIVE_EVIDENCE 'native-build.json')
          if ($code -ne 0) { throw "Native build failed: $code" }
          $hostPath = (Resolve-Path 'target/release/${{ matrix.binary }}').Path
          "BUN_NATIVE_HOST=$hostPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $hostPath | Select-Object Name,Length |
            ConvertTo-Json | Out-File (Join-Path $env:NATIVE_EVIDENCE 'native-size.json')
          Get-FileHash -Algorithm SHA256 $hostPath |
            Format-List | Out-File (Join-Path $env:NATIVE_EVIDENCE 'native-sha256.txt')
      - name: Lint and test actual platform host
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed' }
          cargo clippy --locked --release -p bun-native-host --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native host Clippy failed' }
          cargo test --locked --release -p bun-native-host
          if ($LASTEXITCODE -ne 0) { throw 'Native host tests failed' }
      - name: Save release dependency build outputs from protected main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/build
            target/release/deps
            target/release/.fingerprint
          key: native-release-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'native/vendor/**') }}
      - name: Verify native macOS layer invalidation and assigned Metal identity
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          cargo clippy --locked --release -p bun-native-macos-surface --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native surface Clippy failed' }
          cargo test --locked --release -p bun-native-macos-surface
          if ($LASTEXITCODE -ne 0) { throw 'Native surface ownership tests failed' }
          cargo build --locked --release -p bun-native-macos-surface --example invalidation-control
          if ($LASTEXITCODE -ne 0) { throw 'Actual Core Animation control did not compile' }
          & target/release/examples/invalidation-control 2>&1 |
            Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'layer-invalidation-control.log')
          if ($LASTEXITCODE -ne 0) { throw 'Actual layer invalidation controls failed' }
          & target/release/examples/invalidation-control --omit-invalidation 2>&1 |
            Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'layer-invalidation-negative.log')
          $code = $LASTEXITCODE
          $negative = Get-Content -Raw (Join-Path $env:NATIVE_EVIDENCE 'layer-invalidation-negative.log')
          if ($code -eq 0 -or $negative -notmatch 'committed surface did not become dirty') {
            throw 'Omitting invalidation did not fail at the intended native dirty-state assertion'
          }
          $global:LASTEXITCODE = 0
      - name: Development actual native paint and lifecycle
        timeout-minutes: 3
        run: |
          $telemetry = @()
          if ($IsMacOS) { $telemetry += '--require-metal-device' }
          & '${{ matrix.python }}' scripts/quality/native-platform-smoke.py `
            --output (Join-Path $env:NATIVE_EVIDENCE 'development') `
            --mode development --host-profile release @telemetry -- bun tests/native/platform-smoke.ts
          if ($LASTEXITCODE -ne 0) { throw 'Development native paint/lifecycle was not verified' }
      - name: Build the bounded macOS OS controller
        if: runner.os == 'macOS'
        run: |
          $eventTest = Join-Path $env:NATIVE_EVIDENCE 'macos-input-events'
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework CoreGraphics -framework ApplicationServices `
            tests/native/macos-input-events.m -o $eventTest
          if ($LASTEXITCODE -ne 0) { throw 'The actual macOS SDK pointer and target-guard control did not compile' }
          & $eventTest | Out-File (Join-Path $env:NATIVE_EVIDENCE 'macos-pointer-events.json')
          if ($LASTEXITCODE -ne 0) { throw 'The actual Quartz event or exact-window target controls failed' }
          $hitTest = Join-Path $env:NATIVE_EVIDENCE 'macos-window-hit'
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework CoreGraphics -framework ApplicationServices `
            tests/native/macos-window-hit.m -o $hitTest
          if ($LASTEXITCODE -ne 0) { throw 'The actual AppKit window hit-test control did not compile' }
          & $hitTest | Out-File (Join-Path $env:NATIVE_EVIDENCE 'macos-window-hit.json')
          if ($LASTEXITCODE -ne 0) { throw 'The owned click-through/input-taking window controls failed' }
          $foreignTest = Join-Path $env:NATIVE_EVIDENCE 'macos-cross-process-hit'
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework CoreGraphics -framework ApplicationServices `
            tests/native/macos-cross-process-hit.m -o $foreignTest
          if ($LASTEXITCODE -ne 0) { throw 'The foreign-process AppKit target control did not compile' }
          & $foreignTest | Out-File (Join-Path $env:NATIVE_EVIDENCE 'macos-cross-process-hit.json')
          if ($LASTEXITCODE -ne 0) { throw 'The foreign-process mouse-down target was not independently verified' }
          $helper = Join-Path $env:NATIVE_EVIDENCE 'native-platform-macos'
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework CoreGraphics -framework ApplicationServices `
            scripts/quality/native-platform-macos.m -o $helper
          if ($LASTEXITCODE -ne 0) { throw 'The actual macOS SDK controller did not compile' }
          "BUN_NATIVE_PLATFORM_HELPER=$helper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-FileHash -Algorithm SHA256 $helper |
            Format-List | Out-File (Join-Path $env:NATIVE_EVIDENCE 'os-helper-sha256.txt')
      - name: Development owned native window and OS input
        timeout-minutes: 3
        env:
          BUN_NATIVE_POINTER_TRACE: ${{ runner.os == 'macOS' && '1' || '0' }}
          BUN_NATIVE_STARTUP_TRACE: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          $telemetry = @()
          if ($IsMacOS) { $telemetry += '--require-metal-device' }
          & '${{ matrix.python }}' scripts/quality/native-platform-smoke.py `
            --output (Join-Path $env:NATIVE_EVIDENCE 'development-input') `
            --mode development --host-profile release --os-input @telemetry -- bun tests/native/platform-smoke.ts
          if ($LASTEXITCODE -ne 0) { throw 'Actual owned window/pointer/keyboard input was not verified; inspect the precise unsupported or failed report' }
      - name: Prove a wrong native paint expectation fails
        timeout-minutes: 3
        run: |
          $out = Join-Path $env:NATIVE_EVIDENCE 'negative-paint'
          & '${{ matrix.python }}' scripts/quality/native-platform-smoke.py `
            --output $out --negative-paint-check `
            --mode development --host-profile release -- bun tests/native/platform-smoke.ts
          $code = $LASTEXITCODE
          $report = Get-Content -Raw (Join-Path $out 'result.json') | ConvertFrom-Json
          if ($code -eq 0 -or $report.status -ne 'failed' -or `
              $report.error.type -ne 'NativePaintMismatch' -or `
              $report.nativeShutdownAndExitVerified -ne $true -or `
              $report.forcedApplicationTermination -ne $false) {
            throw 'The deliberately invalid native expectation did not fail and clean up precisely'
          }
          $global:LASTEXITCODE = 0
      - name: Compile and inspect the exact native fixture through Bun AOT
        run: |
          $package = Join-Path $env:NATIVE_EVIDENCE 'aot-package'
          bun experiments/aot-gpui/build-window.ts --entry platform-smoke `
            --source $env:GITHUB_WORKSPACE --host $env:BUN_NATIVE_HOST `
            --host-profile release --outdir $package
          if ($LASTEXITCODE -ne 0) { throw 'The genuine AOT compiler or inspection failed' }
          $manifest = Get-Content -Raw (Join-Path $package 'manifest.json') | ConvertFrom-Json
          if ($manifest.application.inspection.hasCompiledProgram -ne $true -or `
              !$manifest.application.runtimeFeatures -or `
              $manifest.application.runtimeFeatures.jit -eq 'present' -or `
              $manifest.application.runtimeFeatures.jitRemovedRanges.count -le 0) {
            throw 'Actual AOT compiled-program and JIT-removal evidence is required on this target'
          }
      - name: AOT actual native paint and lifecycle
        timeout-minutes: 3
        run: |
          $telemetry = @()
          if ($IsMacOS) { $telemetry += '--require-metal-device' }
          & '${{ matrix.python }}' scripts/quality/native-platform-smoke.py `
            --output (Join-Path $env:NATIVE_EVIDENCE 'aot') `
            --mode aot --host-profile release @telemetry -- `
            (Join-Path $env:NATIVE_EVIDENCE 'aot-package/${{ matrix.application }}')
          if ($LASTEXITCODE -ne 0) { throw 'AOT native paint/lifecycle was not verified' }
      - name: AOT owned native window and OS input
        timeout-minutes: 3
        env:
          BUN_NATIVE_POINTER_TRACE: ${{ runner.os == 'macOS' && '1' || '0' }}
          BUN_NATIVE_STARTUP_TRACE: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          $telemetry = @()
          if ($IsMacOS) { $telemetry += '--require-metal-device' }
          & '${{ matrix.python }}' scripts/quality/native-platform-smoke.py `
            --output (Join-Path $env:NATIVE_EVIDENCE 'aot-input') `
            --mode aot --host-profile release --os-input @telemetry -- `
            (Join-Path $env:NATIVE_EVIDENCE 'aot-package/${{ matrix.application }}')
          if ($LASTEXITCODE -ne 0) { throw 'Actual AOT window/pointer/keyboard input was not verified; inspect the precise unsupported or failed report' }
      - name: Owned process unit tests on real ${{ runner.os }} children
        if: ${{ runner.os != 'Linux' && !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          cargo test --locked --release -p bun-native-host services::processes -- --test-threads=1 2>&1 |
            Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'processes-unit.log')
          if ($LASTEXITCODE -ne 0) { throw '${{ runner.os }} owned process unit tests failed' }
      - name: Windows filesystem grant and service unit tests on NTFS
        if: ${{ runner.os == 'Windows' && !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          cargo test --locked --release -p bun-native-windows-services -p bun-native-host services::files -- --test-threads=1 2>&1 |
            Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'filesystem-grants-unit.log')
          if ($LASTEXITCODE -ne 0) { throw 'Windows filesystem grant unit tests failed' }
      - name: Windows task dialog unit tests
        if: ${{ runner.os == 'Windows' && !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          cargo test --locked --release -p bun-native-windows-services -p bun-native-host task_dialog -- --test-threads=1 2>&1 |
            Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'task-dialog-unit.log')
          if ($LASTEXITCODE -ne 0) { throw 'Windows task dialog unit tests failed' }
      - name: Windows OS message dialogs through TaskDialogIndirect (#239)
        if: ${{ runner.os == 'Windows' && !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          $evidence = Join-Path $env:NATIVE_EVIDENCE 'task-dialogs'
          New-Item -ItemType Directory $evidence | Out-Null
          $env:BUN_NATIVE_TASK_DIALOG_EVIDENCE = $evidence
          $env:BUN_NATIVE_WINDOWS_DIALOG_ORACLE = (Resolve-Path 'tests/native/windows-dialog-oracle.ps1').Path
          bun tests/native/task-dialogs.ts 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'run.log')
          if ($LASTEXITCODE -ne 0) { throw 'Windows OS message dialogs were not verified' }
      - name: Development and AOT macOS native fault containment
        if: ${{ runner.os == 'macOS' && !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          # Real OS click parks a public callback; the owned host is SIGSTOPped,
          # two batches queue behind it, then it is SIGKILLed (#247).
          $package = Join-Path $env:NATIVE_EVIDENCE 'fault-package'
          bun experiments/aot-gpui/build-window.ts --entry fault `
            --source $env:GITHUB_WORKSPACE --host $env:BUN_NATIVE_HOST `
            --host-profile release --outdir $package
          if ($LASTEXITCODE -ne 0) { throw 'The macOS fault AOT compiler or inspection failed' }
          foreach ($mode in @('development', 'aot')) {
            [string[]]$command = if ($mode -eq 'aot') { @((Join-Path $package 'fault')) } else { @('bun', 'tests/native/fault.ts') }
            & '${{ matrix.python }}' scripts/quality/native-fault-macos.py `
              --output (Join-Path $env:NATIVE_EVIDENCE "fault-$mode") --mode $mode -- @command
            if ($LASTEXITCODE -ne 0) { throw "macOS native fault containment was not verified in $mode" }
          }
      - name: Development and AOT owned processes
        if: ${{ runner.os != 'Linux' && !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          $package = Join-Path $env:NATIVE_EVIDENCE 'processes-package'
          bun experiments/aot-gpui/build-window.ts --entry processes `
            --source $env:GITHUB_WORKSPACE --host $env:BUN_NATIVE_HOST `
            --host-profile release --outdir $package
          if ($LASTEXITCODE -ne 0) { throw 'The owned process AOT compiler or inspection failed' }
          $manifest = Get-Content -Raw (Join-Path $package 'manifest.json') | ConvertFrom-Json
          foreach ($mode in @('development', 'aot')) {
            $evidence = Join-Path $env:NATIVE_EVIDENCE "processes-$mode"
            New-Item -ItemType Directory $evidence | Out-Null
            $env:BUN_NATIVE_PROCESS_EVIDENCE = $evidence
            $env:BUN_NATIVE_PROCESS_MODE = $mode
            if ($mode -eq 'development') {
              bun tests/native/processes.ts 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'run.log')
            } else {
              & (Join-Path $package $manifest.application.file) 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'run.log')
            }
            if ($LASTEXITCODE -ne 0) { throw "${{ runner.os }} owned processes were not verified in $mode" }
            $report = Get-Content -Raw (Join-Path $evidence 'processes.json') | ConvertFrom-Json
            $backend = if ($IsWindows) { 'windows_job' } else { 'posix' }
            if ($report.backend -ne $backend -or $report.mode -ne $mode) {
              throw "${{ runner.os }} $mode owned process evidence does not name the $backend backend"
            }
          }
      - name: Solid and React development/AOT owned native input and cleanup
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 8
        env:
          BUN_NATIVE_POINTER_TRACE: ${{ runner.os == 'macOS' && '1' || '0' }}
          BUN_NATIVE_STARTUP_TRACE: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          $telemetry = @()
          if ($IsMacOS) { $telemetry += '--require-metal-device' }
          $failures = @()
          foreach ($framework in @('solid', 'react')) {
            $entry = "$framework-platform"
            $package = Join-Path $env:NATIVE_EVIDENCE "$entry-package"
            bun experiments/aot-gpui/build-window.ts --entry $entry `
              --source $env:GITHUB_WORKSPACE --host $env:BUN_NATIVE_HOST `
              --host-profile release --outdir $package
            if ($LASTEXITCODE -ne 0) {
              $failures += "$framework AOT compiler/inspection failed"
              continue
            }
            $manifest = Get-Content -Raw (Join-Path $package 'manifest.json') | ConvertFrom-Json
            if ($manifest.application.inspection.hasCompiledProgram -ne $true -or `
                !$manifest.application.runtimeFeatures -or `
                $manifest.application.runtimeFeatures.jit -eq 'present' -or `
                $manifest.application.runtimeFeatures.jitRemovedRanges.count -le 0) {
              $failures += "$framework lacks genuine compiled-program/JIT-removal evidence"
              continue
            }
            foreach ($mode in @('development', 'aot')) {
              [string[]]$command = if ($mode -eq 'development') {
                @('bun', (Join-Path $package 'development/application.js'))
              } else {
                @((Join-Path $package $manifest.application.file))
              }
              & '${{ matrix.python }}' scripts/quality/native-platform-smoke.py `
                --output (Join-Path $env:NATIVE_EVIDENCE "$entry-$mode-input") `
                --framework $framework --mode $mode --host-profile release --os-input @telemetry -- @command
              if ($LASTEXITCODE -ne 0) { $failures += "$framework $mode native qualification failed" }
            }
          }
          if ($failures.Count -gt 0) { throw ($failures -join '; ') }
      - name: macOS and Windows development and AOT filesystem grants
        if: ${{ runner.os != 'Linux' && !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          $package = Join-Path $env:NATIVE_EVIDENCE 'filesystem-grants-package'
          bun experiments/aot-gpui/build-window.ts --entry filesystem-grants `
            --source $env:GITHUB_WORKSPACE --host $env:BUN_NATIVE_HOST `
            --host-profile release --outdir $package
          if ($LASTEXITCODE -ne 0) { throw 'The filesystem grants AOT compiler or inspection failed' }
          $manifest = Get-Content -Raw (Join-Path $package 'manifest.json') | ConvertFrom-Json
          $platform = if ($IsWindows) { 'win32' } else { 'darwin' }
          $backend = if ($IsWindows) { 'ntcreatefile_walk' } else { 'openat_walk' }
          foreach ($mode in @('development', 'aot')) {
            $evidence = Join-Path $env:NATIVE_EVIDENCE "filesystem-grants-$mode"
            New-Item -ItemType Directory $evidence | Out-Null
            $env:BUN_NATIVE_FILESYSTEM_EVIDENCE = $evidence
            $env:BUN_NATIVE_FILESYSTEM_MODE = $mode
            if ($mode -eq 'development') {
              bun tests/native/filesystem-grants.ts 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'run.log')
            } else {
              & (Join-Path $package $manifest.application.file) 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'run.log')
            }
            if ($LASTEXITCODE -ne 0) { throw "${{ runner.os }} $mode filesystem grants were not verified" }
            $report = Get-Content -Raw (Join-Path $evidence 'filesystem-grants.json') | ConvertFrom-Json
            if ($report.platform -ne $platform -or $report.backend -ne $backend -or $report.mode -ne $mode) {
              throw "${{ runner.os }} $mode filesystem grant evidence does not name the $backend backend"
            }
          }
      - name: macOS development and AOT application menu bar (#239)
        if: ${{ runner.os == 'macOS' && !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          $oracle = Join-Path $env:NATIVE_EVIDENCE 'macos-menu-oracle'
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework ApplicationServices `
            tests/native/macos-menu-oracle.m -o $oracle
          if ($LASTEXITCODE -ne 0) { throw 'The independent Accessibility menu oracle did not compile' }
          $env:BUN_NATIVE_MACOS_MENU_ORACLE = $oracle
          $package = Join-Path $env:NATIVE_EVIDENCE 'app-menu-package'
          bun experiments/aot-gpui/build-window.ts --entry app-menu `
            --source $env:GITHUB_WORKSPACE --host $env:BUN_NATIVE_HOST `
            --host-profile release --outdir $package
          if ($LASTEXITCODE -ne 0) { throw 'The application menu AOT compiler or inspection failed' }
          foreach ($mode in @('development', 'aot')) {
            $evidence = Join-Path $env:NATIVE_EVIDENCE "app-menu-$mode"
            New-Item -ItemType Directory $evidence | Out-Null
            $env:BUN_NATIVE_APP_MENU_EVIDENCE = $evidence
            $env:BUN_NATIVE_APP_MENU_MODE = $mode
            if ($mode -eq 'development') {
              bun tests/native/app-menu.ts 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'run.log')
            } else {
              & (Join-Path $package 'app-menu') 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'run.log')
            }
            if ($LASTEXITCODE -ne 0) { throw "macOS $mode application menu bar failed" }
            $report = Get-Content -Raw (Join-Path $evidence 'app-menu.json') | ConvertFrom-Json
            if ($report.platform -ne 'darwin' -or $report.mode -ne $mode) {
              throw "macOS $mode application menu evidence does not name its platform and mode"
            }
            if ($report.status -ne 'verified') {
              Write-Output "::warning::macOS $mode menu bar contents and selections are unverified: $($report.oracle)"
            }
          }
      - name: Display snapshot, work area, identity and display-change qualification (#299)
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          if ($IsMacOS) {
            $oracle = Join-Path $env:NATIVE_EVIDENCE 'macos-display-oracle'
            xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework CoreGraphics `
              -framework ApplicationServices tests/native/macos-display-oracle.m -o $oracle
            if ($LASTEXITCODE -ne 0) { throw 'The independent AppKit/CoreGraphics display oracle did not compile' }
            $env:BUN_NATIVE_MACOS_DISPLAY_HELPER = $oracle
          } else {
            $env:BUN_NATIVE_WINDOWS_DISPLAY_ORACLE = (Resolve-Path 'tests/native/windows-display-oracle.ps1').Path
          }
          $package = Join-Path $env:NATIVE_EVIDENCE 'display-platform-package'
          bun experiments/aot-gpui/build-window.ts --entry display-platform `
            --source $env:GITHUB_WORKSPACE --host $env:BUN_NATIVE_HOST `
            --host-profile release --outdir $package
          if ($LASTEXITCODE -ne 0) { throw 'The display fixture AOT compiler or inspection failed' }
          $manifest = Get-Content -Raw (Join-Path $package 'manifest.json') | ConvertFrom-Json
          if ($manifest.application.inspection.hasCompiledProgram -ne $true -or `
              !$manifest.application.runtimeFeatures -or `
              $manifest.application.runtimeFeatures.jit -eq 'present') {
            throw 'The display fixture lacks genuine compiled-program/JIT-removal evidence'
          }
          foreach ($mode in @('development', 'aot')) {
            $evidence = Join-Path $env:NATIVE_EVIDENCE "display-platform-$mode"
            New-Item -ItemType Directory $evidence | Out-Null
            $env:BUN_NATIVE_DISPLAY_EVIDENCE = $evidence
            $env:BUN_NATIVE_DISPLAY_MODE = $mode
            if ($mode -eq 'development') {
              bun tests/native/display-platform.ts 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'run.log')
            } else {
              & (Join-Path $package $manifest.application.file) 2>&1 |
                Tee-Object -FilePath (Join-Path $evidence 'run.log')
            }
            if ($LASTEXITCODE -ne 0) { throw "Display qualification failed in $mode" }
            if (!(Test-Path -LiteralPath (Join-Path $evidence 'display-platform.json') -PathType Leaf)) {
              throw "Display qualification wrote no $mode evidence"
            }
          }
      - name: Build the independent OS drag source
        id: drag-source
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          if ($IsMacOS) {
            $dragSource = Join-Path $env:NATIVE_EVIDENCE 'macos-drag-source'
            xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework CoreGraphics `
              tests/native/macos-drag-source.m -o $dragSource
            if ($LASTEXITCODE -ne 0) { throw 'The AppKit NSDraggingSession source did not compile' }
          } else {
            $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
            if (!(Test-Path -LiteralPath $csc -PathType Leaf)) { throw 'The .NET Framework C# compiler is unavailable' }
            $dragSource = Join-Path $env:NATIVE_EVIDENCE 'windows-drag-source.exe'
            & $csc /nologo /target:exe /optimize `
              /r:System.Windows.Forms.dll /r:System.Drawing.dll `
              "/out:$dragSource" (Resolve-Path tests/native/windows-drag-source.cs).Path
            if ($LASTEXITCODE -ne 0) { throw 'The OLE DoDragDrop source did not compile' }
          }
          "BUN_NATIVE_DRAG_SOURCE=$dragSource" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-FileHash -Algorithm SHA256 $dragSource |
            Format-List | Out-File (Join-Path $env:NATIVE_EVIDENCE 'drag-source-sha256.txt')
      - name: Development and AOT OS drag and drop through core, Solid and React
        if: ${{ !cancelled() && steps.drag-source.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          $failures = @()
          foreach ($entry in @('drag-drop', 'solid-drag-drop', 'react-drag-drop')) {
            $package = Join-Path $env:NATIVE_EVIDENCE "$entry-package"
            bun experiments/aot-gpui/build-window.ts --entry $entry `
              --source $env:GITHUB_WORKSPACE --host $env:BUN_NATIVE_HOST `
              --host-profile release --outdir $package
            if ($LASTEXITCODE -ne 0) {
              $failures += "$entry AOT compiler/inspection failed"
              continue
            }
            $manifest = Get-Content -Raw (Join-Path $package 'manifest.json') | ConvertFrom-Json
            foreach ($mode in @('development', 'aot')) {
              [string[]]$command = if ($mode -eq 'aot') {
                @((Join-Path $package $manifest.application.file))
              } elseif ($entry -eq 'drag-drop') {
                @('bun', 'tests/native/drag-drop.ts')
              } else {
                @('bun', (Join-Path $package 'development/application.js'))
              }
              $evidence = Join-Path $env:NATIVE_EVIDENCE "$entry-$mode"
              New-Item -ItemType Directory $evidence | Out-Null
              $env:BUN_NATIVE_DRAG_DROP_EVIDENCE = $evidence
              $env:BUN_NATIVE_DRAG_DROP_MODE = $mode
              $launch = @{
                FilePath = $command[0]
                NoNewWindow = $true
                PassThru = $true
                RedirectStandardOutput = (Join-Path $evidence 'stdout.log')
                RedirectStandardError = (Join-Path $evidence 'stderr.log')
              }
              if ($command.Count -gt 1) { $launch.ArgumentList = $command[1..($command.Count - 1)] }
              $process = Start-Process @launch
              $null = $process.Handle # Keeps the exit code readable after exit.
              if (!$process.WaitForExit(180000)) {
                $process.Kill($true)
                $failures += "$entry $mode timed out"
              } elseif ($process.ExitCode -ne 0) {
                $failures += "$entry $mode exited $($process.ExitCode)"
              }
              Get-Content (Join-Path $evidence 'stdout.log'), (Join-Path $evidence 'stderr.log')
            }
          }
          if ($failures.Count -gt 0) { throw ($failures -join '; ') }
      - name: Development and AOT macOS Solid and React workspace references (#248, #250)
        if: ${{ runner.os == 'macOS' && !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          # The Linux workspace scenarios, unchanged, driven by CoreGraphics
          # pointer, wheel and key events and Accessibility resize/close.
          if (-not (Get-Command magick -ErrorAction SilentlyContinue) -and -not (Get-Command convert -ErrorAction SilentlyContinue)) {
            brew install imagemagick
            if ($LASTEXITCODE -ne 0) { throw 'ImageMagick for the workspace pixel checks did not install' }
          }
          # The fixtures open 1000x760 and 1120x760 windows, which AppKit fits
          # to the hosted 1024x768 display. Use the smallest desktop mode that
          # holds them for this step only, and restore the original afterwards.
          $oracle = Join-Path $env:NATIVE_EVIDENCE 'macos-workspace-display-oracle'
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework CoreGraphics `
            -framework ApplicationServices tests/native/macos-display-oracle.m -o $oracle
          if ($LASTEXITCODE -ne 0) { throw 'The display oracle did not compile' }
          $main = (& $oracle screens | ConvertFrom-Json) | Where-Object { $_.main } | Select-Object -First 1
          if (!$main) { throw 'No main display is available' }
          $modes = & $oracle modes $main.number | ConvertFrom-Json
          $original = $modes.currentIndex
          $large = $modes.modes | Where-Object { $_.width -ge 1200 -and $_.height -ge 900 } |
            Sort-Object { $_.width * $_.height } | Select-Object -First 1
          if (!$large) { throw 'The hosted display offers no desktop mode that holds the workspace fixtures' }
          # Record the session's held modifier flags around each display change:
          # the OS input helper refuses to inject while any is held.
          $flags = { & '${{ matrix.python }}' -c "import ctypes; a=ctypes.CDLL('/System/Library/Frameworks/ApplicationServices.framework/ApplicationServices'); a.CGEventSourceFlagsState.restype=ctypes.c_uint64; print(hex(a.CGEventSourceFlagsState(0)))" }
          Write-Output "modifier flags before the display change: $(& $flags)"
          try {
            if ($modes.current.height -lt 900 -or $modes.current.width -lt 1200) {
              & $oracle set $main.number $large.index | Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'workspace-display-mode.json')
              if ($LASTEXITCODE -ne 0) { throw 'The workspace display mode was not applied' }
              Start-Sleep -Seconds 2
              Write-Output "modifier flags after the display change: $(& $flags)"
            }
            $failed = @()
            foreach ($scenario in @('react-workspace', 'solid-workspace')) {
              $package = Join-Path $env:NATIVE_EVIDENCE "$scenario-flow-package"
              bun experiments/aot-gpui/build-window.ts --entry "$scenario-flow" `
                --source $env:GITHUB_WORKSPACE --host $env:BUN_NATIVE_HOST `
                --host-profile release --outdir $package
              if ($LASTEXITCODE -ne 0) { throw "The macOS $scenario AOT compiler or inspection failed" }
              foreach ($mode in @('development', 'aot')) {
                [string[]]$command = if ($mode -eq 'aot') { @((Join-Path $package "$scenario-flow")) } else { @('bun', (Join-Path $package 'development/application.js')) }
                & '${{ matrix.python }}' scripts/quality/native-workspace-macos.py `
                  --scenario $scenario --mode $mode `
                  --output (Join-Path $env:NATIVE_EVIDENCE "$scenario-macos-$mode") -- @command
                if ($LASTEXITCODE -ne 0) { $failed += "$scenario $mode (exit $LASTEXITCODE)" }
              }
            }
            # Every case runs so one failure does not hide the others' evidence.
            if ($failed) { throw "macOS workspace references not verified: $($failed -join ', ')" }
          } finally {
            if ($original -ge 0) { & $oracle set $main.number $original | Out-Null }
            Write-Output "modifier flags after the restore: $(& $flags)"
          }
      - name: Retain unsigned native host for reproducibility
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          $archive = Join-Path $env:NATIVE_EVIDENCE 'unsigned-native-host.tar.gz'
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          if ($LASTEXITCODE -ne 0) { throw 'Source commit time is unavailable' }
          bun scripts/native/host-archive.ts --output $archive (Join-Path 'target/release' '${{ matrix.binary }}')
          if ($LASTEXITCODE -ne 0) { throw 'Native host archive failed' }
