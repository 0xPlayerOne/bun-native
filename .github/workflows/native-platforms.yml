name: Native Platforms

on:
  workflow_call:
    # Release signing identities (#249; docs/releasing.md). Every one is optional: without
    # them the template is signed with a throwaway identity and notarization is skipped.
    secrets:
      APPLE_DEVELOPER_ID_P12_BASE64:
        required: false
      APPLE_DEVELOPER_ID_P12_PASSWORD:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false
      APPLE_NOTARY_PRIVATE_KEY:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      WINDOWS_CODESIGN_PFX_BASE64:
        required: false
      WINDOWS_CODESIGN_PFX_PASSWORD:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-platforms-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: GPUI release and native paint (${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Each OS was one serial ~9 min job. Both shards build the same release
    # host; shard 1 runs host Clippy/unit tests and the workspace references,
    # shard 2 the smoke, service, input, display and drag scenarios. A step
    # without `if: matrix.shard == N` runs in both shards.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
        shard: [1, 2]
        include:
          - os: macos-15
            python: python3
            binary: bun-native-host
            application: platform-smoke
          - os: windows-2022
            python: python
            binary: bun-native-host.exe
            application: platform-smoke.exe
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: 0
      BUN_NATIVE_HOST_PROFILE: release
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare bounded evidence location
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'bun-native-platform-evidence'
          New-Item -ItemType Directory $evidence | Out-Null
          "NATIVE_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          @{
            source = (git rev-parse HEAD)
            platform = [Runtime.InteropServices.RuntimeInformation]::OSDescription
            architecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            imageOS = $env:ImageOS
            imageVersion = $env:ImageVersion
            node = (node --version)
            phase = 'before Bun bootstrap; native build and input not yet verified'
          } | ConvertTo-Json | Out-File (Join-Path $evidence 'bootstrap-environment.json')
      - name: Install checksum-pinned Bun compiler
        run: node scripts/install-bun.mjs --destination (Join-Path $env:RUNNER_TEMP 'bun-native-bun')
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify Xcode and precompiled Metal tools
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          xcodebuild -version | Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'xcode.txt')
          if ($LASTEXITCODE -ne 0) { throw 'A complete Xcode toolchain is required' }
          xcrun --sdk macosx --show-sdk-path | Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'macos-sdk.txt')
          if ($LASTEXITCODE -ne 0) { throw 'The macOS SDK is unavailable' }
          xcrun --sdk macosx metal --version
          if ($LASTEXITCODE -ne 0) {
            xcodebuild -downloadComponent MetalToolchain 2>&1 |
              Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'metal-toolchain-install.log')
            if ($LASTEXITCODE -ne 0) { throw 'The hosted Xcode Metal component could not be installed' }
          }
          xcrun --sdk macosx metal --version |
            Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'metal-version.txt')
          if ($LASTEXITCODE -ne 0) { throw 'GPUI requires the Xcode Metal compiler' }
          xcrun --sdk macosx --find metallib
          if ($LASTEXITCODE -ne 0) { throw 'GPUI requires the Xcode metallib linker' }
      - name: Locate the installed Windows SDK shader compiler
        if: runner.os == 'Windows'
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $fxc = Get-ChildItem -Directory $sdk |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64/fxc.exe' } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (!$fxc) { throw 'GPUI release shaders require the Windows SDK fxc.exe' }
          "GPUI_FXC_PATH=$fxc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item -LiteralPath $fxc | Select-Object FullName,Length,VersionInfo |
            Format-List | Out-File (Join-Path $env:NATIVE_EVIDENCE 'windows-sdk.txt')
          Get-FileHash -Algorithm SHA256 -LiteralPath $fxc |
            Format-List | Out-File (Join-Path $env:NATIVE_EVIDENCE 'fxc-sha256.txt')
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: gpui-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.json', 'bun.lock', 'rust-toolchain.toml', 'Cargo.lock') }}
      - run: bun install --frozen-lockfile
      # Dependency build outputs come from the last protected-main build of the
      # same lockfile and toolchain. Workspace crates still rebuild from this
      # checkout. The scheduled audit restores nothing, keeping a cold build.
      - name: Restore release dependency build outputs
        id: target-cache
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/build
            target/release/deps
            target/release/.fingerprint
          key: native-release-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'native/vendor/**') }}
          # Only pull requests fall back to an older key; main rebuilds cold
          # after a lockfile or toolchain change, so stale outputs never pile up.
          restore-keys: ${{ github.event_name == 'pull_request' && format('native-release-target-{0}-{1}-', runner.os, runner.arch) || '' }}
      - name: Check portable paint guards on the actual target Python
        run: |
          & '${{ matrix.python }}' -m unittest discover -s tests/quality -p 'test_native_platform*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Portable evidence guard tests failed' }
      - name: Record source and actual target tools
        run: |
          & {
            git rev-parse HEAD
            "ImageOS=$env:ImageOS"
            "ImageVersion=$env:ImageVersion"
            [Runtime.InteropServices.RuntimeInformation]::OSDescription
            bun --revision
            rustc --version --verbose
            cargo --version
            & '${{ matrix.python }}' --version
            bun -e 'console.log(JSON.stringify({os:process.platform,arch:process.arch,hostProfile:"release",scope:"native paint/lifecycle and separate owned OS-input qualification; results recorded per phase"}))'
          } | Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'toolchain.txt')
      - name: Keep the runner's Cargo home path out of native binaries
        # Dependency panic locations otherwise embed CARGO_HOME verbatim; see
        # docs/reproducible-builds.md.
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          "CARGO_ENCODED_RUSTFLAGS=--remap-path-prefix=$cargoHome=/cargo" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the genuine target-platform GPUI executable
        id: native-build
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          cargo build --locked --release -p bun-native-host 2>&1 |
            Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'native-build.log')
          $code = $LASTEXITCODE
          $timer.Stop()
          @{ elapsedMs = $timer.Elapsed.TotalMilliseconds; exitCode = $code; profile = 'release'; targetCacheKey = '${{ steps.target-cache.outputs.cache-matched-key || 'none' }}' } |
            ConvertTo-Json | Out-File (Join-Path $env:NATIVE_EVIDENCE 'native-build.json')
          if ($code -ne 0) { throw "Native build failed: $code" }
          $hostPath = (Resolve-Path 'target/release/${{ matrix.binary }}').Path
          "BUN_NATIVE_HOST=$hostPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $hostPath | Select-Object Name,Length |
            ConvertTo-Json | Out-File (Join-Path $env:NATIVE_EVIDENCE 'native-size.json')
          Get-FileHash -Algorithm SHA256 $hostPath |
            Format-List | Out-File (Join-Path $env:NATIVE_EVIDENCE 'native-sha256.txt')
      - name: Lint and test actual platform host
        if: matrix.shard == 1
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed' }
          cargo clippy --locked --release -p bun-native-host --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native host Clippy failed' }
          cargo test --locked --release -p bun-native-host
          if ($LASTEXITCODE -ne 0) { throw 'Native host tests failed' }
      - name: Generated Solid and React templates through create, check and inspected AOT build (#254)
        id: cli-templates
        if: ${{ matrix.shard == 1 && (!cancelled() && steps.native-build.outcome == 'success') }}
        timeout-minutes: 8
        run: |
          # The quick-start commands on this platform: all four CLI templates
          # are created, strictly checked and compiled with the pinned AOT
          # compiler beside the release host. Only provenance and logs are
          # kept; the windowed runs are the "open, take an OS click" step below.
          $packages = Join-Path $env:RUNNER_TEMP 'cli-templates'
          & '${{ matrix.python }}' tests/native/cli-templates.py prepare `
            --output $packages --bun (Get-Command bun).Source --host $env:BUN_NATIVE_HOST
          $code = $LASTEXITCODE
          $evidence = Join-Path $env:NATIVE_EVIDENCE 'cli-templates'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          Get-ChildItem $packages -Recurse -Include 'provenance.json','*.log' -ErrorAction SilentlyContinue |
            ForEach-Object {
              $relative = $_.FullName.Substring($packages.Length).TrimStart('\', '/')
              $target = Join-Path $evidence $relative
              New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
              Copy-Item $_.FullName $target
            }
          if ($code -ne 0) { throw 'A generated template did not create, check or build through inspected AOT' }
      - name: Save release dependency build outputs from protected main
        if: ${{ matrix.shard == 1 && (success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.target-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/build
            target/release/deps
            target/release/.fingerprint
          key: native-release-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'native/vendor/**') }}
      # OS code signing and installers (#249): the generated Solid template above is signed,
      # bundled with its update manifest and installed from its installer image. Pull
      # requests always use a throwaway self-signed identity; other runs use the release
      # identity when its secrets are configured (docs/releasing.md).
      - name: Provision a code-signing identity, throwaway unless release secrets exist (#249)
        id: signing-identity
        if: ${{ matrix.shard == 1 && (!cancelled() && steps.cli-templates.outcome == 'success') }}
        timeout-minutes: 3
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ github.event_name != 'pull_request' && secrets.APPLE_DEVELOPER_ID_P12_BASE64 || '' }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_DEVELOPER_ID_P12_PASSWORD || '' }}
          WINDOWS_CODESIGN_PFX_BASE64: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CODESIGN_PFX_BASE64 || '' }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CODESIGN_PFX_PASSWORD || '' }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'signing-identity'
          if ($IsMacOS) {
            bash scripts/signing/macos-identity.sh provision $work
            if ($LASTEXITCODE -ne 0) { throw 'No macOS code-signing identity was provisioned' }
          } else {
            & ./scripts/signing/windows-identity.ps1 -Mode provision -Work $work
          }
      - name: Sign, bundle and package the template AOT application (#249)
        id: signed-template
        if: ${{ matrix.shard == 1 && (!cancelled() && steps.signing-identity.outcome == 'success') }}
        timeout-minutes: 12
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'signed-template'
          $evidence = Join-Path $env:NATIVE_EVIDENCE 'signed-template'
          $bundles = Join-Path $work 'bundles'
          $installers = Join-Path $work 'installers'
          New-Item -ItemType Directory $work, $evidence, $bundles, $installers, (Join-Path $work 'second') | Out-Null
          function Invoke-Logged([string]$Log) {
            # Runs the remaining arguments and keeps their output as evidence.
            $command = $args[0]
            $arguments = @($args | Select-Object -Skip 1)
            & $command @arguments | Tee-Object -FilePath (Join-Path $evidence $Log)
            if ($LASTEXITCODE -ne 0) { throw "$command $($arguments -join ' ') failed ($LASTEXITCODE)" }
          }
          $build = Join-Path $work 'build'
          Copy-Item -Recurse (Join-Path $env:RUNNER_TEMP 'cli-templates/solid-typescript/package') $build
          [string[]]$signing = @('--identity', $env:SIGNING_IDENTITY)
          if ($IsMacOS) { $signing += @('--keychain', $env:SIGNING_KEYCHAIN) }
          # Executables are signed before the update manifest hashes them.
          Invoke-Logged sign-build.json bun scripts/release-package.ts sign $build @signing
          $product = 'dev.bun-native.template'
          $key = Join-Path $work 'release.pem'
          $public = Join-Path $work 'release.pub.pem'
          $keys = Join-Path $work 'keys.json'
          $first = Join-Path $work 'update.json'
          $second = Join-Path $work 'second/update.json'
          Invoke-Logged keygen.log bun scripts/release-update.ts keygen --private-key $key --public-key $public
          Invoke-Logged key-set.log bun scripts/release-update.ts key-set --product $product --version 1 --minimum-sequence 1 --public-key $public --out $keys
          # A second manifest of the same payload with a higher sequence is the pending update the smoke installs.
          Invoke-Logged manifest-1.log bun scripts/release-update.ts manifest $build --product $product --version 1.0.1 --sequence 1 --signed --out $first
          Invoke-Logged manifest-2.log bun scripts/release-update.ts manifest $build --product $product --version 1.0.2 --sequence 2 --signed --out $second
          Invoke-Logged sign-update-1.log bun scripts/release-update.ts sign $first --private-key $key --keyed
          Invoke-Logged sign-update-2.log bun scripts/release-update.ts sign $second --private-key $key --keyed
          Invoke-Logged bundle.log bun scripts/release-update.ts bundle $first --payload $build --out $bundles --self-contained --key-set $keys
          $bundle = @(Get-ChildItem -Directory -LiteralPath $bundles)[0].FullName
          Invoke-Logged sign-bundle.json bun scripts/release-package.ts sign $bundle @signing
          $format = if ($IsMacOS) { 'dmg' } else { 'zip' }
          Invoke-Logged installer.json bun scripts/release-package.ts installer $bundle --format $format --name 'Bun Native Template' --out $installers @signing
          $installer = @(Get-ChildItem -File -LiteralPath $installers)[0].FullName
          Copy-Item -LiteralPath $first (Join-Path $evidence 'update-1.json')
          Copy-Item -LiteralPath $second (Join-Path $evidence 'update-2.json')
          "SIGNED_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNED_SECOND_UPDATE=$second" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Notarize and staple the template disk image when Apple credentials exist (#249)
        if: ${{ matrix.shard == 1 && runner.os == 'macOS' && (!cancelled() && steps.signed-template.outcome == 'success') }}
        timeout-minutes: 50
        env:
          APPLE_NOTARY_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_NOTARY_KEY_ID || '' }}
          APPLE_NOTARY_ISSUER_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_NOTARY_ISSUER_ID || '' }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.APPLE_NOTARY_PRIVATE_KEY || '' }}
          APPLE_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: |
          $record = Join-Path $env:NATIVE_EVIDENCE 'signed-template/notarization.log'
          if ($env:SIGNING_KIND -ne 'release') {
            $reason = 'the image is signed with the throwaway self-signed identity, and Apple notarizes only Developer ID signatures'
            Write-Output "::notice title=Notarization skipped::$reason"
            "Notarization skipped: $reason" | Out-File -FilePath $record
            exit 0
          }
          bun scripts/release-package.ts notarize $env:SIGNED_INSTALLER | Tee-Object -FilePath $record
          if ($LASTEXITCODE -ne 0) { throw 'Notarization, stapling or the Gatekeeper assessment failed' }
          if (Select-String -Quiet -Pattern '^Notarization skipped' -LiteralPath $record) {
            Write-Output "::notice title=Notarization skipped::$(Get-Content -LiteralPath $record -TotalCount 1)"
          }
      - name: Install the signed template from its installer and confirm its health (#249)
        if: ${{ matrix.shard == 1 && (!cancelled() && steps.signed-template.outcome == 'success') }}
        timeout-minutes: 8
        run: |
          # Verifies every executable's signature in the image and after installation, runs
          # the image's install script, then starts a pending update through the installed,
          # signed verifying launcher until the application confirms its own health.
          bun scripts/quality/signed-installer-smoke.ts `
            --installer $env:SIGNED_INSTALLER --second-update $env:SIGNED_SECOND_UPDATE `
            --work (Join-Path $env:RUNNER_TEMP 'signed-template-smoke') `
            --evidence (Join-Path $env:NATIVE_EVIDENCE 'signed-template/install-smoke.json') --expect-signed
          if ($LASTEXITCODE -ne 0) { throw 'The signed installer did not install or start the application' }
      - name: Remove the code-signing identity (#249)
        if: ${{ always() && matrix.shard == 1 && steps.signing-identity.outcome != 'skipped' }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'signing-identity'
          if ($IsMacOS) {
            bash scripts/signing/macos-identity.sh cleanup $work
          } else {
            & ./scripts/signing/windows-identity.ps1 -Mode cleanup -Work $work
          }
      - name: Verify native macOS layer invalidation and assigned Metal identity
        if: ${{ matrix.shard == 2 && (runner.os == 'macOS') }}
        timeout-minutes: 3
        run: |
          cargo clippy --locked --release -p bun-native-macos-surface --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native surface Clippy failed' }
          cargo test --locked --release -p bun-native-macos-surface
          if ($LASTEXITCODE -ne 0) { throw 'Native surface ownership tests failed' }
          cargo build --locked --release -p bun-native-macos-surface --example invalidation-control
          if ($LASTEXITCODE -ne 0) { throw 'Actual Core Animation control did not compile' }
          & target/release/examples/invalidation-control 2>&1 |
            Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'layer-invalidation-control.log')
          if ($LASTEXITCODE -ne 0) { throw 'Actual layer invalidation controls failed' }
          & target/release/examples/invalidation-control --omit-invalidation 2>&1 |
            Tee-Object -FilePath (Join-Path $env:NATIVE_EVIDENCE 'layer-invalidation-negative.log')
          $code = $LASTEXITCODE
          $negative = Get-Content -Raw (Join-Path $env:NATIVE_EVIDENCE 'layer-invalidation-negative.log')
          if ($code -eq 0 -or $negative -notmatch 'committed surface did not become dirty') {
            throw 'Omitting invalidation did not fail at the intended native dirty-state assertion'
          }
          $global:LASTEXITCODE = 0
      - name: Development actual native paint and lifecycle
        if: matrix.shard == 2
        timeout-minutes: 3
        run: |
          $telemetry = @()
          if ($IsMacOS) { $telemetry += '--require-metal-device' }
          & '${{ matrix.python }}' scripts/quality/native-platform-smoke.py `
            --output (Join-Path $env:NATIVE_EVIDENCE 'development') `
            --mode development --host-profile release @telemetry -- bun tests/native/platform-smoke.ts
          if ($LASTEXITCODE -ne 0) { throw 'Development native paint/lifecycle was not verified' }
      - name: Build the bounded macOS OS controller
        if: runner.os == 'macOS'
        run: |
          $eventTest = Join-Path $env:NATIVE_EVIDENCE 'macos-input-events'
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework CoreGraphics -framework ApplicationServices `
            tests/native/macos-input-events.m -o $eventTest
          if ($LASTEXITCODE -ne 0) { throw 'The actual macOS SDK pointer and target-guard control did not compile' }
          & $eventTest | Out-File (Join-Path $env:NATIVE_EVIDENCE 'macos-pointer-events.json')
          if ($LASTEXITCODE -ne 0) { throw 'The actual Quartz event or exact-window target controls failed' }
          $hitTest = Join-Path $env:NATIVE_EVIDENCE 'macos-window-hit'
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework CoreGraphics -framework ApplicationServices `
            tests/native/macos-window-hit.m -o $hitTest
          if ($LASTEXITCODE -ne 0) { throw 'The actual AppKit window hit-test control did not compile' }
          & $hitTest | Out-File (Join-Path $env:NATIVE_EVIDENCE 'macos-window-hit.json')
          if ($LASTEXITCODE -ne 0) { throw 'The owned click-through/input-taking window controls failed' }
          $foreignTest = Join-Path $env:NATIVE_EVIDENCE 'macos-cross-process-hit'
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework CoreGraphics -framework ApplicationServices `
            tests/native/macos-cross-process-hit.m -o $foreignTest
          if ($LASTEXITCODE -ne 0) { throw 'The foreign-process AppKit target control did not compile' }
          & $foreignTest | Out-File (Join-Path $env:NATIVE_EVIDENCE 'macos-cross-process-hit.json')
          if ($LASTEXITCODE -ne 0) { throw 'The foreign-process mouse-down target was not independently verified' }
          $helper = Join-Path $env:NATIVE_EVIDENCE 'native-platform-macos'
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework CoreGraphics -framework ApplicationServices `
            scripts/quality/native-platform-macos.m -o $helper
          if ($LASTEXITCODE -ne 0) { throw 'The actual macOS SDK controller did not compile' }
          "BUN_NATIVE_PLATFORM_HELPER=$helper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-FileHash -Algorithm SHA256 $helper |
            Format-List | Out-File (Join-Path $env:NATIVE_EVIDENCE 'os-helper-sha256.txt')
      - name: Generated templates open, take an OS click and close in development and AOT (#254)
        if: ${{ matrix.shard == 1 && (!cancelled() && steps.native-build.outcome == 'success') }}
        timeout-minutes: 14
        run: |
          # The four templates prepared by the create/check/build step run
          # through `native dev --host` and as their AOT packages: each must
          # paint its counter, take one real OS click (CoreGraphics on macOS,
          # SendInput on Windows) shown by the host's own pointer and paint
          # records, and close through the OS. On macOS every case also ends
          # with SIGINT to the app's process group, as Ctrl-C does (#584).
          # These are hosted VMs with software or paravirtual GPUs.
          $packages = Join-Path $env:RUNNER_TEMP 'cli-templates'
          if (!(Test-Path -LiteralPath (Join-Path $packages 'provenance.json'))) {
            throw 'The prepared templates are missing; see the create/check/build step'
          }
          $evidence = Join-Path $env:NATIVE_EVIDENCE 'cli-templates-desktop'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $closes = if ($IsMacOS) { @('os', 'sigint') } else { @('os') }
          $failed = @()
          foreach ($case in @('solid-typescript', 'react-typescript', 'solid-javascript', 'react-javascript')) {
            foreach ($mode in @('development', 'aot')) {
