name: Offline verification snapshot
on:
  pull_request:
    paths: ['.github/workflows/offline-verification.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Snapshot committed sources and pinned contributor dependencies
        shell: bash
        run: |
          mkdir -p .bunly/offline-verification
          git archive --format=tar HEAD | gzip -n > .bunly/offline-verification/source.tar.gz
          git rev-parse HEAD > .bunly/offline-verification/commit.txt
          bun install --frozen-lockfile
          tar -czf .bunly/offline-verification/dependencies.tar.gz node_modules
          cp "$(command -v bun)" .bunly/offline-verification/bun
          sha256sum .bunly/offline-verification/* > .bunly/offline-verification/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-verification
          path: .bunly/offline-verification/*
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
