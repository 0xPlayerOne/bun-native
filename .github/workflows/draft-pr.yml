name: Code Foundry Draft PR

on:
  push:
    branches:
      - 'feat/*'
      - 'fix/*'
      - 'chore/*'
      - 'refactor/*'
      - 'docs/*'
      - 'style/*'
      - 'test/*'

permissions:
  contents: read
  pull-requests: write

jobs:
  draft-pr:
    name: Draft PR
    if: vars.CI_BILLING_PAUSED == 'false'
    uses: 0xPlayerOne/code-foundry/.github/workflows/draft-pr.yml@945e548d1a1de5f6ca6195d245e9d82fc8e4ca63
    with:
      runner: ubuntu-slim
      base: main
    secrets:
      CODE_FOUNDRY_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN }}
