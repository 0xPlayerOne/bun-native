name: Code Foundry Draft PR

on:
  push:
    branches:
      - 'feat/*'
      - 'fix/*'
      - 'chore/*'
      - 'refactor/*'
      - 'docs/*'
      - 'style/*'
      - 'test/*'

permissions:
  contents: read
  pull-requests: write

jobs:
  draft-pr:
    name: Draft PR
    if: vars.CI_BILLING_PAUSED == 'false'
    uses: AndrewM-F/code-foundry/.github/workflows/draft-pr.yml@55b918115765efbbe799cee1edfec89756ebda6f
    with:
      runner: ubuntu-slim
      base: main
    secrets:
      CODE_FOUNDRY_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN }}
