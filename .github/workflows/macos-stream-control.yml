name: macOS owned-window stream control

# Explicitly requested feasibility probe; it does not measure display latency.
on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: macos-stream-control-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  owned-window-stream:
    if: vars.CI_BILLING_PAUSED == 'false' && github.event.pull_request.draft == false && github.event.label.name == 'diagnostic:macos-stream'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile the owned-window stream probe
        run: |
          mkdir -p "$RUNNER_TEMP/stream-control"
          xcrun swiftc -parse-as-library benchmarks/electrobun/owned-window-stream-probe.swift -o "$RUNNER_TEMP/stream-control/probe" -framework AppKit -framework ScreenCaptureKit -framework CoreMedia -framework CoreVideo -framework CoreGraphics
          shasum -a 256 benchmarks/electrobun/owned-window-stream-probe.swift "$RUNNER_TEMP/stream-control/probe" > "$RUNNER_TEMP/stream-control/hashes.txt"
          sw_vers > "$RUNNER_TEMP/stream-control/os.txt"
          xcrun swiftc --version > "$RUNNER_TEMP/stream-control/compiler.txt"
      - name: Observe the owned fixture window
        run: |
          "$RUNNER_TEMP/stream-control/probe" > "$RUNNER_TEMP/stream-control/result.json" 2> "$RUNNER_TEMP/stream-control/stderr.txt"
      - name: Retain probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-owned-window-stream
          path: |
            ${{ runner.temp }}/stream-control/
            !${{ runner.temp }}/stream-control/probe
          if-no-files-found: warn
          retention-days: 30
