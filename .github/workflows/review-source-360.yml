# Operational source transport only. Never merge or mark ready.
name: Prepare exact CLI security-review inputs
on:
  push:
    branches: [test/cli-codeql-source-20261104-1855]
permissions:
  contents: read
jobs:
  prepare:
    if: vars.CI_BILLING_PAUSED == 'false' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: a39a32a48393f6355591ddafd2ff71f0c857eae1
          path: source
      - name: Prepare only fixed public source and frozen dependencies
        env:
          OUTPUT: ${{ runner.temp }}/cli-review-inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a39a32a48393f6355591ddafd2ff71f0c857eae1
          test "$(git rev-parse HEAD^{tree})" = 9544e1a21f8ac0156f7b53d7d7b7232e2b3cae6e
          test -z "$(git status --porcelain)"
          mkdir "$OUTPUT"
          node scripts/install-bun.mjs --destination "$RUNNER_TEMP/cli-review-bun" > "$OUTPUT/bun-install.json"
          bun="$RUNNER_TEMP/cli-review-bun/bun"
          test "$("$bun" --no-script --eval 'console.log(Bun.revision)')" = da867c60bf0bcbf9d6d36994f8ca0efa42075115
          "$bun" install --frozen-lockfile
          test -z "$(git status --porcelain)"
          git archive --format=tar.gz HEAD > "$OUTPUT/source.tar.gz"
          git ls-tree -r HEAD > "$OUTPUT/source-tree.txt"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          output = pathlib.Path(os.environ['OUTPUT'])
          paths = [pathlib.Path('node_modules'), *sorted(pathlib.Path('packages').glob('*/node_modules'))]
          def allowed(member):
              if pathlib.PurePosixPath(member.name).name.startswith('.env'):
                  return None
              return member
          with tarfile.open(output / 'dependencies.tar.gz', 'w:gz', dereference=False) as archive:
              for path in paths:
                  archive.add(path, filter=allowed)
          manifest = {
              'scope': 'Immutable public source and frozen dependency transport only; no qualification or credentials',
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'files': {},
          }
          for path in sorted(output.iterdir()):
              data = path.read_bytes()
              assert len(data) < 100_000_000, path.name
              manifest['files'][path.name] = {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-security-review-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/cli-review-inputs
          if-no-files-found: error
          retention-days: 7
