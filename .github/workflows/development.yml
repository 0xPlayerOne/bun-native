name: M2 executable development fixtures
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  development:
    if: vars.CI_BILLING_PAUSED == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: |
          bun install --frozen-lockfile
          python -m pip install --disable-pip-version-check --only-binary=:all: psutil==7.0.0
      - name: Execute real edits, failed edits, service builds and command reconnection
        run: python scripts/observe-process.py --output .bunly/benchmarks/development-process-tree.json --timeout 180 -- bun scripts/qualify-development.ts
      - name: Require successful fixture and process-tree evidence
        run: |
          bun scripts/print-benchmark-failures.ts
          bun -e 'const r=await Bun.file(".bunly/benchmarks/development-process-tree.json").json();if(r.exitCode!==0||r.timedOut||r.observedOrphans.length||!r.reports.some(x=>x.passed===true))throw new Error("Development fixtures failed")'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-${{ matrix.os }}
          path: .bunly/benchmarks/development-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
