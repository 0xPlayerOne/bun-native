name: M2 executable development fixtures
on:
  pull_request:
    types: [synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-${{ github.ref }}${{ github.event_name == 'pull_request' && (github.event.pull_request.draft && '-draft' || '-ready') || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  development:
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 8 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; node24
        with:
          python-version: '3.11'
      - name: Install process-observer prerequisites
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-dev.txt
          python -c 'import os,sys; open(os.environ["GITHUB_ENV"],"a").write("PYTHON="+sys.executable+"\n")'
      - run: |
          bun install --frozen-lockfile
      - name: Execute real edits, failed edits, service builds and command reconnection
        run: python scripts/observe-process.py --output .bunly/benchmarks/development-process-tree.json --timeout 180 -- bun scripts/qualify-development.ts
      - name: Require successful fixture and process-tree evidence
        run: |
          bun scripts/print-benchmark-failures.ts
          bun -e 'const r=await Bun.file(".bunly/benchmarks/development-process-tree.json").json();if(r.exitCode!==0||r.timedOut||r.observedOrphans.length||!r.reports.some(x=>x.passed===true))throw new Error("Development fixtures failed")'
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; node24
        with:
          name: development-${{ matrix.os }}
          path: .bunly/benchmarks/development-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
