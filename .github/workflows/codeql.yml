name: CodeQL

# Pull requests and main pushes run CodeQL inside Bun Native Validation, where
# the required Validation / Gate waits for every analyzer (#607). This
# workflow only keeps the weekly scan and manual dispatch, so no head is
# analyzed twice.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1'

permissions: {}

concurrency:
  group: bun-native-codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    name: CodeQL
    if: vars.CI_BILLING_PAUSED == 'false'
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: 0xPlayerOne/code-foundry/.github/workflows/codeql.yml@a8fcac90f8c96e1f294aecc7f3a2e874803b9c2b
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: a8fcac90f8c96e1f294aecc7f3a2e874803b9c2b
      runner: ubuntu-latest
      rust-shards: '["all"]'
      rust-threads: '1'
      rust-max-parallel: 1
