name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [ready_for_review, synchronize]
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1'

permissions: {}

concurrency:
  # Keep skipped draft events from cancelling an active ready-for-review scan.
  group: bun-native-codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request' && (github.event.pull_request.draft && '-draft' || '-ready') || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: 0xPlayerOne/code-foundry/.github/workflows/codeql.yml@945e548d1a1de5f6ca6195d245e9d82fc8e4ca63
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: 945e548d1a1de5f6ca6195d245e9d82fc8e4ca63
      runner: ubuntu-latest
      rust-shards: '["all"]'
      rust-threads: '1'
      rust-max-parallel: 1
