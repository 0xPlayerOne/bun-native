name: Bun Native Scheduled Audit

on:
  schedule:
    - cron: '23 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bun-native-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: Protected-main validation
    if: github.ref == 'refs/heads/main' && vars.CI_BILLING_PAUSED == 'false'
    # A local reusable workflow uses this caller's exact protected-main commit.
    # No caller-controlled source or runtime ref is accepted.
    # The caller must grant everything a nested job requests, or GitHub
    # rejects the workflow and the schedule never fires (#620): the changes
    # job reads pull requests, CodeQL uploads results, the Gate reads jobs.
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/bun-native.yml
