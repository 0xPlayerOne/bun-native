name: Verify Code Foundry Release Integrity
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published immutable release tag to verify.
        required: true
        type: string
permissions:
  contents: read
  attestations: read
jobs:
  verify:
    # Enable only after an administrator enables immutable releases. This is a
    # post-publication verifier, not a substitute for the GitHub repository setting.
    if: vars.CI_BILLING_PAUSED == 'false' && (vars.REQUIRE_IMMUTABLE_RELEASES == 'true' || github.event_name == 'workflow_dispatch')
    uses: 0xPlayerOne/code-foundry/.github/workflows/release-integrity.yml@945e548d1a1de5f6ca6195d245e9d82fc8e4ca63
    with:
      runtime-ref: 945e548d1a1de5f6ca6195d245e9d82fc8e4ca63
      tag: ${{ github.event.release.tag_name || inputs.tag }}
