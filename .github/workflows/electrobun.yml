name: M2 Electrobun CEF baseline
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: electrobun-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  electrobun:
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: macos-15
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 15 }}
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; node24
        with:
          python-version: '3.11'
      - name: Install process-observer prerequisites
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-dev.txt
          python -c 'import os,sys; open(os.environ["GITHUB_ENV"],"a").write("PYTHON="+sys.executable+"\n")'
      - name: Install locked baseline tooling
        run: |
          bun install --frozen-lockfile
          bun install --cwd benchmarks/fixtures --frozen-lockfile
          bun install --cwd benchmarks/adapters/electrobun --frozen-lockfile
      - name: Prepare and build using upstream prebuilt tooling
        run: bun scripts/prepare-electrobun.ts
      - name: Run the packaged native launcher and shared terminal fixture
        run: bun scripts/qualify-electrobun.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; node24
        with:
          name: electrobun-macos-evidence
          path: |
            .bunly/benchmarks/electrobun*.json
            benchmarks/adapters/electrobun/bun.lock
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
