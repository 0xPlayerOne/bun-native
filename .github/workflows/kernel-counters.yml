name: M1 kernel counter qualification
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  kernel:
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
      BUNLY_KERNEL_COUNTERS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; node24
        with:
          python-version: '3.11'
      - name: Install process-observer prerequisites
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-dev.txt
          python -c 'import os,sys; open(os.environ["GITHUB_ENV"],"a").write("PYTHON="+sys.executable+"\n")'
      - run: |
          bun install --frozen-lockfile
          python tests/kernel_counters_test.py
          python tests/process_observer_test.py
      - run: |
          rustup toolchain install 1.85.1 --profile minimal
          bun run native:build
      - name: Collect OS-specific counters separately from plain timing runs
        run: |
          # Only this disposable Linux runner is changed; the collector never elevates or changes sysctls.
          if [ '${{ runner.os }}' = Linux ]; then
            previous=$(cat /proc/sys/kernel/sched_schedstats 2>/dev/null || true)
            if [ -n "$previous" ]; then
              sudo sysctl -w kernel.sched_schedstats=1 || true
              trap 'sudo sysctl -w kernel.sched_schedstats="$previous" >/dev/null || true' EXIT
            fi
          fi
          bun scripts/qualify-kernel.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; node24
        with:
          name: kernel-${{ matrix.os }}
          path: .bunly/qualification/kernel-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
