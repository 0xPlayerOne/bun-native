name: Code Foundry Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release-while-paused:
        description: Run only the release pipeline while the shared CI billing pause remains active.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One owner for draft staging and npm publication. Never cancel an active release.
concurrency:
  group: code-foundry-qualified-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Exact-main release qualification
    # This is distinct from PR-head validation. The reusable release workflow
    # may create a public tag, so it must not start on an unchecked main SHA.
    if: vars.CI_BILLING_PAUSED == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify fail-closed release-gate regressions
        run: node --test tests/quality/release-qualification.test.mjs
      - name: Require exact-main Validation/Gate and four actual CodeQL analyses
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/quality/release-qualification.mjs

  release:
    needs: qualify
    name: Release
    # Release Please manages version metadata. A version release is not native
    # window, packaging, signing or Bun AOT acceptance; those have separate gates.
    if: vars.CI_BILLING_PAUSED == 'false'
    uses: 0xPlayerOne/code-foundry/.github/workflows/release.yml@a8fcac90f8c96e1f294aecc7f3a2e874803b9c2b
    with:
      billing-pause-bypass: ${{ github.event_name == 'workflow_dispatch' && inputs['release-while-paused'] == true }}
      runner: ubuntu-slim
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: a8fcac90f8c96e1f294aecc7f3a2e874803b9c2b
      git-workflow: direct
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      # Required by the reusable legacy workflow's declared npm job, which is disabled here.
      id-token: write
    secrets:
      CODE_FOUNDRY_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
