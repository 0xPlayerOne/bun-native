name: Code Foundry Release

on:
  # Release only after the exact main commit's own Validation (which includes
  # every CodeQL analysis) has completed successfully (#614).
  workflow_run:
    workflows: [Bun Native Validation]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release-while-paused:
        description: Run only the release pipeline while the shared CI billing pause remains active.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One owner for draft staging and npm publication. Never cancel an active release.
concurrency:
  group: code-foundry-qualified-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualified:
    name: Qualified main head
    if: vars.CI_BILLING_PAUSED == 'false' || (github.event_name == 'workflow_dispatch' && inputs['release-while-paused'] == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      commit: ${{ steps.check.outputs.commit }}
      validation-run: ${{ steps.check.outputs.validation-run }}
    steps:
      - name: Require the current main head's own successful Validation
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$EVENT_NAME" = workflow_run ]; then
            if [ "$RUN_EVENT" != push ] || [ "$RUN_CONCLUSION" != success ]; then
              echo "Validation for $RUN_SHA was a $RUN_EVENT run that concluded $RUN_CONCLUSION; not releasing."
              echo release=false >> "$GITHUB_OUTPUT"
              exit 0
            fi
            target="$RUN_SHA"
          else
            target="$main_sha"
          fi
          if [ "$target" != "$main_sha" ]; then
            # A newer main commit owns the next release once its own Validation passes.
            echo "Validated $target is no longer the main head ($main_sha); not releasing."
            echo release=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed: the newest completed push Validation of this exact commit must be a success.
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/bun-native.yml/runs?head_sha=$target&event=push&status=completed&per_page=1" --jq '.workflow_runs[0] // {} | "\(.conclusion // "missing") \(.id // "")"')
          conclusion="${run%% *}"
          if [ "$conclusion" != success ]; then
            echo "::error::Main $target has no successful push Validation ($conclusion); refusing to release."
            exit 1
          fi
          echo "Releasing from $target after its own successful Validation and CodeQL."
          { echo release=true; echo "commit=$target"; echo "validation-run=${run#* }"; } >> "$GITHUB_OUTPUT"

  linux-provenance:
    # Fail closed: the Linux host archive that this exact commit's Validation built
    # must carry keyless Sigstore build provenance signed by native-linux.yml on
    # main (#249). Verification needs no secret; anyone can repeat it with
    # `gh attestation verify` (docs/releasing.md).
    name: Verify Linux host provenance
    needs: qualified
    if: needs.qualified.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      # The verifier comes from the default branch, never from the workflow_run
      # commit: the qualified commit is only data here (its run id and digest),
      # so no code from a triggering run executes with this job's token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Bun compiler
        run: node scripts/install-bun.mjs --destination "$RUNNER_TEMP/bun-native-bun"
      - name: Download the attested Linux host archive from Validation
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.qualified.outputs.validation-run }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name linux-host-provenance-X64 --dir "$RUNNER_TEMP/host"
      - name: Verify the archive's checksum and keyless provenance
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.qualified.outputs.commit }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/host/unsigned-native-host.tar.gz"
          expected=$(cut -d' ' -f1 "$archive.sha256")
          actual=$(sha256sum "$archive" | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Host archive digest $actual does not match its recorded $expected"
            exit 1
          fi
          bun scripts/quality/linux-provenance.ts verify "$archive" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow .github/workflows/native-linux.yml \
            --source-ref refs/heads/main --source-digest "$COMMIT" | tee "$RUNNER_TEMP/verification.json"
          { echo '## Linux host provenance'; echo; echo '```json'; cat "$RUNNER_TEMP/verification.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release
    needs: [qualified, linux-provenance]
    # Release Please manages version metadata. A version release is not native
    # window, packaging, signing or Bun AOT acceptance; those have separate gates.
    if: needs.qualified.outputs.release == 'true'
    uses: 0xPlayerOne/code-foundry/.github/workflows/release.yml@a8fcac90f8c96e1f294aecc7f3a2e874803b9c2b
    with:
      billing-pause-bypass: ${{ github.event_name == 'workflow_dispatch' && inputs['release-while-paused'] == true }}
      runner: ubuntu-slim
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: a8fcac90f8c96e1f294aecc7f3a2e874803b9c2b
      git-workflow: direct
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      # Required by the reusable legacy workflow's declared npm job, which is disabled here.
      id-token: write
    secrets:
      CODE_FOUNDRY_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-hosts:
    # Attach the qualified commit's release host archives to the version's GitHub
    # release, so `bun run native host install` (and `--host auto`) can fetch a
    # host that matches the checkout. Each archive comes from this exact commit's
    # successful Validation. Linux x64 is the archive whose keyless provenance the
    # linux-provenance job verified. Windows is deferred (ADR 0021).
    name: Attach release host archives
    needs: [qualified, linux-provenance, release]
    if: needs.qualified.outputs.release == 'true' && needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download, verify and attach every release host archive
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.qualified.outputs.validation-run }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/release-hosts"
          mkdir -p "$work/assets"
          # Artifact name (runner OS and arch) -> Node platform-arch asset name.
          for pair in Linux-X64:linux-x64 Linux-ARM64:linux-arm64 macOS-ARM64:darwin-arm64 macOS-X64:darwin-x64; do
            artifact="native-host-${pair%%:*}"
            target="${pair#*:}"
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$work/$artifact"
            archive="$work/$artifact/unsigned-native-host.tar.gz"
            expected=$(cut -d' ' -f1 "$archive.sha256")
            actual=$(sha256sum "$archive" | cut -d' ' -f1)
            if [ "$expected" != "$actual" ]; then
              echo "::error::$artifact digest $actual does not match its recorded $expected"
              exit 1
            fi
            cp "$archive" "$work/assets/bun-native-host-$target.tar.gz"
          done
          (cd "$work/assets" && sha256sum bun-native-host-*.tar.gz > SHA256SUMS)
          cat "$work/assets/SHA256SUMS"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$work"/assets/*
          { echo '## Release host archives'; echo; echo '```'; cat "$work/assets/SHA256SUMS"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  npm:
    # Publish the @bun-native packages of the released commit to npm with
    # trusted publishing: npm exchanges this job's GitHub OIDC token for a
    # short-lived publish credential and records provenance. No npm token or
    # secret exists. Each package's trusted publisher names this workflow file
    # ("npm packages" in docs/releasing.md). Versions already on npm are skipped, so
    # a re-run after a partial publish completes the set.
    name: Publish @bun-native packages to npm
    needs: [qualified, release, release-hosts]
    if: needs.qualified.outputs.release == 'true' && needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Use an npm with trusted publishing
        run: npm install -g npm@11.15.0 && npm --version
      - name: Install checksum-pinned Bun compiler
        run: node scripts/install-bun.mjs --destination "$RUNNER_TEMP/bun-native-bun"
      - run: bun install --frozen-lockfile
      - name: Produce the verified package set and its registry packages
        run: |
          bun scripts/package-native.ts --outdir "$RUNNER_TEMP/package-set"
          bun scripts/registry-packages.ts --package-set "$RUNNER_TEMP/package-set/manifest.json" --outdir "$RUNNER_TEMP/registry"
      - name: Publish in dependency order with provenance
        run: |
          set -euo pipefail
          while read -r short; do
            directory="$RUNNER_TEMP/registry/$short"
            name=$(node -p "require('$directory/package.json').name")
            version=$(node -p "require('$directory/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published; skipping."
              continue
            fi
            (cd "$directory" && npm publish --access public --provenance)
            echo "- $name@$version" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/registry/publish-order.txt"
