# Temporary research caller on a draft diagnostic branch. Restore the normal
# workflow before this branch can become an implementation merge candidate.
name: Windows retaining paths (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    name: Observe failed lifetime checkpoint (not qualification)
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node scripts/install-bun.mjs --destination "$RUNNER_TEMP/bun-native-bun"
      - run: bun install --frozen-lockfile
      - name: Record actual Windows cell-description format
        run: bun -e 'const j=require("bun:jsc");console.log(JSON.stringify({description:j.jscDescribe({syntheticAddressControl:true}),bunRevision:Bun.revision}))'
      - name: Fixed full-collector contrast, no retries
        run: |
          python - <<'PYEXPERIMENT'
          import hashlib, json, os, pathlib, subprocess
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'retention-paths'
          output.mkdir()
          source=pathlib.Path('tests/solid/renderer.test.ts')
          original=source.read_text()
          old="        return new WeakRef(root)"
          assert original.count(old)==1
          held=original.replace(old,"        const held: object[] = Reflect.get(globalThis, '__BUN_NATIVE_TEST_RETAINED_OWNERS') ?? []\n        held.push(root)\n        Reflect.set(globalThis, '__BUN_NATIVE_TEST_RETAINED_OWNERS', held)\n"+old)
          order=[['bun','release-sweep','sweep','held-negative'],['held-negative','sweep','release-sweep','bun'],['sweep','bun','held-negative','release-sweep']]
          plan={'scope':'Research: compare exactly one full synchronous collection at each unchanged checkpoint; producer timing/count/assertion unchanged. No qualification claim.','source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'order':order,'attemptsPerVariant':3,'testSha256':hashlib.sha256(original.encode()).hexdigest(),'heldControlSha256':hashlib.sha256(held.encode()).hexdigest(),'collectorSource':'Pinned Bun bindings.cpp JSC__VM__runGC versus BunJSCModule.h releaseWeakRefs and gcAndSweep','failurePolicy':'Keep every outcome, including contrary results, no retries.'}
          (output/'plan.json').write_text(json.dumps(plan,indent=2))
          outcomes=[]
          try:
              for block,names in enumerate(order,1):
                  for variant in names:
                      directory=output/f'{block:02d}-{variant}'
                      directory.mkdir()
                      source.write_text(held if variant=='held-negative' else original)
                      environment=dict(os.environ)
                      environment['BUN_NATIVE_RETENTION_DIAGNOSTICS_DIR']=str(directory)
                      environment['BUN_NATIVE_COLLECTOR_CONTROL']='release-sweep' if variant=='held-negative' else variant
                      command=['bun','test','--preload','./experiments/retention-collection-preload.ts','tests']
                      with (directory/'test.log').open('w') as log:
                          result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,env=environment,timeout=90,check=False)
                      reports=[json.loads(p.read_text()) for p in directory.glob('solid-retention-*.json')]
                      logs=(directory/'test.log').read_text()
                      outcome={'block':block,'variant':variant,'exitCode':result.returncode,'checkpointCount':logs.count('Bun Native research checkpoint:'),'survivors':[r['survivors'] for r in reports]}
                      outcomes.append(outcome)
                      print(json.dumps(outcome))
          finally:
              source.write_text(original)
              (output/'outcomes.json').write_text(json.dumps(outcomes,indent=2))
          PYEXPERIMENT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: windows-retaining-paths-${{ github.sha }}
          path: |
            ${{ runner.temp }}/retention-paths/
            !${{ runner.temp }}/retention-paths/**/*.heap.json
          if-no-files-found: error
          retention-days: 7
