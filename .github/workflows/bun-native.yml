# Temporary research caller on a draft diagnostic branch. Restore the normal
# workflow before this branch can become an implementation merge candidate.
name: Windows retaining paths (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    name: Observe failed lifetime checkpoint (not qualification)
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node scripts/install-bun.mjs --destination "$RUNNER_TEMP/bun-native-bun"
      - run: bun install --frozen-lockfile
      - name: Fixed original and failure-only observation, no retries
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'retention-paths'
          output.mkdir()
          plan = {'source': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'variants': ['baseline', 'failure-only-preload'], 'attemptsPerVariant': 1, 'scope': 'Research only; this is not Validation / Gate or a native qualification', 'testSha256': hashlib.sha256(pathlib.Path('tests/solid/renderer.test.ts').read_bytes()).hexdigest()}
          (output / 'plan.json').write_text(json.dumps(plan, indent=2))
          outcomes=[]
          for variant in plan['variants']:
              directory=output / variant
              directory.mkdir()
              environment=dict(os.environ)
              environment['BUN_NATIVE_RETENTION_DIAGNOSTICS_DIR']=str(directory)
              command=['bun','test']
              if variant=='failure-only-preload':
                  environment['BUN_NATIVE_RETENTION_ROOT_TRACE_DIR']=str(directory)
                  command += ['--preload','./experiments/retention-failure-preload.ts']
              command += ['tests']
              with (directory / 'test.log').open('w') as log:
                  result=subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, env=environment, timeout=90, check=False)
              outcomes.append({'variant':variant,'exitCode':result.returncode})
              print(json.dumps(outcomes[-1]))
          (output / 'outcomes.json').write_text(json.dumps(outcomes, indent=2))
          PY
      - name: Extract recorded ancestor paths from the failed observation
        if: ${{ !cancelled() }}
        run: python experiments/analyze-retention-path.py "$RUNNER_TEMP/retention-paths/failure-only-preload"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: windows-retaining-paths-${{ github.sha }}
          path: |
            ${{ runner.temp }}/retention-paths/
            !${{ runner.temp }}/retention-paths/**/*.heap.json
          if-no-files-found: error
          retention-days: 7
