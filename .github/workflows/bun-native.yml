# Temporary research caller on a draft diagnostic branch. Restore the normal
# workflow before this branch can become an implementation merge candidate.
name: Windows retaining paths (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    name: Observe failed lifetime checkpoint (not qualification)
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node scripts/install-bun.mjs --destination "$RUNNER_TEMP/bun-native-bun"
      - run: bun install --frozen-lockfile
      - name: Record actual Windows cell-description format
        run: bun -e 'const j=require("bun:jsc");console.log(JSON.stringify({description:j.jscDescribe({syntheticAddressControl:true}),bunRevision:Bun.revision}))'
      - name: Fixed disposal ownership contrast with unchanged producer assertions
        run: |
          python - <<'PYEXPERIMENT'
          import hashlib,json,os,pathlib,subprocess
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'retention-paths';output.mkdir()
          source=pathlib.Path('packages/renderer/src/root.ts');original=source.read_text()
          test=pathlib.Path('tests/solid/renderer.test.ts');original_test=test.read_text()
          old='  async dispose(): Promise<void> {\n    this.stop()\n    this.start()\n    await this.flush()\n    await this.closed\n  }'
          assert original.count(old)==1
          replacement='  dispose(): Promise<void> {\n    try {\n      this.stop()\n      this.start()\n      return joinClosed(this.flush(), this.closed)\n    } catch (cause) {\n      return Promise.reject(cause)\n    }\n  }'
          join='function joinClosed(work: Promise<void>, closed: Promise<void>): Promise<void> {\n  return work.then(() => closed)\n}\n\n'
          candidate=original.replace(old,replacement).replace('class Root implements RenderRoot, Owner {',join+'class Root implements RenderRoot, Owner {')
          needle='        return new WeakRef(root)';assert original_test.count(needle)==1
          held=original_test.replace(needle,"        const held: object[] = Reflect.get(globalThis, '__BUN_NATIVE_TEST_RETAINED_OWNERS') ?? []\n        held.push(root)\n        Reflect.set(globalThis, '__BUN_NATIVE_TEST_RETAINED_OWNERS', held)\n"+needle)
          order=[['original','joined-completion','held-negative'],['held-negative','joined-completion','original'],['joined-completion','original','held-negative']]
          plan={'scope':'Research: remove receiver capture from redundant disposal await frame, preserve operation-before-close join. Original GC and zero-survivor assertions unchanged.','source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'order':order,'attemptsPerVariant':3,'originalProductionSha256':hashlib.sha256(original.encode()).hexdigest(),'candidateProductionSha256':hashlib.sha256(candidate.encode()).hexdigest(),'originalTestSha256':hashlib.sha256(original_test.encode()).hexdigest(),'failurePolicy':'Every contrary outcome retained; no reruns'}
          (output/'plan.json').write_text(json.dumps(plan,indent=2));(output/'root-original.ts.txt').write_text(original);(output/'root-joined.ts.txt').write_text(candidate)
          outcomes=[]
          try:
              for block,names in enumerate(order,1):
                  for variant in names:
                      directory=output/f'{block:02d}-{variant}';directory.mkdir()
                      source.write_text(original if variant=='original' else candidate)
                      test.write_text(held if variant=='held-negative' else original_test)
                      environment=dict(os.environ);environment['BUN_NATIVE_RETENTION_DIAGNOSTICS_DIR']=str(directory)
                      with (directory/'test.log').open('w') as log:r=subprocess.run(['bun','test','tests'],stdout=log,stderr=subprocess.STDOUT,env=environment,timeout=90,check=False)
                      reports=[json.loads(p.read_text()) for p in directory.glob('solid-retention-*.json')]
                      outcome={'block':block,'variant':variant,'exitCode':r.returncode,'survivors':[d['survivors'] for d in reports]};outcomes.append(outcome);print(json.dumps(outcome))
          finally:
              source.write_text(original);test.write_text(original_test);(output/'outcomes.json').write_text(json.dumps(outcomes,indent=2))
          PYEXPERIMENT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: windows-retaining-paths-${{ github.sha }}
          path: |
            ${{ runner.temp }}/retention-paths/
            !${{ runner.temp }}/retention-paths/**/*.heap.json
          if-no-files-found: error
          retention-days: 7
