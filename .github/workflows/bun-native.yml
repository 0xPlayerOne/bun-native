name: Bun Native Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_call:

permissions:
  contents: read

concurrency:
  # A late draft synchronize event must not cancel ready-for-review validation.
  group: bun-native-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request' && (github.event.pull_request.draft && '-draft' || '-ready') || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Markdown cannot change native behavior, so a pull request that touches
    # only docs/ or *.md files skips the two GPUI suites (~20 runner-minutes).
    # Source, protocol and security checks still run, and main always runs all.
    name: Classify changes
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
          node -e '
            const fs = require("node:fs");
            const out = (value) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `docs-only=${value}\n`);
            (async () => {
              if (process.env.GITHUB_EVENT_NAME !== "pull_request") return out(false);
              const files = [];
              for (let page = 1; ; page++) {
                const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR}/files?per_page=100&page=${page}`;
                const response = await fetch(url, { headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: "application/vnd.github+json" } });
                if (!response.ok) throw new Error(`${url}: ${response.status}`);
                const batch = await response.json();
                for (const file of batch) files.push(file.filename, ...(file.previous_filename ? [file.previous_filename] : []));
                if (batch.length < 100) break;
              }
              console.log(files.join("\n"));
              out(files.length > 0 && files.every((path) => path.startsWith("docs/") || path.endsWith(".md")));
            })().catch((error) => { console.error(error); process.exit(1); });
          '

  source:
    name: Source quality
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    # Also the Linux leg of the protocol and AOT checks: a separate ubuntu
    # Protocol job re-ran this exact TypeScript suite.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Bun compiler
        run: node scripts/install-bun.mjs --destination "$RUNNER_TEMP/bun-native-bun"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: native-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.json', 'bun.lock', 'rust-toolchain.toml', 'Cargo.lock') }}
      - run: bun install --frozen-lockfile
      - name: Restore protocol dependency build outputs
        id: protocol-target-cache
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/build
            target/debug/deps
            target/debug/.fingerprint
          key: protocol-debug-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('protocol-debug-target-{0}-{1}-', runner.os, runner.arch) || '' }}
      - name: Format, lint, types and architecture
        run: |
          bun run format:check
          bun run lint
          bun run typecheck
          bun run check:boundaries
          bun run check:health
          bun run check:duplicates
          bun run build
      - name: Code-health summary
        if: ${{ !cancelled() }}
        run: bun scripts/quality/health-summary.ts >> "$GITHUB_STEP_SUMMARY"
      - name: TypeScript tests and coverage
        run: bun test tests --coverage
      - name: Rust protocol checks (no GUI claim)
        run: |
          cargo fmt --manifest-path Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path Cargo.toml -p bun-native-protocol --all-targets -- -D warnings
          cargo test --locked --manifest-path Cargo.toml -p bun-native-protocol
      - name: Save protocol dependency build outputs from protected main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.protocol-target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/build
            target/debug/deps
            target/debug/.fingerprint
          key: protocol-debug-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}
      - name: AOT native interop probes (ubuntu-24.04)
        run: |
          mkdir -p "$RUNNER_TEMP/bun-native-aot"
          node -e 'const fs=require("node:fs"),p=require("node:path");fs.writeFileSync(p.join(process.env.RUNNER_TEMP,"bun-native-aot","environment.json"),JSON.stringify({revision:process.env.GITHUB_SHA,os:process.platform,arch:process.arch,pins:require("./toolchain.json"),scope:"target-host headless AOT/native interop; no GPUI GUI claim"},null,2))'
          bun check --no-script -p experiments/aot-gpui/tsconfig.json
          bunx oxlint --deny-warnings experiments/aot-gpui
          bun experiments/aot-gpui/run.ts "$RUNNER_TEMP/bun-native-aot"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: aot-native-interop-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bun-native-aot/report.json
            ${{ runner.temp }}/bun-native-aot/environment.json
            ${{ runner.temp }}/bun-native-aot/*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Install checksum-pinned workflow linter
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --location --retry 3 --max-time 45 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Validate workflow syntax
        run: actionlint
      - name: Install pinned Python quality tool
        run: |
          python3 -m venv "$RUNNER_TEMP/native-quality"
          "$RUNNER_TEMP/native-quality/bin/pip" install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r scripts/quality/requirements.txt
          echo "$RUNNER_TEMP/native-quality/bin" >> "$GITHUB_PATH"
      - name: Native harness static and safety checks (headless)
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          ruff format --check scripts/quality/*.py benchmarks/*.py tests/quality tests/native/*.py
          ruff check scripts/quality/*.py benchmarks/*.py tests/quality tests/native/*.py
          python3 -m unittest discover -s tests/quality -p 'test_*.py' -v
          bash -n scripts/quality/native-linux-session.sh
      - name: Standalone allocation diagnostic contract (no GPUI or profiling)
        run: |
          cargo fmt --manifest-path experiments/native-allocation-api/Cargo.toml --all -- --check
          rustfmt --edition 2024 --check benchmarks/native-allocations/host.rs
          cargo clippy --locked --manifest-path experiments/native-allocation-api/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path experiments/native-allocation-api/Cargo.toml --all-targets

  protocol:
    name: Protocol and AOT (${{ matrix.os }})
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        # Linux runs these checks in Source. The AOT probes share this job's
        # Bun bootstrap and install instead of booking a third runner per OS.
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record bootstrap environment before installing toolchains
        run: |
          mkdir -p .bun-native/evidence
          {
            git rev-parse HEAD
            node --version
            node -e 'const os = require("node:os"); const fs = require("node:fs"); const crypto = require("node:crypto"); const bytes = fs.readFileSync("toolchain.json"); const pin = JSON.parse(bytes).bun; console.log(JSON.stringify({os:os.platform(),arch:os.arch(),release:os.release(),expectedBunRevision:pin.cliRevision,manifestSha256:crypto.createHash("sha256").update(bytes).digest("hex"),phase:"before Bun bootstrap"}))'
          } > .bun-native/evidence/bootstrap.txt
      - name: Install checksum-pinned Bun compiler
        run: node scripts/install-bun.mjs --destination "$RUNNER_TEMP/bun-native-bun" 2>&1 | tee .bun-native/evidence/bun-bootstrap.log
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: native-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.json', 'bun.lock', 'rust-toolchain.toml', 'Cargo.lock') }}
      - run: bun install --frozen-lockfile
      # Dependency build outputs (serde, serde_json and build scripts) come from
      # the last protected-main run of the same lockfile and toolchain; the
      # protocol crate itself still rebuilds. Cold, Windows spent 42 s here
      # (run 42136851837). The scheduled audit restores nothing.
      - name: Restore protocol dependency build outputs
        id: protocol-target-cache
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/build
            target/debug/deps
            target/debug/.fingerprint
          key: protocol-debug-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('protocol-debug-target-{0}-{1}-', runner.os, runner.arch) || '' }}
      - name: Record exact environment
        run: |
          {
            git rev-parse HEAD
            bun --version
            rustc --version --verbose
            cargo --version
            bun -e 'console.log(JSON.stringify({os:process.platform,arch:process.arch,mode:"development",coverage:"headless protocol"}))'
          } | tee .bun-native/evidence/toolchain.txt
      - name: Cross-platform TypeScript contracts
        env:
          # The existing protocol artifact retains this metadata only if the original assertion fails.
          BUN_NATIVE_RETENTION_DIAGNOSTICS_DIR: ${{ runner.os == 'Windows' && '.bun-native/evidence/retention' || '' }}
        run: bun test tests
      - name: Rust protocol checks (no GUI claim)
        run: |
          cargo fmt --manifest-path Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path Cargo.toml -p bun-native-protocol --all-targets -- -D warnings
          cargo test --locked --manifest-path Cargo.toml -p bun-native-protocol
      - name: Save protocol dependency build outputs from protected main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.protocol-target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/build
            target/debug/deps
            target/debug/.fingerprint
          key: protocol-debug-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}
      - name: Prepare compiler evidence
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/bun-native-aot"
          node -e 'const fs=require("node:fs"),p=require("node:path");fs.writeFileSync(p.join(process.env.RUNNER_TEMP,"bun-native-aot","environment.json"),JSON.stringify({revision:process.env.GITHUB_SHA,os:process.platform,arch:process.arch,pins:require("./toolchain.json"),scope:"target-host headless AOT/native interop; no GPUI GUI claim"},null,2))'
          cp .bun-native/evidence/bun-bootstrap.log "$RUNNER_TEMP/bun-native-aot/bootstrap.log"
      - name: Strict AOT probe checks
        if: ${{ !cancelled() }}
        run: |
          bun check --no-script -p experiments/aot-gpui/tsconfig.json
          bunx oxlint --deny-warnings experiments/aot-gpui
      - name: Execute genuine AOT, JIT control and native boundary probes
        if: ${{ !cancelled() }}
        run: bun experiments/aot-gpui/run.ts "$RUNNER_TEMP/bun-native-aot"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: aot-native-interop-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bun-native-aot/report.json
            ${{ runner.temp }}/bun-native-aot/environment.json
            ${{ runner.temp }}/bun-native-aot/*.log
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: protocol-${{ runner.os }}-${{ runner.arch }}
          path: .bun-native/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  native:
    name: Native Linux
    needs: changes
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.docs-only != 'true'
    # native-linux.yml signs the Linux host archive's keyless provenance on main pushes (#249).
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/native-linux.yml

  native-platforms:
    name: Native macOS and Windows
    needs: changes
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/native-platforms.yml
    # Optional release signing identities (#249); native-platforms.yml never uses them for pull requests.
    secrets:
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}

  security:
    name: Security
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    uses: ./.github/workflows/security.yml

  codeql:
    # CodeQL runs inside Validation so the required Validation / Gate check
    # cannot pass (and auto-merge or a release cannot fire) before every
    # analyzer finishes on this exact head (#607, #614).
    name: CodeQL
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: 0xPlayerOne/code-foundry/.github/workflows/codeql.yml@a8fcac90f8c96e1f294aecc7f3a2e874803b9c2b
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: a8fcac90f8c96e1f294aecc7f3a2e874803b9c2b
      runner: ubuntu-latest
      rust-shards: '["all"]'
      rust-threads: '1'
      rust-max-parallel: 1
      # All four languages are analyzed on every run. Code Foundry's planner
      # would otherwise mark unchanged languages "Not applicable", which
      # reports success without an analysis.
      plan: >-
        {"enabled":"true","rust_build_mode":"none","matrix":"[{\"display\":\"Actions\",\"language\":\"actions\",\"category\":\"/language:actions\",\"build_mode\":\"none\",\"changed\":true},{\"display\":\"TypeScript\",\"language\":\"javascript-typescript\",\"category\":\"/language:javascript-typescript\",\"build_mode\":\"none\",\"changed\":true},{\"display\":\"Python\",\"language\":\"python\",\"category\":\"/language:python\",\"build_mode\":\"none\",\"changed\":true},{\"display\":\"Rust\",\"language\":\"rust\",\"category\":\"/language:rust\",\"build_mode\":\"none\",\"changed\":true,\"shard\":\"all\"}]"}

  gate:
    # This exact check context is required by the existing protected-main ruleset.
    name: Validation / Gate
    needs: [changes, source, protocol, native, native-platforms, security, codeql]
    # Never skip: GitHub counts a skipped required check as passing, so a
    # draft-stage run would let auto-merge fire the moment a PR is marked
    # ready, before the ready-stage implementation jobs exist. A draft run
    # fails here instead; the ready-stage run replaces it on the same head.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    steps:
      - name: Refuse draft-stage validation
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo '::error::Draft pull requests are not validated. Mark the PR ready for review to run the required checks.'
          exit 1
      - name: Require every implementation check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only == 'true' }}
        run: |
          # Only a docs-only pull request may skip the two GPUI suites; any other skip fails.
          node -e 'const jobs=JSON.parse(process.env.RESULTS); const docsOnly=process.env.DOCS_ONLY==="true"; const skippable=new Set(["native","native-platforms"]); const failed=Object.entries(jobs).filter(([name,job])=>job.result!=="success"&&!(docsOnly&&skippable.has(name)&&job.result==="skipped")); if(failed.length){console.error(failed);process.exit(1)} if(docsOnly) console.log("Docs-only pull request: GPUI suites skipped.")'
      - name: Require a real CodeQL analysis for every language
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A successful "Not applicable" row is not an analysis: require the
          # analyzer step itself to have succeeded in this run attempt.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          for spec in 'Actions:Analyze' 'TypeScript:Analyze' 'Python:Analyze' 'Rust:Analyze Rust'; do
            language="${spec%%:*}"
            step="${spec#*:}"
            if ! jq -e --arg language "$language" --arg step "$step" '
              [.jobs[]
                | select(.name | endswith("CodeQL / Analyze (" + $language + ")"))
                | select(.status == "completed" and .conclusion == "success")
                | select(any(.steps[]?; .name == $step and .conclusion == "success"))
              ] | length == 1
            ' "$RUNNER_TEMP/jobs.json" > /dev/null; then
              echo "::error::No successful CodeQL $language analysis in this run attempt"
              exit 1
            fi
          done
      - name: Describe coverage precisely
        run: echo 'Passed four-language CodeQL analysis, source and checked-JavaScript contracts, portable protocol checks, AOT/native interoperability, dependency audits, and the release-host Linux native suite. Linux requires development/AOT public API and JavaScript input, stale-input rejection, listener lifecycle, native fault containment, dispatch fairness, event throughput, bridge acknowledgement diagnostics and repeated startup/RSS baselines. Linux input uses XTest and actual GPUI paint evidence on a software GPU. macOS and Windows require actual GPUI release builds, development/AOT native paint traversal, owned visible windows, pointer and Tab/text input, joined lifecycle cleanup, and a deliberately invalid paint negative control. Screenshots, physical input, display presentation, OS close-button behavior and IME remain separate evidence.' >> "$GITHUB_STEP_SUMMARY"
