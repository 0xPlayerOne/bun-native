# Temporary research caller on a draft diagnostic branch. Restore the normal
# workflow before this branch can become an implementation merge candidate.
name: Windows retaining paths (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    name: Observe failed lifetime checkpoint (not qualification)
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node scripts/install-bun.mjs --destination "$RUNNER_TEMP/bun-native-bun"
      - run: bun install --frozen-lockfile
      - name: Record actual Windows cell-description format
        run: bun -e 'const j=require("bun:jsc");console.log(JSON.stringify({description:j.jscDescribe({syntheticAddressControl:true}),bunRevision:Bun.revision}))'
      - name: Compile bounded owned-thread observer with the actual Windows SDK
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /LD /O2 /W4 /WX experiments\retention-windows-unwind.c /link /OUT:"%RUNNER_TEMP%\retention-windows-unwind.dll"
          if errorlevel 1 exit /b 1
      - name: Fixed original and failure-only Windows unwind observation
        run: |
          python - <<'PYEXPERIMENT'
          import hashlib,json,os,pathlib,subprocess
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'retention-paths';output.mkdir()
          helper=pathlib.Path(os.environ['RUNNER_TEMP'])/'retention-windows-unwind.dll'
          variants=['original','failure-only-windows-unwind']
          plan={'scope':'After-failure Windows native virtual unwind; original producer and acceptance unchanged. Research only.','source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'variants':variants,'attemptsPerVariant':1,'testSha256':hashlib.sha256(pathlib.Path('tests/solid/renderer.test.ts').read_bytes()).hexdigest(),'helperSha256':hashlib.sha256(helper.read_bytes()).hexdigest()}
          (output/'plan.json').write_text(json.dumps(plan,indent=2));outcomes=[]
          for variant in variants:
              directory=output/variant;directory.mkdir();environment=dict(os.environ)
              environment['BUN_NATIVE_RETENTION_DIAGNOSTICS_DIR']=str(directory)
              command=['bun','test']
              if variant!='original':
                  environment['BUN_NATIVE_RETENTION_ROOT_TRACE_DIR']=str(directory)
                  environment['BUN_NATIVE_RETENTION_UNWIND_DLL']=str(helper)
                  command += ['--preload','./experiments/retention-failure-preload.ts']
              command += ['tests']
              with (directory/'test.log').open('w') as log:r=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,env=environment,timeout=90,check=False)
              outcomes.append({'variant':variant,'exitCode':r.returncode});print(json.dumps(outcomes[-1]))
          (output/'outcomes.json').write_text(json.dumps(outcomes,indent=2))
          PYEXPERIMENT
      - name: Extract selected graph and observed frame identities
        if: ${{ !cancelled() }}
        run: python experiments/analyze-retention-path.py "$RUNNER_TEMP/retention-paths/failure-only-windows-unwind"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: windows-retaining-paths-${{ github.sha }}
          path: |
            ${{ runner.temp }}/retention-paths/
            !${{ runner.temp }}/retention-paths/**/*.heap.json
          if-no-files-found: error
          retention-days: 7
