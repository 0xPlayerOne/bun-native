# Temporary research caller on a draft diagnostic branch. Restore the normal
# workflow before this branch can become an implementation merge candidate.
name: Windows retaining paths (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    name: Observe failed lifetime checkpoint (not qualification)
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node scripts/install-bun.mjs --destination "$RUNNER_TEMP/bun-native-bun"
      - run: bun install --frozen-lockfile
      - name: Record actual Windows cell-description format
        run: bun -e 'const j=require("bun:jsc");console.log(JSON.stringify({description:j.jscDescribe({syntheticAddressControl:true}),bunRevision:Bun.revision}))'
      - name: Install one exact independently verified official candidate
        run: node experiments/install-retention-candidate.mjs "$RUNNER_TEMP/retention-candidate"
      - name: Fixed current-vs-candidate source experiment with ownership negatives
        run: |
          python - <<'PYEXPERIMENT'
          import hashlib,json,os,pathlib,shutil,subprocess
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'retention-paths';output.mkdir()
          source=pathlib.Path('tests/solid/renderer.test.ts');original=source.read_text()
          old="        return new WeakRef(root)";assert original.count(old)==1
          held=original.replace(old,"        const held: object[] = Reflect.get(globalThis, '__BUN_NATIVE_TEST_RETAINED_OWNERS') ?? []\n        held.push(root)\n        Reflect.set(globalThis, '__BUN_NATIVE_TEST_RETAINED_OWNERS', held)\n"+old)
          candidate=pathlib.Path(os.environ['RUNNER_TEMP'])/'retention-candidate'/'bun.exe'
          current=shutil.which('bun');assert current
          order=[['current','candidate','current-held','candidate-held'],['candidate-held','current-held','candidate','current'],['candidate','current','candidate-held','current-held']]
          identities={}
          for name,binary in [('current',current),('candidate',str(candidate))]:
              r=subprocess.run([binary,'-e','console.log(JSON.stringify({version:Bun.version,revision:Bun.revision}))'],capture_output=True,text=True,check=True,timeout=30)
              identities[name]=json.loads(r.stdout)
          plan={'scope':'Exact official compiler comparison; no repository toolchain change or native/AOT qualification. Same producer checkpoints and assertion.','source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'order':order,'attemptsPerVariant':3,'testSha256':hashlib.sha256(original.encode()).hexdigest(),'heldControlSha256':hashlib.sha256(held.encode()).hexdigest(),'identities':identities,'failurePolicy':'Keep every outcome, no retries.'}
          (output/'plan.json').write_text(json.dumps(plan,indent=2));outcomes=[]
          shutil.copyfile(candidate.parent/'receipt.json',output/'candidate-receipt.json')
          try:
              for block,names in enumerate(order,1):
                  for variant in names:
                      directory=output/f'{block:02d}-{variant}';directory.mkdir()
                      source.write_text(held if variant.endswith('-held') else original)
                      environment=dict(os.environ);environment['BUN_NATIVE_RETENTION_DIAGNOSTICS_DIR']=str(directory)
                      binary=str(candidate) if variant.startswith('candidate') else current
                      with (directory/'test.log').open('w') as log:r=subprocess.run([binary,'test','tests'],stdout=log,stderr=subprocess.STDOUT,env=environment,timeout=90,check=False)
                      reports=[json.loads(p.read_text()) for p in directory.glob('solid-retention-*.json')]
                      outcome={'block':block,'variant':variant,'exitCode':r.returncode,'survivors':[d['survivors'] for d in reports]};outcomes.append(outcome);print(json.dumps(outcome))
          finally:
              source.write_text(original);(output/'outcomes.json').write_text(json.dumps(outcomes,indent=2))
          PYEXPERIMENT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: windows-retaining-paths-${{ github.sha }}
          path: |
            ${{ runner.temp }}/retention-paths/
            !${{ runner.temp }}/retention-paths/**/*.heap.json
          if-no-files-found: error
          retention-days: 7
