# Temporary research caller on a draft diagnostic branch. Restore the normal
# workflow before this branch can become an implementation merge candidate.
name: Windows retaining paths (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    name: Observe failed lifetime checkpoint (not qualification)
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node scripts/install-bun.mjs --destination "$RUNNER_TEMP/bun-native-bun"
      - run: bun install --frozen-lockfile
      - name: Record actual Windows cell-description format
        run: bun -e 'const j=require("bun:jsc");console.log(JSON.stringify({description:j.jscDescribe({syntheticAddressControl:true}),bunRevision:Bun.revision}))'
      - name: Fixed caller-local ownership experiment, no retries
        run: |
          python - <<'PYEXPERIMENT'
          import hashlib, json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'retention-paths'
          output.mkdir()
          source=pathlib.Path('tests/solid/renderer.test.ts')
          original=source.read_text()
          old = """        const root = render(() => label(String(index)), window)
                  await root.ready
                  await root.dispose()
                  return new WeakRef(root)"""
          old='\n'.join(line[10:] if i else line for i,line in enumerate(old.splitlines()))
          # Find by exact stable statements; indentation is read from committed bytes.
          old="        const root = render(() => label(String(index)), window)\n        await root.ready\n        await root.dispose()\n        return new WeakRef(root)"
          assert original.count(old)==1
          neutral="        const root = render(() => label(String(index)), window)\n        await root.ready\n        await root.dispose()\n        const reference = new WeakRef(root)\n        return reference"
          cleared="        let root: ReturnType<typeof render> | undefined = render(() => label(String(index)), window)\n        await root.ready\n        await root.dispose()\n        const reference = new WeakRef(root)\n        root = undefined\n        return reference"
          held=cleared.replace('        root = undefined','        const held: object[] = Reflect.get(globalThis, \"__BUN_NATIVE_TEST_RETAINED_OWNERS\") ?? []\n        held.push(root)\n        Reflect.set(globalThis, \"__BUN_NATIVE_TEST_RETAINED_OWNERS\", held)\n        root = undefined').replace('\"','"')
          variants={'original':original,'neutral':original.replace(old,neutral),'cleared-local':original.replace(old,cleared),'held-negative':original.replace(old,held)}
          order=[['original','neutral','cleared-local','held-negative'],['held-negative','cleared-local','neutral','original'],['neutral','original','held-negative','cleared-local']]
          plan={'scope':'Research: separate caller-owned async local from framework ownership; unchanged full source suite and original two collection checkpoints. Not qualification.','source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'order':order,'attemptsPerVariant':3,'sourceSha256':{n:hashlib.sha256(v.encode()).hexdigest() for n,v in variants.items()},'expected':{'original':'retained final root','neutral':'retained final root','cleared-local':'zero retained roots','held-negative':'ten retained roots'},'failurePolicy':'Keep all outcomes and do not repeat contrary results.'}
          (output/'plan.json').write_text(json.dumps(plan,indent=2))
          outcomes=[]
          try:
              for block,names in enumerate(order,1):
                  for variant in names:
                      directory=output/f'{block:02d}-{variant}'
                      directory.mkdir()
                      source.write_text(variants[variant])
                      (directory/'renderer.test.ts.txt').write_text(variants[variant])
                      environment=dict(os.environ)
                      environment['BUN_NATIVE_RETENTION_DIAGNOSTICS_DIR']=str(directory)
                      with (directory/'test.log').open('w') as log:
                          result=subprocess.run(['bun','test','tests'],stdout=log,stderr=subprocess.STDOUT,env=environment,timeout=90,check=False)
                      reports=[json.loads(p.read_text()) for p in directory.glob('solid-retention-*.json')]
                      outcome={'block':block,'variant':variant,'exitCode':result.returncode,'survivors':[r['survivors'] for r in reports]}
                      outcomes.append(outcome)
                      print(json.dumps(outcome))
          finally:
              source.write_text(original)
              (output/'outcomes.json').write_text(json.dumps(outcomes,indent=2))
          PYEXPERIMENT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: windows-retaining-paths-${{ github.sha }}
          path: |
            ${{ runner.temp }}/retention-paths/
            !${{ runner.temp }}/retention-paths/**/*.heap.json
          if-no-files-found: error
          retention-days: 7
