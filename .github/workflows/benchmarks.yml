name: M2 workbench and benchmark qualification
on:
  pull_request:
    types: [synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHON: python
concurrency:
  group: benchmarks-${{ github.ref }}${{ github.event_name == 'pull_request' && (github.event.pull_request.draft && '-draft' || '-ready') || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  portable:
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 10 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; node24
        with:
          python-version: '3.11'
      - name: Install process-observer prerequisites
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements.txt
          python -c 'import os,sys; open(os.environ["GITHUB_ENV"],"a").write("PYTHON="+sys.executable+"\n")'
      - run: bun install --frozen-lockfile
      - run: bun run check:portable
      - run: |
          python tests/process_observer_test.py
      - name: Install pinned Bun runtime for benchmark evidence
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Validate pinned terminal regression CLI
        run: bun test tests/terminal-regression-command.test.ts
      - run: bun run benchmark:smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; node24
        if: ${{ !cancelled() }}
        with:
          name: m2-mock-evidence
          path: .bunly/benchmarks/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  electron:
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; node24
        with:
          python-version: '3.11'
      - name: Install process-observer prerequisites
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-dev.txt
          python -c 'import os,sys; open(os.environ["GITHUB_ENV"],"a").write("PYTHON="+sys.executable+"\n")'
      - run: |
          bun install --frozen-lockfile
          bun install --cwd benchmarks/fixtures --frozen-lockfile
          bun install --cwd benchmarks/adapters/electron --frozen-lockfile
          bun benchmarks/adapters/electron/node_modules/electron/install.js
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Configure sandbox helper in the disposable runner
        run: |
          sandbox=$(realpath benchmarks/adapters/electron/node_modules/electron/dist/chrome-sandbox)
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Run real Electron scenarios without disabling isolation
        run: xvfb-run -a bun scripts/benchmark.ts record electron .bunly/benchmarks/electron.json --trials=3 --warmups=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; node24
        if: ${{ !cancelled() }}
        with:
          name: m2-electron-evidence
          path: |
            .bunly/benchmarks/**
            benchmarks/fixtures/bun.lock
            benchmarks/adapters/electron/bun.lock
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
