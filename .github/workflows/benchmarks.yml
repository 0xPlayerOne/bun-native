name: M2 workbench and benchmark qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: psutil==7.0.0
          python tests/process_observer_test.py
      - run: bun run benchmark:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m2-mock-evidence
          path: .bunly/benchmarks/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  electron:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: |
          bun install --frozen-lockfile
          bun install --cwd benchmarks/fixtures
          bun install --cwd benchmarks/adapters/electron
          echo FIXTURE_LOCK_BEGIN
          cat benchmarks/fixtures/bun.lock
          echo FIXTURE_LOCK_END
          echo ELECTRON_LOCK_BEGIN
          cat benchmarks/adapters/electron/bun.lock
          echo ELECTRON_LOCK_END
      - run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: psutil==7.0.0
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Configure sandbox helper in the disposable runner
        run: |
          sandbox=$(realpath benchmarks/adapters/electron/node_modules/electron/dist/chrome-sandbox)
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Run real Electron scenarios without disabling isolation
        run: xvfb-run -a bun scripts/benchmark.ts record electron .bunly/benchmarks/electron.json --trials=3 --warmups=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m2-electron-evidence
          path: |
            .bunly/benchmarks/**
            benchmarks/fixtures/bun.lock
            benchmarks/adapters/electron/bun.lock
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
