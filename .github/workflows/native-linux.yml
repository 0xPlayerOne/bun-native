name: Native Linux

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: GPUI release, native contracts and baselines
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      BUN_NATIVE_HOST_PROFILE: release
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare evidence directory
        run: |
          mkdir "$RUNNER_TEMP/native-evidence"
          echo "NATIVE_EVIDENCE=$RUNNER_TEMP/native-evidence" >> "$GITHUB_ENV"
      - name: Install checksum-pinned Bun compiler
        run: node scripts/install-bun.mjs --destination "$RUNNER_TEMP/bun-native-bun"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install native build and isolated X11 prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libfontconfig-dev libglib2.0-dev libssl-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libzstd-dev \
            mesa-vulkan-drivers xvfb xauth x11-utils openbox xdotool imagemagick \
            dbus-x11 dunst fonts-dejavu-core heaptrack binutils
      - name: Pin the installed Mesa CPU Vulkan ICD for isolated Xvfb
        run: |
          echo 'Installed Mesa Vulkan ICD files:'
          dpkg-query -L mesa-vulkan-drivers | grep -E '(/icd.d/|libvulkan_lvp)' || true
          mapfile -t manifests < <(dpkg-query -L mesa-vulkan-drivers | grep -E '/lvp_icd[^/]*\.json$' || true)
          if (( ${#manifests[@]} != 1 )); then
            echo "::error::Expected exactly one Mesa Lavapipe ICD, found ${#manifests[@]}" >&2
            exit 1
          fi
          manifest=${manifests[0]}
          test -r "$manifest"
          dpkg-query -S "$manifest"
          printf 'VK_DRIVER_FILES=%s\n' "$manifest" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: gpui-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.json', 'bun.lock', 'rust-toolchain.toml', 'Cargo.lock') }}
      - run: bun install --frozen-lockfile
      - name: Record build environment
        run: |
          {
            git rev-parse HEAD
            uname -a
            bun --revision
            rustc --version --verbose
            cargo --version
            cc --version
            dpkg-query -W libvulkan1 mesa-vulkan-drivers libwayland-client0 libxkbcommon0 xvfb openbox xdotool imagemagick dunst heaptrack libheaptrack binutils
            printf 'Vulkan ICD: %s\n' "${VK_DRIVER_FILES:?}"
            sha256sum "$VK_DRIVER_FILES"
            printf 'Application modes: Bun development and verified machine-code AOT\nNative host profile: release\nDisplay: isolated Xvfb X11\nInput: XTest\nRenderer request: Mesa software Vulkan/GL; actual adapter in result.json\n'
          } > "$NATIVE_EVIDENCE/toolchain.txt"
      - name: Keep the runner's Cargo home path out of native binaries
        # Dependency sources live under CARGO_HOME, and their panic locations are
        # otherwise embedded verbatim, so equal sources built under another home
        # differ. See docs/reproducible-builds.md.
        run: printf 'CARGO_ENCODED_RUSTFLAGS=--remap-path-prefix=%s=/cargo\n' "${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
      - name: Check native source formatting
        run: cargo fmt --manifest-path Cargo.toml --all -- --check
      - name: Build native executable
        id: native-build
        run: |
          { time -p cargo build --locked --release --manifest-path Cargo.toml -p bun-native-host --bin bun-native-host --example clipboard-peer --example shortcut-peer; } 2>&1 | tee "$NATIVE_EVIDENCE/build.log"
          sha256sum target/release/bun-native-host > "$NATIVE_EVIDENCE/binary-sha256.txt"
          stat --format='%s bytes' target/release/bun-native-host > "$NATIVE_EVIDENCE/binary-size.txt"
          sha256sum target/release/examples/clipboard-peer > "$NATIVE_EVIDENCE/clipboard-peer-sha256.txt"
          stat --format='%s bytes' target/release/examples/clipboard-peer > "$NATIVE_EVIDENCE/clipboard-peer-size.txt"
          sha256sum target/release/examples/shortcut-peer > "$NATIVE_EVIDENCE/shortcut-peer-sha256.txt"
      - name: Lint and test actual native host
        run: |
          cargo clippy --locked --release --manifest-path Cargo.toml -p bun-native-host --all-targets -- -D warnings
          cargo test --locked --release --manifest-path Cargo.toml -p bun-native-host
      - name: Qualify fixed allocation regions with the actual Rust and Heaptrack ABI
        timeout-minutes: 3
        run: |
          python3 benchmarks/native-allocation-control.py \
            --output "$NATIVE_EVIDENCE/allocation-selection"
      - name: Development public API input, stale revision and window lifecycle
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
          BUN_NATIVE_STARTUP_LOG: '1'
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/development" development bun examples/native-window/main.ts
      - name: Development checked-JavaScript consumer input
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/javascript-development" javascript bun tests/native/javascript.js
      - name: Development public listener and subtree lifecycle
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/lifecycle-development" core-lifecycle bun tests/native/public-lifecycle.ts
      - name: Development native input event throughput
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/events-development" event-throughput bun tests/native/event-throughput.ts
      - name: Compile and inspect the actual AOT entries
        run: |
          for entry in native-window input-race bridge javascript core-lifecycle event-throughput fault scheduling layout interactions services clipboard global-shortcuts notifications filesystem-grants solid-services react-services solid solid-input-intent solid-interactions react react-interactions react-behavior react-workload react-workspace react-workspace-flow; do
            outdir="$NATIVE_EVIDENCE/$entry-package"
            if [[ "$entry" == native-window ]]; then
              outdir="$NATIVE_EVIDENCE/package"
            fi
            bun experiments/aot-gpui/build-window.ts \
              --source "$GITHUB_WORKSPACE" \
              --host "$GITHUB_WORKSPACE/target/release/bun-native-host" \
              --entry "$entry" --host-profile release --outdir "$outdir"
          done
      - name: Development and AOT bounded X11 clipboard service
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
          BUN_NATIVE_CLIPBOARD_PEER: ${{ github.workspace }}/target/release/examples/clipboard-peer
        run: |
          for mode in development aot; do
            command=(bun tests/native/clipboard.ts)
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/clipboard-package/clipboard")
            fi
            evidence="$NATIVE_EVIDENCE/diagnostics-$mode-clipboard"
            xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- python3 scripts/quality/native-diagnostics-linux.py \
              --output "$evidence" --scenario clipboard --mode "$mode" \
              --host-profile release -- "${command[@]}"
          done
      - name: Development and AOT X11 global shortcuts
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
          BUN_NATIVE_SHORTCUT_PEER: ${{ github.workspace }}/target/release/examples/shortcut-peer
        run: |
          for mode in development aot; do
            command=(bun tests/native/global-shortcuts.ts)
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/global-shortcuts-package/global-shortcuts")
            fi
            evidence="$NATIVE_EVIDENCE/global-shortcuts-$mode"
            mkdir "$evidence"
            BUN_NATIVE_SHORTCUT_EVIDENCE="$evidence" BUN_NATIVE_SHORTCUT_MODE="$mode" \
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- "${command[@]}" 2>&1 | tee "$evidence/run.log"
          done
      - name: Development and AOT freedesktop notifications
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for mode in development aot; do
            command=(bun tests/native/notifications.ts)
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/notifications-package/notifications")
            fi
            evidence="$NATIVE_EVIDENCE/notifications-$mode"
            mkdir "$evidence"
            BUN_NATIVE_NOTIFICATION_EVIDENCE="$evidence" BUN_NATIVE_NOTIFICATION_MODE="$mode" \
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- "${command[@]}" 2>&1 | tee "$evidence/run.log"
          done
      - name: Development and AOT filesystem grants
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for mode in development aot; do
            command=(bun tests/native/filesystem-grants.ts)
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/filesystem-grants-package/filesystem-grants")
            fi
            evidence="$NATIVE_EVIDENCE/filesystem-grants-$mode"
            mkdir "$evidence"
            BUN_NATIVE_FILESYSTEM_EVIDENCE="$evidence" BUN_NATIVE_FILESYSTEM_MODE="$mode" \
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- "${command[@]}" 2>&1 | tee "$evidence/run.log"
          done
      - name: Development and AOT native display service through core, Solid and React
        timeout-minutes: 5
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for entry in services solid-services react-services; do
            package="$NATIVE_EVIDENCE/$entry-package"
            for mode in development aot; do
              session_mode="$entry"
              command=(bun "$package/development/application.js")
              if [[ "$entry" == services ]]; then
                command=(bun tests/native/services.ts)
              fi
              if [[ "$mode" == aot ]]; then
                session_mode="aot-$entry"
                command=("$package/$entry")
              fi
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
                dbus-run-session -- bash scripts/quality/native-linux-session.sh \
                "$NATIVE_EVIDENCE/desktop-services-$entry-$mode" "$session_mode" "${command[@]}"
            done
          done
      - name: Development and AOT Solid native input, keyed updates and event phases
        timeout-minutes: 8
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for mode in development aot; do
            for scenario in counter-click counter-input input-intent interactions-keyboard interactions-caret interactions-selection; do
              entry=solid
              if [[ "$scenario" == input-intent ]]; then
                entry=solid-input-intent
              elif [[ "$scenario" == interactions-* ]]; then
                entry=solid-interactions
              fi
              package="$NATIVE_EVIDENCE/$entry-package"
              command=(bun "$package/development/application.js")
              if [[ "$mode" == aot ]]; then
                command=("$package/$entry")
              fi
              evidence="$NATIVE_EVIDENCE/solid-$mode-$scenario"
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
                dbus-run-session -- bash scripts/quality/native-linux-session.sh \
                "$evidence-session" -- python3 tests/native/solid-window.py \
                --scenario "$scenario" --mode "$mode" --output "$evidence" -- "${command[@]}"
            done
          done
      - name: Development and AOT React keyed counter, input and cleanup
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for mode in development aot; do
            command=(bun "$NATIVE_EVIDENCE/react-package/development/application.js")
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/react-package/react")
            fi
            for scenario in counter-click counter-input; do
              evidence="$NATIVE_EVIDENCE/react-$mode-$scenario"
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
                dbus-run-session -- bash scripts/quality/native-linux-session.sh \
                "$evidence-session" -- python3 tests/native/react-window.py \
                --scenario "$scenario" --mode "$mode" --output "$evidence" -- "${command[@]}"
            done
          done
      - name: Development and AOT React native event phases, caret and selection
        timeout-minutes: 4
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for mode in development aot; do
            command=(bun "$NATIVE_EVIDENCE/react-interactions-package/development/application.js")
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/react-interactions-package/react-interactions")
            fi
            for scenario in keyboard caret selection; do
              evidence="$NATIVE_EVIDENCE/react-$mode-interactions-$scenario"
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
                dbus-run-session -- bash scripts/quality/native-linux-session.sh \
                "$evidence-session" -- python3 tests/native/renderer-interactions.py \
                --renderer React --scenario "$scenario" --mode "$mode" \
                --output "$evidence" -- "${command[@]}"
            done
          done
      - name: Development and AOT React hooks, boundaries and cleanup failures
        timeout-minutes: 6
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for mode in development aot; do
            command=(bun "$NATIVE_EVIDENCE/react-behavior-package/development/application.js")
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/react-behavior-package/react-behavior")
            fi
            for scenario in lifecycle boundary-fallback boundary-recovery recoverable-retry throwing-reporter cleanup-effect cleanup-ref transition; do
              evidence="$NATIVE_EVIDENCE/react-$mode-behavior-$scenario"
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
                dbus-run-session -- bash scripts/quality/native-linux-session.sh \
                "$evidence-session" -- python3 tests/native/react-behavior.py \
                --scenario "$scenario" --mode "$mode" --output "$evidence" -- "${command[@]}"
            done
          done
      - name: Development and AOT React workspace task flow, scrolling and cleanup
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for mode in development aot; do
            command=(bun "$NATIVE_EVIDENCE/react-workspace-flow-package/development/application.js")
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/react-workspace-flow-package/react-workspace-flow")
            fi
            evidence="$NATIVE_EVIDENCE/diagnostics-$mode-react-workspace"
            xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- python3 scripts/quality/native-diagnostics-linux.py \
              --scenario react-workspace --mode "$mode" --host-profile release \
              --output "$evidence" -- "${command[@]}"
          done
      - name: Development and AOT React update and lifecycle diagnostics
        timeout-minutes: 7
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          evidence="$NATIVE_EVIDENCE/react-workload"
          mkdir "$evidence"
          for mode in development aot; do
            command=(bun "$NATIVE_EVIDENCE/react-workload-package/development/application.js")
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/react-workload-package/react-workload")
            fi
            # The small development calibration asserts zero WeakRef survivors
            # after two mounts; JSC's DFG tier can pin the last mount's scope
            # (54/100 failures with DFG, 0/100 without; see
            # benchmarks/retention/settled-collection.md). Timed runs keep DFG.
            calibration_env=()
            if [[ "$mode" == development ]]; then
              calibration_env=(BUN_JSC_useDFGJIT=0)
            fi
            nonce=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
            env "${calibration_env[@]}" \
              BUN_NATIVE_EVIDENCE_LOG="$evidence/calibration-$mode.jsonl" \
              BUN_NATIVE_EVIDENCE_NONCE="$nonce" \
              timeout --kill-after=5s 150s xvfb-run --auto-servernum \
                --server-args='-screen 0 1280x800x24 -nolisten tcp' \
                dbus-run-session -- bash scripts/quality/native-linux-session.sh \
                "$evidence/calibration-$mode-session" -- "${command[@]}" \
                --host "$BUN_NATIVE_HOST" --output "$evidence/calibration-$mode.json" \
                --nonce "$nonce" --mode "$mode" --iterations 10 --rotations 10 \
                --mounts 2 --rows 32 --calibration > "$evidence/calibration-$mode.log" 2>&1
            nonce=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
            timeout --kill-after=5s 150s xvfb-run --auto-servernum \
              --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence/$mode-session" -- "${command[@]}" \
              --host "$BUN_NATIVE_HOST" --output "$evidence/$mode.json" \
              --nonce "$nonce" --mode "$mode" --iterations 1000 --rotations 1000 \
              --mounts 1000 --rows 32 > "$evidence/$mode.log" 2>&1
          done
      - name: AOT public API pointer, text, keyboard, paint and close
        env:
          BUN_NATIVE_HOST: ${{ runner.temp }}/native-evidence/package/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/aot" aot "$NATIVE_EVIDENCE/package/native-window"
      - name: AOT stale native input rejection
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/input-race-aot" aot-input-race "$NATIVE_EVIDENCE/input-race-package/input-race"
      - name: AOT checked-JavaScript consumer input
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/javascript-aot" aot-javascript "$NATIVE_EVIDENCE/javascript-package/javascript"
      - name: AOT public listener and subtree lifecycle
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/lifecycle-aot" aot-core-lifecycle "$NATIVE_EVIDENCE/core-lifecycle-package/core-lifecycle"
      - name: AOT native input event throughput
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/events-aot" aot-event-throughput "$NATIVE_EVIDENCE/event-throughput-package/event-throughput"
      - name: Development and AOT native failure, scheduling, layout and interaction contracts
        timeout-minutes: 4
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for mode in development aot; do
            for scenario in startup-failure host-crash scheduling scheduling-control layout interactions; do
              case "$scenario" in
                startup-failure|host-crash) fixture=fault ;;
                scheduling|scheduling-control) fixture=scheduling ;;
                layout) fixture=layout ;;
                interactions) fixture=interactions ;;
              esac
              command=(bun "tests/native/$fixture.ts")
              if [[ "$mode" == aot ]]; then
                command=("$NATIVE_EVIDENCE/$fixture-package/$fixture")
              fi
              evidence="$NATIVE_EVIDENCE/diagnostics-$mode-$scenario"
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
                dbus-run-session -- bash scripts/quality/native-linux-session.sh \
                "$evidence-session" -- python3 scripts/quality/native-diagnostics-linux.py \
                --output "$evidence" --scenario "$scenario" --mode "$mode" \
                --host-profile release -- "${command[@]}"
            done
          done
      - name: Development release-host boundary rejection, online and in an empty network namespace
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          # Raw frames to the actual host: version mismatch, pre-hello and
          # duplicate hello, non-increasing ids, invalid/forbidden/oversized
          # frames and a real window round trip (#247).
          timeout 60s xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/boundary-online" -- bun tests/native/boundary.ts \
            | tee "$NATIVE_EVIDENCE/boundary-online.json"
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          # Lift it on this ephemeral runner so the same fixture runs with only
          # loopback; the fixture itself asserts that no other interface exists.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          BUN_NATIVE_REQUIRE_OFFLINE=1 timeout 60s unshare --map-root-user --net \
            xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/boundary-offline" -- bun tests/native/boundary.ts \
            | tee "$NATIVE_EVIDENCE/boundary-offline.json"
          grep -q '"offline":true' "$NATIVE_EVIDENCE/boundary-offline.json"
      - name: Development bridge acknowledgement measurements
        timeout-minutes: 4
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/bridge-development-session" -- bun benchmarks/bridge.ts \
            --mode development --host "$GITHUB_WORKSPACE/target/release/bun-native-host" \
            --host-profile release --source "$GITHUB_WORKSPACE" \
            --output "$NATIVE_EVIDENCE/bridge-development" 2>&1 | tee "$NATIVE_EVIDENCE/bridge-development.log"
      - name: Profile native allocations during development and AOT lifecycle
        timeout-minutes: 5
        run: |
          for mode in development aot; do
            command=(bun tests/native/public-lifecycle.ts)
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/core-lifecycle-package/core-lifecycle")
            fi
            evidence="$NATIVE_EVIDENCE/allocations-$mode"
            xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "${evidence}-session" -- python3 scripts/quality/native-allocation-linux.py \
              --output "$evidence" --host "$GITHUB_WORKSPACE/target/release/bun-native-host" \
              --host-profile release --mode "$mode" -- "${command[@]}"
          done
      - name: AOT bridge acknowledgement measurements
        timeout-minutes: 4
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/bridge-aot-session" -- "$NATIVE_EVIDENCE/bridge-package/bridge" \
            --mode aot --aot-manifest "$NATIVE_EVIDENCE/bridge-package/manifest.json" \
            --host "$GITHUB_WORKSPACE/target/release/bun-native-host" --host-profile release \
            --source "$GITHUB_WORKSPACE" --output "$NATIVE_EVIDENCE/bridge-aot" \
            2>&1 | tee "$NATIVE_EVIDENCE/bridge-aot.log"
      - name: Repeated matched development and AOT release-host baseline
        timeout-minutes: 8
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/baseline-session" -- python3 benchmarks/native-baseline.py \
            --output "$NATIVE_EVIDENCE/baseline" --package "$NATIVE_EVIDENCE/package" \
            --bun "$(command -v bun)" --samples 5 --warmups 1 --idle-seconds 2 \
            2>&1 | tee "$NATIVE_EVIDENCE/baseline.log"
      - name: Solid local-stream workspace development and AOT native flow
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for entry in solid-workspace solid-workspace-flow; do
            bun experiments/aot-gpui/build-window.ts \
              --source "$GITHUB_WORKSPACE" \
              --host "$BUN_NATIVE_HOST" --host-profile release \
              --entry "$entry" --outdir "$NATIVE_EVIDENCE/$entry-package"
          done
          for mode in development aot; do
            command=(bun "$NATIVE_EVIDENCE/solid-workspace-flow-package/development/application.js")
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/solid-workspace-flow-package/solid-workspace-flow")
            fi
            evidence="$NATIVE_EVIDENCE/diagnostics-$mode-solid-workspace"
            xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- python3 scripts/quality/native-diagnostics-linux.py \
              --scenario solid-workspace --mode "$mode" --host-profile release \
              --output "$evidence" -- "${command[@]}"
          done
      - name: Solid workspace long-session ownership in development and AOT
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 6
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          bun experiments/aot-gpui/build-window.ts \
            --source "$GITHUB_WORKSPACE" \
            --host "$BUN_NATIVE_HOST" --host-profile release \
            --entry solid-workspace-soak --outdir "$NATIVE_EVIDENCE/solid-workspace-soak-package"
          for mode in development aot; do
            command=(bun "$NATIVE_EVIDENCE/solid-workspace-soak-package/development/application.js")
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/solid-workspace-soak-package/solid-workspace-soak")
            fi
            evidence="$NATIVE_EVIDENCE/diagnostics-$mode-solid-workspace-soak"
            mkdir "$evidence"
            BUN_NATIVE_DIAGNOSTICS_DIR="$evidence" \
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- timeout 150s "${command[@]}" 2>&1 | tee "$evidence/fixture.log"
            python3 scripts/quality/native-solid-workspace-soak.py "$evidence/soak-result.json"
          done
      - name: Generated Solid and React templates in development and inspected AOT
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          packages="$NATIVE_EVIDENCE/cli-templates"
          python3 tests/native/cli-templates.py prepare \
            --output "$packages" --bun "$(command -v bun)" \
            --host "$GITHUB_WORKSPACE/target/release/bun-native-host"
          template_status=0
          for framework in solid react; do
            for language in typescript javascript; do
              for mode in development aot; do
                template="$framework-$language"
                evidence="$packages/$template/$mode"
                if ! xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
                  dbus-run-session -- bash scripts/quality/native-linux-session.sh \
                  "$evidence-session" -- python3 tests/native/cli-templates.py run \
                  --packages "$packages" --case "$template" --mode "$mode" --output "$evidence"; then
                  template_status=1
                fi
              done
            done
          done
          exit "$template_status"
      - name: Native CLI watch with 101 source-edit remounts per framework
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 14
        run: |
          watch_status=0
          for framework in solid react; do
            evidence="$NATIVE_EVIDENCE/cli-watch-$framework"
            if ! xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- python3 tests/native/cli-watch.py \
              --framework "$framework" --output "$evidence" --bun "$(command -v bun)" \
              --host "$GITHUB_WORKSPACE/target/release/bun-native-host"; then
              watch_status=1
            fi
          done
          exit "$watch_status"
      - name: Prepare four installed external Solid and React consumers
        id: standalone-prepare
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          python3 tests/native/cli-standalone.py prepare \
            --output "$NATIVE_EVIDENCE/cli-standalone" \
            --bun "$(command -v bun)" --cache "$HOME/.bun/install/cache" \
            --host "$GITHUB_WORKSPACE/target/release/bun-native-host" \
            --host-sha256-file "$NATIVE_EVIDENCE/binary-sha256.txt" \
            --source-commit "$(git rev-parse HEAD)" --source-tree "$(git rev-parse 'HEAD^{tree}')"
      - name: Installed external consumers in development and inspected AOT
        if: ${{ !cancelled() && steps.standalone-prepare.outcome == 'success' }}
        timeout-minutes: 6
        run: python3 tests/native/cli-standalone.py run --output "$NATIVE_EVIDENCE/cli-standalone"
      - name: Finalize owned standalone consumer cleanup
        if: ${{ always() && contains(fromJSON('["success","failure","cancelled"]'), steps.standalone-prepare.outcome) }}
        timeout-minutes: 1
        run: python3 tests/native/cli-standalone.py cleanup --output "$NATIVE_EVIDENCE/cli-standalone"
      - name: Shared input viewport pixels through Solid and React in development and AOT
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 4
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for framework in solid react; do
            entry="$framework-input-viewport"
            package="$NATIVE_EVIDENCE/$entry-package"
            bun experiments/aot-gpui/build-window.ts \
              --source "$GITHUB_WORKSPACE" --host "$BUN_NATIVE_HOST" \
              --host-profile release --entry "$entry" --outdir "$package"
            for mode in development aot; do
              command=(bun "$package/development/application.js")
              if [[ "$mode" == aot ]]; then
                command=("$package/$entry")
              fi
              evidence="$NATIVE_EVIDENCE/diagnostics-$mode-$entry"
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
                dbus-run-session -- bash scripts/quality/native-linux-session.sh \
                "$evidence-session" -- python3 scripts/quality/native-diagnostics-linux.py \
                --scenario "$entry" --mode "$mode" --host-profile release \
                --output "$evidence" -- "${command[@]}"
            done
          done
      - name: Retain unsigned native host for reproducibility
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          sha256sum --check "$NATIVE_EVIDENCE/binary-sha256.txt"
          archive="$NATIVE_EVIDENCE/unsigned-native-host.tar.gz"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          bun scripts/native/host-archive.ts --output "$archive" target/release/bun-native-host
          # Repack a copy from another directory with a different mtime: the
          # archive must depend only on the executable bytes and the commit time.
          copy="$RUNNER_TEMP/host-archive-repack"
          mkdir "$copy"
          cp target/release/bun-native-host "$copy/"
          touch -d '2001-02-03 04:05:06' "$copy/bun-native-host"
          bun scripts/native/host-archive.ts --output "$copy/repacked.tar.gz" "$copy/bun-native-host"
          cmp "$archive" "$copy/repacked.tar.gz"
          sha256sum "$archive" > "$archive.sha256"
      - name: Retain native evidence even after failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: native-linux-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/native-evidence/toolchain.txt
            ${{ runner.temp }}/native-evidence/allocation-selection/
            ${{ runner.temp }}/native-evidence/build.log
            ${{ runner.temp }}/native-evidence/binary-*.txt
            ${{ runner.temp }}/native-evidence/unsigned-native-host.tar.gz*
            ${{ runner.temp }}/native-evidence/cli-templates/
            ${{ runner.temp }}/native-evidence/cli-watch-*/
            ${{ runner.temp }}/native-evidence/cli-standalone/
            !${{ runner.temp }}/native-evidence/cli-standalone/owned/**
            !${{ runner.temp }}/native-evidence/cli-standalone/packages/cli/**
            !${{ runner.temp }}/native-evidence/cli-standalone/packages/staging/**
            !${{ runner.temp }}/native-evidence/cli-templates/*/package/application
            !${{ runner.temp }}/native-evidence/cli-templates/*/package/bun-native-host
            ${{ runner.temp }}/native-evidence/clipboard-peer-*.txt
            ${{ runner.temp }}/native-evidence/shortcut-peer-sha256.txt
            ${{ runner.temp }}/native-evidence/global-shortcuts-*/
            ${{ runner.temp }}/native-evidence/notifications-*/
            ${{ runner.temp }}/native-evidence/filesystem-grants-*/
            ${{ runner.temp }}/native-evidence/development/
            ${{ runner.temp }}/native-evidence/aot/
            ${{ runner.temp }}/native-evidence/input-race-aot/
            ${{ runner.temp }}/native-evidence/javascript-development/
            ${{ runner.temp }}/native-evidence/javascript-aot/
            ${{ runner.temp }}/native-evidence/lifecycle-development/
            ${{ runner.temp }}/native-evidence/lifecycle-aot/
            ${{ runner.temp }}/native-evidence/events-development/
            ${{ runner.temp }}/native-evidence/events-aot/
            ${{ runner.temp }}/native-evidence/solid-development-*/
            ${{ runner.temp }}/native-evidence/solid-aot-*/
            ${{ runner.temp }}/native-evidence/solid*-package/development/
            ${{ runner.temp }}/native-evidence/react-development-*/
            ${{ runner.temp }}/native-evidence/react-aot-*/
            ${{ runner.temp }}/native-evidence/react-workload/
            ${{ runner.temp }}/native-evidence/react*-package/development/
            ${{ runner.temp }}/native-evidence/desktop-services-*/
            ${{ runner.temp }}/native-evidence/diagnostics-*/
            ${{ runner.temp }}/native-evidence/allocations-*/
            ${{ runner.temp }}/native-evidence/bridge-development/
            ${{ runner.temp }}/native-evidence/bridge-aot/
            ${{ runner.temp }}/native-evidence/bridge-*-session/*.log
            ${{ runner.temp }}/native-evidence/bridge-*.log
            ${{ runner.temp }}/native-evidence/baseline/
            ${{ runner.temp }}/native-evidence/baseline-session/*.log
            ${{ runner.temp }}/native-evidence/baseline.log
            ${{ runner.temp }}/native-evidence/package/manifest.json
            ${{ runner.temp }}/native-evidence/package/*.log
            ${{ runner.temp }}/native-evidence/*-package/manifest.json
            ${{ runner.temp }}/native-evidence/*-package/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: State verified scope
        run: |
          {
            echo 'One release GPUI host artifact passed the BN1 native suite through both development Bun and inspected machine-code AOT entries.'
            echo 'Required checks include public API and checked-JavaScript pointer/text input, Enter activation, native stale-input rejection, and 1,000 public listener/subtree lifecycle cycles followed by OS-close cancellation.'
            echo 'The event-throughput fixture requires 1,000 OS-delivered text edits with contiguous event/input revisions and matching final native paint; its observation intervals do not establish input-to-presentation latency.'
            echo 'Startup rollback, an ownership-checked native child crash, final native child reordering, and input delivered during a sustained bounded command stream run in development and inspected AOT. A serial control records the same input observation without the command flood.'
            echo 'The native input checks use isolated X11, XTest and verified Mesa software rendering. Exact paint trees, screenshots, source/artifact hashes and cleanup reports are retained.'
            echo 'All four unchanged CLI templates (Solid/React × TypeScript/JavaScript) are created, checked and compiled by the checkout CLI, then run from an unrelated working directory in development and inspected AOT. Each requires native pointer down/up, the complete counter paint changing from zero to one, native OS close, exactly one ready/zero-resource stopped IPC pair, and joined app/host cleanup. This is one bounded interaction per variant and mode, not native reload-cycle or independent-installation qualification.'
            echo 'The exact CLI dev --watch command performs an initial native launch and 101 source-edit remounts for each Solid/React TypeScript template. Every generation requires a unique source label, a complete reset counter paint, real XTest click/down/up and counter-one paint, validated zero-resource previous teardown, immutable app/host process identities and no observed overlap. A rejected syntax edit preserves a responsive working app; final OS close must exit watch with zero resources and remove its owned temporary root. A PATH sentinel and unchanged host/compiler hashes guard ordinary edits against native rebuilds. Edit-to-ready/paint/input-confirmed-paint intervals are instrumented observations, not presentation or cross-framework performance claims.'
            echo 'The Linux clipboard service uses an independent owned X11 peer in development and inspected AOT. Required outcomes cover immutable grants, ordinary/delayed/INCR text, payload and metadata rejection, owner loss, bounded stalled transfers with responsive input/commits, cancellation, idle worker sleep, selection persistence and joined cleanup. This does not qualify clipboard support on Wayland, macOS or Windows.'
            echo 'Linux X11 global shortcuts run in development and inspected AOT: default denial, delivery while another owned window is focused, Num Lock independence, real conflicts with an independent X11 client, and verified OS grab release after unregistration, owner close and shutdown. This does not qualify global shortcuts on Wayland, macOS or Windows.'
            echo 'Linux freedesktop notifications run against the real dunst server on an isolated D-Bus session in development and inspected AOT: default denial, an isolated bus without a server reported as unavailable, posting, server-action activation, user dismissal, forged signals from an independent bus client ignored, and server-side withdrawal on request, owner close and shutdown. This does not qualify notifications on macOS or Windows, or with other notification servers.'
            echo 'Linux filesystem grants run in development and inspected AOT on a private temporary tree checked independently with node:fs: default denial, unknown roots and access above the launch grant refused, read grants refusing writes, actual create/append/truncate/binary effects, directory pages and removal, symbolic links never followed inside or out of the grant, traversal rejected before the wire, a sibling directory left untouched, and native rejection of foreign, stale and reused grant handles. Close, owner close and shutdown revoke grants and withhold in-flight results. This does not qualify filesystem grants on macOS or Windows.'
            echo 'Solid runs the exact source-fingerprinted generated module in development and through inspected Bun AOT against the same release GPUI host. Twelve scenarios require keyed identity, every native edit, delayed revision-aware replacement, shared keyboard/pointer/focus phases, caret and selection behavior, complete native paint, OS close and owner cleanup. These correctness cases do not close the separate retained-object investigation or establish matched framework performance.'
            echo 'Bridge acknowledgement timings run with instrumentation disabled; they are not display-presentation timings. The startup/RSS baseline retains one warm-up and five measured fresh-process trials per mode, alternating order, with a two-second idle interval and uncontrolled OS caches.'
            echo 'Separate Heaptrack runs profile only the real native host during the 1,000-cycle lifecycle in both modes. Full compressed allocation traces, tool/host/source hashes and bounded callsite reports are retained; profiler timing/RSS is not mixed into the baseline, and outstanding-at-exit allocations are not automatically leaks.'
            echo 'These bounded runs do not establish long-term leak freedom, physical input, hardware GPU performance or macOS/Windows native GUI support.'
            echo 'All four React entries run the same source-fingerprinted generated module in development and as the input to inspected Bun AOT against that release host. The counter requires a stable active callback through rerender, one property Set/one keyed move/one deletion, complete native input revisions, final native paint, effect/ref cleanup and clean OS close.'
            echo 'React also consumes the shared capture/target/bubble event mapping. Development and AOT scenarios require real pointer/focus/keyboard events, Enter activation despite JavaScript propagation stops, caret insertion and selection replacement without native input echo, and revocation of every observed callback signal after OS close.'
            echo 'Eight React behavior scenarios in each mode require real native mount/update/unmount, state/reducer batching, effect/ref lifetime, boundary fallback/recovery, transient concurrent retry, terminal reporter and cleanup failures, and an independently usable survivor root. The non-suspending transition case waits for an explicit React commit and native acknowledgement; ordinary flush does not promise to drain every transition lane.'
            echo 'The React diagnostic requires 1,000 individual state updates, 1,000 values coalesced into 100 native updates, 1,000 keyed rotations, and 1,000 mount/update/dispose cycles in each mode. Fixed WeakRef checkpoints, row-owner counts and public resource counts guard bounded cleanup. Separate native-paint calibration observes the complete expected tree and actual GPU; recorded acknowledgement timings are single-run diagnostics, not a cross-framework performance claim.'
          } >> "$GITHUB_STEP_SUMMARY"
