                  "$evidence-session" -- "${command[@]}" 2>&1 | tee "$evidence/run.log"
                reports+=("$evidence"/layout-style-*.json)
              done
            done
          done
          # Every adapter, mode and scale must commit one element tree and
          # paint it at the same logical geometry.
          mkdir "$NATIVE_EVIDENCE/diagnostics-layout-style-comparison"
          bun tests/native/layout-style-compare.ts "${reports[@]}" |
            tee "$NATIVE_EVIDENCE/diagnostics-layout-style-comparison/report.json"
      - name: Retain unsigned native host for reproducibility
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          sha256sum --check "$NATIVE_EVIDENCE/binary-sha256.txt"
          archive="$NATIVE_EVIDENCE/unsigned-native-host.tar.gz"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          bun scripts/native/host-archive.ts --output "$archive" target/release/bun-native-host
          # Repack a copy from another directory with a different mtime: the
          # archive must depend only on the executable bytes and the commit time.
          copy="$RUNNER_TEMP/host-archive-repack"
          mkdir "$copy"
          cp target/release/bun-native-host "$copy/"
          touch -d '2001-02-03 04:05:06' "$copy/bun-native-host"
          bun scripts/native/host-archive.ts --output "$copy/repacked.tar.gz" "$copy/bun-native-host"
          cmp "$archive" "$copy/repacked.tar.gz"
          sha256sum "$archive" > "$archive.sha256"
      - name: Retain native evidence even after failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
