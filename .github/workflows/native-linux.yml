name: Native Linux

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: GPUI release, native contracts and baselines
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: 0
      BUN_NATIVE_HOST_PROFILE: release
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare evidence directory
        run: |
          mkdir "$RUNNER_TEMP/native-evidence"
          echo "NATIVE_EVIDENCE=$RUNNER_TEMP/native-evidence" >> "$GITHUB_ENV"
      - name: Install checksum-pinned Bun compiler
        run: node scripts/install-bun.mjs --destination "$RUNNER_TEMP/bun-native-bun"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      # The package set is unchanged. The one apt-get update below resolves exact
      # versions; their index SHA256 hashes key a cache of the archive bytes, so a
      # throttled mirror (47 MB at 37.9 kB/s took 20m42s in job 127546794220) is
      # only paid when the resolved set changes. Cached bytes are rechecked against
      # the index hashes before apt may use them.
      - name: Resolve exact native build and isolated X11 prerequisite archives
        id: apt-archives
        run: |
          packages=(
            pkg-config libfontconfig-dev libglib2.0-dev libssl-dev libwayland-dev
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libzstd-dev
            mesa-vulkan-drivers xvfb xauth x11-utils x11-xserver-utils openbox xdotool imagemagick
            dbus-x11 dunst xdg-desktop-portal xdg-desktop-portal-gtk libglib2.0-bin
            fonts-dejavu-core heaptrack binutils
            x11-xkb-utils xclip at-spi2-core gir1.2-atspi-2.0 python3-gi
          )
          printf '%s\n' "${packages[@]}" > "$RUNNER_TEMP/native-apt-packages"
          # Outside the runner home so apt's sandboxed _apt user can download into it.
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 /var/cache/native-apt-archives
          sudo apt-get update
          apt-get install --print-uris -qq --no-install-recommends -y \
            -o Acquire::ForceHash=SHA256 "${packages[@]}" > "$RUNNER_TEMP/native-apt-uris"
          lock="$RUNNER_TEMP/native-apt-archives.lock"
          : > "$lock"
          while IFS= read -r line; do
            pattern="^'[^']+' ([^ /]+\.deb) [0-9]+ SHA256:([0-9a-f]{64})$"
            if [[ ! $line =~ $pattern ]]; then
              echo "::error::Unexpected apt archive resolution: $line" >&2
              exit 1
            fi
            printf '%s  %s\n' "${BASH_REMATCH[2]}" "${BASH_REMATCH[1]}" >> "$lock"
          done < "$RUNNER_TEMP/native-apt-uris"
          LC_ALL=C sort -o "$lock" "$lock"
          echo "Resolved $(wc -l < "$lock") prerequisite archives:"
          cat "$lock"
          printf 'key=native-apt-%s-%s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" \
            "$(sha256sum "$lock" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore exact prerequisite archives
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/native-apt-archives
          key: ${{ steps.apt-archives.outputs.key }}
      - name: Install native build and isolated X11 prerequisites
        run: |
          mapfile -t packages < "$RUNNER_TEMP/native-apt-packages"
          lock="$RUNNER_TEMP/native-apt-archives.lock"
          cached=/var/cache/native-apt-archives
          mkdir -p "$cached"
          reused=0
          while read -r hash name; do
            [[ -f $cached/$name ]] || continue
            if [[ $(sha256sum "$cached/$name" | cut -d' ' -f1) == "$hash" ]]; then
              reused=$((reused + 1))
            else
              rm -f "$cached/$name"
            fi
          done < "$lock"
          echo "Reusing $reused of $(wc -l < "$lock") archives verified against the index"
          sudo install -d -o _apt -m 0700 "$cached/partial"
          # Manual-page index rebuilds are not used by any later step.
          sudo rm -f /var/lib/man-db/auto-update
          # apt downloads (and verifies) only the archives still missing.
          sudo apt-get install --no-install-recommends -y \
            -o Dir::Cache::Archives="$cached/" -o APT::Keep-Downloaded-Packages=true \
            "${packages[@]}"
          sudo rm -rf "$cached/partial" "$cached/lock"
          (cd "$cached" && sha256sum --check --strict --quiet "$lock")
      - name: Save exact prerequisite archives
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/native-apt-archives
          key: ${{ steps.apt-archives.outputs.key }}
      - name: Pin the installed Mesa CPU Vulkan ICD for isolated Xvfb
        run: |
          echo 'Installed Mesa Vulkan ICD files:'
          dpkg-query -L mesa-vulkan-drivers | grep -E '(/icd.d/|libvulkan_lvp)' || true
          mapfile -t manifests < <(dpkg-query -L mesa-vulkan-drivers | grep -E '/lvp_icd[^/]*\.json$' || true)
          if (( ${#manifests[@]} != 1 )); then
            echo "::error::Expected exactly one Mesa Lavapipe ICD, found ${#manifests[@]}" >&2
            exit 1
          fi
          manifest=${manifests[0]}
          test -r "$manifest"
          dpkg-query -S "$manifest"
          printf 'VK_DRIVER_FILES=%s\n' "$manifest" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: gpui-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.json', 'bun.lock', 'rust-toolchain.toml', 'Cargo.lock') }}
      - run: bun install --frozen-lockfile
      # Dependency build outputs come from the last protected-main build of the
      # same lockfile and toolchain. Workspace crates still rebuild from this
      # checkout. The scheduled audit restores nothing, keeping a cold build.
      - name: Restore release dependency build outputs
        id: target-cache
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/build
            target/release/deps
            target/release/.fingerprint
          key: native-release-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'native/vendor/**') }}
          # Only pull requests fall back to an older key; main rebuilds cold
          # after a lockfile or toolchain change, so stale outputs never pile up.
          restore-keys: ${{ github.event_name == 'pull_request' && format('native-release-target-{0}-{1}-', runner.os, runner.arch) || '' }}
      - name: Record build environment
        run: |
          {
            git rev-parse HEAD
            uname -a
            bun --revision
            rustc --version --verbose
            cargo --version
            cc --version
            dpkg-query -W libvulkan1 mesa-vulkan-drivers libwayland-client0 libxkbcommon0 xvfb openbox xdotool imagemagick dunst xdg-desktop-portal xdg-desktop-portal-gtk heaptrack libheaptrack binutils
            printf 'Vulkan ICD: %s\n' "${VK_DRIVER_FILES:?}"
            sha256sum "$VK_DRIVER_FILES"
            printf 'Application modes: Bun development and verified machine-code AOT\nNative host profile: release\nDisplay: isolated Xvfb X11\nInput: XTest\nRenderer request: Mesa software Vulkan/GL; actual adapter in result.json\n'
          } > "$NATIVE_EVIDENCE/toolchain.txt"
      - name: Keep the runner's Cargo home path out of native binaries
        # Dependency sources live under CARGO_HOME, and their panic locations are
        # otherwise embedded verbatim, so equal sources built under another home
        # differ. See docs/reproducible-builds.md.
        run: printf 'CARGO_ENCODED_RUSTFLAGS=--remap-path-prefix=%s=/cargo\n' "${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
      - name: Check native source formatting
        run: cargo fmt --manifest-path Cargo.toml --all -- --check
      - name: Build native executable
        id: native-build
        run: |
          { time -p cargo build --locked --release --manifest-path Cargo.toml -p bun-native-host --bin bun-native-host --example clipboard-peer --example shortcut-peer --example xdnd-source; } 2>&1 | tee "$NATIVE_EVIDENCE/build.log"
          echo "${{ steps.target-cache.outputs.cache-matched-key || 'none' }}" > "$NATIVE_EVIDENCE/target-cache-key.txt"
          sha256sum target/release/bun-native-host > "$NATIVE_EVIDENCE/binary-sha256.txt"
          stat --format='%s bytes' target/release/bun-native-host > "$NATIVE_EVIDENCE/binary-size.txt"
          sha256sum target/release/examples/clipboard-peer > "$NATIVE_EVIDENCE/clipboard-peer-sha256.txt"
          stat --format='%s bytes' target/release/examples/clipboard-peer > "$NATIVE_EVIDENCE/clipboard-peer-size.txt"
          sha256sum target/release/examples/shortcut-peer > "$NATIVE_EVIDENCE/shortcut-peer-sha256.txt"
          sha256sum target/release/examples/xdnd-source > "$NATIVE_EVIDENCE/xdnd-source-sha256.txt"
      - name: Lint and test actual native host
        run: |
          cargo clippy --locked --release --manifest-path Cargo.toml -p bun-native-host --all-targets -- -D warnings
          cargo test --locked --release --manifest-path Cargo.toml -p bun-native-host
      - name: Save release dependency build outputs from protected main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/build
            target/release/deps
            target/release/.fingerprint
          key: native-release-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'native/vendor/**') }}
      - name: Qualify fixed allocation regions with the actual Rust and Heaptrack ABI
        timeout-minutes: 3
        run: |
          python3 benchmarks/native-allocation-control.py \
            --output "$NATIVE_EVIDENCE/allocation-selection"
      # The first GPUI open loads Lavapipe and LLVM (~240 MB) from a cold
      # runner disk inside its 5 s request (#296). Read them once here and
      # record residency and read time; the request deadline is unchanged.
      - name: Read the software GPU driver into the page cache
        timeout-minutes: 2
        run: python3 scripts/quality/warm-gpu-driver.py --output "$NATIVE_EVIDENCE/gpu-driver-warmup.json"
      - name: Development public API input, stale revision and window lifecycle
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
          BUN_NATIVE_STARTUP_LOG: '1'
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/development" development bun examples/native-window/main.ts
      - name: Development checked-JavaScript consumer input
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/javascript-development" javascript bun tests/native/javascript.js
      - name: Development public listener and subtree lifecycle
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/lifecycle-development" core-lifecycle bun tests/native/public-lifecycle.ts
      - name: Development native input event throughput
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/events-development" event-throughput bun tests/native/event-throughput.ts
      - name: Compile and inspect the actual AOT entries
        run: |
          for entry in native-window input-race bridge javascript core-lifecycle event-throughput fault scheduling layout interactions services display-semantics clipboard global-shortcuts notifications overlays popups filesystem-grants text-input processes file-dialogs drag-drop solid-drag-drop react-drag-drop solid-services react-services solid solid-input-intent solid-interactions react react-interactions react-behavior react-workload react-workspace react-workspace-flow; do
            outdir="$NATIVE_EVIDENCE/$entry-package"
            if [[ "$entry" == native-window ]]; then
              outdir="$NATIVE_EVIDENCE/package"
            fi
            bun experiments/aot-gpui/build-window.ts \
              --source "$GITHUB_WORKSPACE" \
              --host "$GITHUB_WORKSPACE/target/release/bun-native-host" \
              --entry "$entry" --host-profile release --outdir "$outdir"
          done
      - name: Development and AOT bounded X11 clipboard service
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
          BUN_NATIVE_CLIPBOARD_PEER: ${{ github.workspace }}/target/release/examples/clipboard-peer
        run: |
          for mode in development aot; do
            command=(bun tests/native/clipboard.ts)
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/clipboard-package/clipboard")
            fi
            evidence="$NATIVE_EVIDENCE/diagnostics-$mode-clipboard"
            xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- python3 scripts/quality/native-diagnostics-linux.py \
              --output "$evidence" --scenario clipboard --mode "$mode" \
              --host-profile release -- "${command[@]}"
          done
      - name: Development and AOT X11 global shortcuts
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
          BUN_NATIVE_SHORTCUT_PEER: ${{ github.workspace }}/target/release/examples/shortcut-peer
        run: |
          for mode in development aot; do
            command=(bun tests/native/global-shortcuts.ts)
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/global-shortcuts-package/global-shortcuts")
            fi
            evidence="$NATIVE_EVIDENCE/global-shortcuts-$mode"
            mkdir "$evidence"
            BUN_NATIVE_SHORTCUT_EVIDENCE="$evidence" BUN_NATIVE_SHORTCUT_MODE="$mode" \
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- "${command[@]}" 2>&1 | tee "$evidence/run.log"
          done
      - name: Development and AOT X11 text, focus, Unicode, composition, AT-SPI and scaling
        timeout-minutes: 5
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
          # The system Python carries PyGObject and the Atspi typelib.
          BUN_NATIVE_ATSPI_PYTHON: /usr/bin/python3
        run: |
          for mode in development aot; do
            for scale in 1 2; do
              command=(bun tests/native/text-input.ts)
              if [[ "$mode" == aot ]]; then
                command=("$NATIVE_EVIDENCE/text-input-package/text-input")
              fi
              evidence="$NATIVE_EVIDENCE/text-input-$mode-scale-$scale"
              mkdir "$evidence"
              # The session pins scale 1; pass the host environment explicitly after it.
              BUN_NATIVE_TEXT_EVIDENCE="$evidence" BUN_NATIVE_TEXT_MODE="$mode" \
                xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24 -nolisten tcp' \
                dbus-run-session -- bash scripts/quality/native-linux-session.sh \
                "$evidence-session" -- env GPUI_X11_SCALE_FACTOR="$scale" LC_CTYPE=C.UTF-8 \
                "${command[@]}" 2>&1 | tee "$evidence/run.log"
              test -s "$evidence/result.json"
            done
          done
      - name: Development and AOT freedesktop notifications
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for mode in development aot; do
            command=(bun tests/native/notifications.ts)
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/notifications-package/notifications")
            fi
            evidence="$NATIVE_EVIDENCE/notifications-$mode"
            mkdir "$evidence"
            BUN_NATIVE_NOTIFICATION_EVIDENCE="$evidence" BUN_NATIVE_NOTIFICATION_MODE="$mode" \
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- "${command[@]}" 2>&1 | tee "$evidence/run.log"
          done
      - name: Development and AOT X11 display snapshot semantics
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          # Two independent X screens of different sizes; the fixture's oracle
          # is xdpyinfo/xwininfo and its operations are real X requests.
          for mode in development aot; do
            command=(bun tests/native/display-semantics.ts)
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/display-semantics-package/display-semantics")
            fi
            evidence="$NATIVE_EVIDENCE/display-semantics-$mode"
            mkdir "$evidence"
            BUN_NATIVE_DISPLAY_EVIDENCE="$evidence" BUN_NATIVE_DISPLAY_MODE="$mode" \
              xvfb-run --auto-servernum \
              --server-args='-screen 0 1280x800x24 -screen 1 1024x768x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- "${command[@]}" 2>&1 | tee "$evidence/run.log"
          done
      - name: Development and AOT filesystem grants
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for mode in development aot; do
            command=(bun tests/native/filesystem-grants.ts)
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/filesystem-grants-package/filesystem-grants")
            fi
            evidence="$NATIVE_EVIDENCE/filesystem-grants-$mode"
            mkdir "$evidence"
            BUN_NATIVE_FILESYSTEM_EVIDENCE="$evidence" BUN_NATIVE_FILESYSTEM_MODE="$mode" \
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- "${command[@]}" 2>&1 | tee "$evidence/run.log"
          done
      - name: Development and AOT owned processes
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for mode in development aot; do
            command=(bun tests/native/processes.ts)
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/processes-package/processes")
            fi
            evidence="$NATIVE_EVIDENCE/processes-$mode"
            mkdir "$evidence"
            BUN_NATIVE_PROCESS_EVIDENCE="$evidence" BUN_NATIVE_PROCESS_MODE="$mode" \
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- "${command[@]}" 2>&1 | tee "$evidence/run.log"
          done
      - name: Development and AOT OS file dialogs through xdg-desktop-portal
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for mode in development aot; do
            command=(bun tests/native/file-dialogs.ts)
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/file-dialogs-package/file-dialogs")
            fi
            evidence="$NATIVE_EVIDENCE/file-dialogs-$mode"
            mkdir "$evidence"
            BUN_NATIVE_DIALOG_EVIDENCE="$evidence" BUN_NATIVE_DIALOG_MODE="$mode" \
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- "${command[@]}" 2>&1 | tee "$evidence/run.log"
          done
      - name: Development and AOT overlays, modal focus, keyboard menus and scrolling
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for mode in development aot; do
            command=(bun tests/native/overlays.ts)
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/overlays-package/overlays")
            fi
            evidence="$NATIVE_EVIDENCE/overlays-$mode"
            mkdir "$evidence"
            BUN_NATIVE_OVERLAY_EVIDENCE="$evidence" BUN_NATIVE_OVERLAY_MODE="$mode" \
              BUN_NATIVE_EVIDENCE_LOG="$evidence/native-evidence.jsonl" \
              BUN_NATIVE_EVIDENCE_NONCE="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- "${command[@]}" 2>&1 | tee "$evidence/run.log"
          done
      - name: Development and AOT popup windows beyond the parent window
        timeout-minutes: 3
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for mode in development aot; do
            command=(bun tests/native/popups.ts)
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/popups-package/popups")
            fi
            evidence="$NATIVE_EVIDENCE/popups-$mode"
            mkdir "$evidence"
            BUN_NATIVE_POPUP_EVIDENCE="$evidence" BUN_NATIVE_POPUP_MODE="$mode" \
              BUN_NATIVE_EVIDENCE_LOG="$evidence/native-evidence.jsonl" \
              BUN_NATIVE_EVIDENCE_NONCE="$(python3 -c 'import secrets; print(secrets.token_hex(16))')" \
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "$evidence-session" -- "${command[@]}" 2>&1 | tee "$evidence/run.log"
          done
      - name: Development and AOT X11 drag and drop through core, Solid and React
        timeout-minutes: 6
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
          BUN_NATIVE_DRAG_SOURCE: ${{ github.workspace }}/target/release/examples/xdnd-source
        run: |
          for entry in drag-drop solid-drag-drop react-drag-drop; do
            for mode in development aot; do
              command=(bun "$NATIVE_EVIDENCE/$entry-package/development/application.js")
              if [[ "$entry" == drag-drop ]]; then
                command=(bun tests/native/drag-drop.ts)
              fi
              if [[ "$mode" == aot ]]; then
                command=("$NATIVE_EVIDENCE/$entry-package/$entry")
              fi
              evidence="$NATIVE_EVIDENCE/$entry-$mode"
              mkdir "$evidence"
              BUN_NATIVE_DRAG_DROP_EVIDENCE="$evidence" BUN_NATIVE_DRAG_DROP_MODE="$mode" \
                xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
                dbus-run-session -- bash scripts/quality/native-linux-session.sh \
                "$evidence-session" -- "${command[@]}" 2>&1 | tee "$evidence/run.log"
            done
          done
      - name: Development and AOT native display service through core, Solid and React
        timeout-minutes: 5
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for entry in services solid-services react-services; do
            package="$NATIVE_EVIDENCE/$entry-package"
