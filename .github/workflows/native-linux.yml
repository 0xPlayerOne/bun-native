name: Native Linux

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: GPUI release, native contracts and baselines
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      BUN_NATIVE_HOST_PROFILE: release
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare evidence directory
        run: |
          mkdir "$RUNNER_TEMP/native-evidence"
          echo "NATIVE_EVIDENCE=$RUNNER_TEMP/native-evidence" >> "$GITHUB_ENV"
      - name: Install checksum-pinned Bun compiler
        env:
          BUN_NATIVE_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/install-bun.mjs --destination "$RUNNER_TEMP/bun-native-bun"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install native build and isolated X11 prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libfontconfig-dev libglib2.0-dev libssl-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libzstd-dev \
            mesa-vulkan-drivers xvfb xauth x11-utils openbox xdotool imagemagick \
            dbus-x11 fonts-dejavu-core heaptrack binutils
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: gpui-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.json', 'bun.lock', 'rust-toolchain.toml', 'Cargo.lock') }}
      - run: bun install --frozen-lockfile
      - name: Record build environment
        run: |
          {
            git rev-parse HEAD
            uname -a
            bun --revision
            rustc --version --verbose
            cargo --version
            cc --version
            dpkg-query -W libvulkan1 mesa-vulkan-drivers libwayland-client0 libxkbcommon0 xvfb openbox xdotool imagemagick heaptrack libheaptrack binutils
            printf 'Application modes: Bun development and verified machine-code AOT\nNative host profile: release\nDisplay: isolated Xvfb X11\nInput: XTest\nRenderer request: Mesa software Vulkan/GL; actual adapter in result.json\n'
          } > "$NATIVE_EVIDENCE/toolchain.txt"
      - name: Check native source formatting
        run: cargo fmt --manifest-path Cargo.toml --all -- --check
      - name: Build native executable
        run: |
          { time -p cargo build --locked --release --manifest-path Cargo.toml -p bun-native-host; } 2>&1 | tee "$NATIVE_EVIDENCE/build.log"
          sha256sum target/release/bun-native-host > "$NATIVE_EVIDENCE/binary-sha256.txt"
          stat --format='%s bytes' target/release/bun-native-host > "$NATIVE_EVIDENCE/binary-size.txt"
      - name: Lint and test actual native host
        run: |
          cargo clippy --locked --release --manifest-path Cargo.toml -p bun-native-host --all-targets -- -D warnings
          cargo test --locked --release --manifest-path Cargo.toml -p bun-native-host
      - name: Development public API input, stale revision and window lifecycle
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/development" development bun examples/native-window/main.ts
      - name: Development checked-JavaScript consumer input
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/javascript-development" javascript bun tests/native/javascript.js
      - name: Development public listener and subtree lifecycle
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/lifecycle-development" core-lifecycle bun tests/native/public-lifecycle.ts
      - name: Development native input event throughput
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/events-development" event-throughput bun tests/native/event-throughput.ts
      - name: Compile and inspect the ten actual AOT entries
        run: |
          for entry in native-window input-race bridge javascript core-lifecycle event-throughput fault scheduling layout interactions; do
            outdir="$NATIVE_EVIDENCE/$entry-package"
            if [[ "$entry" == native-window ]]; then
              outdir="$NATIVE_EVIDENCE/package"
            fi
            bun experiments/aot-gpui/build-window.ts \
              --source "$GITHUB_WORKSPACE" \
              --host "$GITHUB_WORKSPACE/target/release/bun-native-host" \
              --entry "$entry" --host-profile release --outdir "$outdir"
          done
      - name: AOT public API pointer, text, keyboard, paint and close
        env:
          BUN_NATIVE_HOST: ${{ runner.temp }}/native-evidence/package/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/aot" aot "$NATIVE_EVIDENCE/package/native-window"
      - name: AOT stale native input rejection
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/input-race-aot" aot-input-race "$NATIVE_EVIDENCE/input-race-package/input-race"
      - name: AOT checked-JavaScript consumer input
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/javascript-aot" aot-javascript "$NATIVE_EVIDENCE/javascript-package/javascript"
      - name: AOT public listener and subtree lifecycle
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/lifecycle-aot" aot-core-lifecycle "$NATIVE_EVIDENCE/core-lifecycle-package/core-lifecycle"
      - name: AOT native input event throughput
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/events-aot" aot-event-throughput "$NATIVE_EVIDENCE/event-throughput-package/event-throughput"
      - name: Development and AOT native failure, scheduling, layout and interaction contracts
        timeout-minutes: 4
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          for mode in development aot; do
            for scenario in startup-failure host-crash scheduling scheduling-control layout interactions; do
              case "$scenario" in
                startup-failure|host-crash) fixture=fault ;;
                scheduling|scheduling-control) fixture=scheduling ;;
                layout) fixture=layout ;;
                interactions) fixture=interactions ;;
              esac
              command=(bun "tests/native/$fixture.ts")
              if [[ "$mode" == aot ]]; then
                command=("$NATIVE_EVIDENCE/$fixture-package/$fixture")
              fi
              evidence="$NATIVE_EVIDENCE/diagnostics-$mode-$scenario"
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
                dbus-run-session -- bash scripts/quality/native-linux-session.sh \
                "$evidence-session" -- python3 scripts/quality/native-diagnostics-linux.py \
                --output "$evidence" --scenario "$scenario" --mode "$mode" \
                --host-profile release -- "${command[@]}"
            done
          done
      - name: Development bridge acknowledgement measurements
        timeout-minutes: 4
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/bridge-development-session" -- bun benchmarks/bridge.ts \
            --mode development --host "$GITHUB_WORKSPACE/target/release/bun-native-host" \
            --host-profile release --source "$GITHUB_WORKSPACE" \
            --output "$NATIVE_EVIDENCE/bridge-development" 2>&1 | tee "$NATIVE_EVIDENCE/bridge-development.log"
      - name: Profile native allocations during development and AOT lifecycle
        timeout-minutes: 5
        run: |
          for mode in development aot; do
            command=(bun tests/native/public-lifecycle.ts)
            if [[ "$mode" == aot ]]; then
              command=("$NATIVE_EVIDENCE/core-lifecycle-package/core-lifecycle")
            fi
            evidence="$NATIVE_EVIDENCE/allocations-$mode"
            xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash scripts/quality/native-linux-session.sh \
              "${evidence}-session" -- python3 scripts/quality/native-allocation-linux.py \
              --output "$evidence" --host "$GITHUB_WORKSPACE/target/release/bun-native-host" \
              --host-profile release --mode "$mode" -- "${command[@]}"
          done
      - name: AOT bridge acknowledgement measurements
        timeout-minutes: 4
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/bridge-aot-session" -- "$NATIVE_EVIDENCE/bridge-package/bridge" \
            --mode aot --aot-manifest "$NATIVE_EVIDENCE/bridge-package/manifest.json" \
            --host "$GITHUB_WORKSPACE/target/release/bun-native-host" --host-profile release \
            --source "$GITHUB_WORKSPACE" --output "$NATIVE_EVIDENCE/bridge-aot" \
            2>&1 | tee "$NATIVE_EVIDENCE/bridge-aot.log"
      - name: Repeated matched development and AOT release-host baseline
        timeout-minutes: 8
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            dbus-run-session -- bash scripts/quality/native-linux-session.sh \
            "$NATIVE_EVIDENCE/baseline-session" -- python3 benchmarks/native-baseline.py \
            --output "$NATIVE_EVIDENCE/baseline" --package "$NATIVE_EVIDENCE/package" \
            --bun "$(command -v bun)" --samples 5 --warmups 1 --idle-seconds 2 \
            2>&1 | tee "$NATIVE_EVIDENCE/baseline.log"
      - name: Retain native evidence even after failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: native-linux-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/native-evidence/toolchain.txt
            ${{ runner.temp }}/native-evidence/build.log
            ${{ runner.temp }}/native-evidence/binary-*.txt
            ${{ runner.temp }}/native-evidence/development/
            ${{ runner.temp }}/native-evidence/aot/
            ${{ runner.temp }}/native-evidence/input-race-aot/
            ${{ runner.temp }}/native-evidence/javascript-development/
            ${{ runner.temp }}/native-evidence/javascript-aot/
            ${{ runner.temp }}/native-evidence/lifecycle-development/
            ${{ runner.temp }}/native-evidence/lifecycle-aot/
            ${{ runner.temp }}/native-evidence/events-development/
            ${{ runner.temp }}/native-evidence/events-aot/
            ${{ runner.temp }}/native-evidence/diagnostics-*/
            ${{ runner.temp }}/native-evidence/allocations-*/
            ${{ runner.temp }}/native-evidence/bridge-development/
            ${{ runner.temp }}/native-evidence/bridge-aot/
            ${{ runner.temp }}/native-evidence/bridge-*-session/*.log
            ${{ runner.temp }}/native-evidence/bridge-*.log
            ${{ runner.temp }}/native-evidence/baseline/
            ${{ runner.temp }}/native-evidence/baseline-session/*.log
            ${{ runner.temp }}/native-evidence/baseline.log
            ${{ runner.temp }}/native-evidence/package/manifest.json
            ${{ runner.temp }}/native-evidence/package/*.log
            ${{ runner.temp }}/native-evidence/*-package/manifest.json
            ${{ runner.temp }}/native-evidence/*-package/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: State verified scope
        run: |
          {
            echo 'One release GPUI host artifact passed the BN1 native suite through both development Bun and inspected machine-code AOT entries.'
            echo 'Required checks include public API and checked-JavaScript pointer/text input, Enter activation, native stale-input rejection, and 1,000 public listener/subtree lifecycle cycles followed by OS-close cancellation.'
            echo 'The event-throughput fixture requires 1,000 OS-delivered text edits with contiguous event/input revisions and matching final native paint; its observation intervals do not establish input-to-presentation latency.'
            echo 'Startup rollback, an ownership-checked native child crash, final native child reordering, and input delivered during a sustained bounded command stream run in development and inspected AOT. A serial control records the same input observation without the command flood.'
            echo 'The native input checks use isolated X11, XTest and verified Mesa software rendering. Exact paint trees, screenshots, source/artifact hashes and cleanup reports are retained.'
            echo 'Bridge acknowledgement timings run with instrumentation disabled; they are not display-presentation timings. The startup/RSS baseline retains one warm-up and five measured fresh-process trials per mode, alternating order, with a two-second idle interval and uncontrolled OS caches.'
            echo 'Separate Heaptrack runs profile only the real native host during the 1,000-cycle lifecycle in both modes. Full compressed allocation traces, tool/host/source hashes and bounded callsite reports are retained; profiler timing/RSS is not mixed into the baseline, and outstanding-at-exit allocations are not automatically leaks.'
            echo 'These bounded runs do not establish long-term leak freedom, physical input, hardware GPU performance or macOS/Windows native GUI support.'
          } >> "$GITHUB_STEP_SUMMARY"
