      - name: State verified scope
        run: |
          {
            echo 'One release GPUI host artifact passed the BN1 native suite through both development Bun and inspected machine-code AOT entries.'
            echo 'Required checks include public API and checked-JavaScript pointer/text input, Enter activation, native stale-input rejection, and 1,000 public listener/subtree lifecycle cycles followed by OS-close cancellation.'
            echo 'The event-throughput fixture requires 1,000 OS-delivered text edits with contiguous event/input revisions and matching final native paint; its observation intervals do not establish input-to-presentation latency.'
            echo 'Startup rollback, an ownership-checked native child crash, final native child reordering, and input delivered during a sustained bounded command stream run in development and inspected AOT. A serial control records the same input observation without the command flood.'
            echo 'The native input checks use isolated X11, XTest and verified Mesa software rendering. Exact paint trees, screenshots, source/artifact hashes and cleanup reports are retained.'
            echo 'All four unchanged CLI templates (Solid/React × TypeScript/JavaScript) are created, checked and compiled by the checkout CLI, then run from an unrelated working directory in development and inspected AOT. Each requires native pointer down/up, the complete counter paint changing from zero to one, native OS close, exactly one ready/zero-resource stopped IPC pair, and joined app/host cleanup. This is one bounded interaction per variant and mode, not native reload-cycle or independent-installation qualification.'
            echo 'The exact CLI dev --watch command performs an initial native launch and 101 source-edit remounts for each Solid/React TypeScript template. Every generation requires a unique source label, a complete reset counter paint, real XTest click/down/up and counter-one paint, validated zero-resource previous teardown, immutable app/host process identities and no observed overlap. A rejected syntax edit preserves a responsive working app; final OS close must exit watch with zero resources and remove its owned temporary root. A PATH sentinel and unchanged host/compiler hashes guard ordinary edits against native rebuilds. Edit-to-ready/paint/input-confirmed-paint intervals are instrumented observations, not presentation or cross-framework performance claims.'
            echo 'The Linux clipboard service uses an independent owned X11 peer in development and inspected AOT. Required outcomes cover immutable grants, ordinary/delayed/INCR text, payload and metadata rejection, owner loss, bounded stalled transfers with responsive input/commits, cancellation, idle worker sleep, selection persistence and joined cleanup. This does not qualify clipboard support on Wayland, macOS or Windows.'
            echo 'Linux X11 global shortcuts run in development and inspected AOT: default denial, delivery while another owned window is focused, Num Lock independence, real conflicts with an independent X11 client, and verified OS grab release after unregistration, owner close and shutdown. This does not qualify global shortcuts on Wayland, macOS or Windows.'
            echo 'Linux freedesktop notifications run against the real dunst server on an isolated D-Bus session in development and inspected AOT: default denial, an isolated bus without a server reported as unavailable, posting, server-action activation, user dismissal, forged signals from an independent bus client ignored, and server-side withdrawal on request, owner close and shutdown. This does not qualify notifications on macOS or Windows, or with other notification servers.'
            echo 'Linux filesystem grants run in development and inspected AOT on a private temporary tree checked independently with node:fs: default denial, unknown roots and access above the launch grant refused, read grants refusing writes, actual create/append/truncate/binary effects, directory pages and removal, symbolic links never followed inside or out of the grant, traversal rejected before the wire, a sibling directory left untouched, and native rejection of foreign, stale and reused grant handles. Close, owner close and shutdown revoke grants and withhold in-flight results. This does not qualify filesystem grants on macOS or Windows.'
            echo 'Linux owned processes run in development and inspected AOT with real /bin/sh children: default denial, pipes with separate stdout and stderr, an explicit environment with nothing inherited, a working directory resolved beneath a file grant without following links, a sized pseudo-terminal with resize and input, a group signal reaching descendants, exit stopping the whole group (checked through /proc), credited output delivered completely to a slow consumer, release, owner close and shutdown stopping groups, and native rejection of foreign, stale and reused process handles. This does not qualify owned processes on macOS or Windows.'
            echo 'Linux OS file dialogs run through xdg-desktop-portal and its GTK file chooser on an isolated D-Bus session in development and inspected AOT: default denial, a bus without a portal reported as unavailable, a real dialog transient for the owner window, forged portal responses from an independent bus client ignored, real keyboard selection of one file, several files and a folder, a save selection that creates no file, Escape cancellation, and the OS dialog closed after an aborted signal, owner close and shutdown. Selected paths are data, not filesystem grants. This does not qualify file dialogs on Wayland, in Flatpak/Snap sandboxes, on macOS or Windows, or with other portal backends.'
            echo 'Solid runs the exact source-fingerprinted generated module in development and through inspected Bun AOT against the same release GPUI host. Twelve scenarios require keyed identity, every native edit, delayed revision-aware replacement, shared keyboard/pointer/focus phases, caret and selection behavior, complete native paint, OS close and owner cleanup. These correctness cases do not close the separate retained-object investigation or establish matched framework performance.'
            echo 'Bridge acknowledgement timings run with instrumentation disabled; they are not display-presentation timings. The startup/RSS baseline retains one warm-up and five measured fresh-process trials per mode, alternating order, with a two-second idle interval and uncontrolled OS caches.'
            echo 'Separate Heaptrack runs profile only the real native host during the 1,000-cycle lifecycle in both modes. Full compressed allocation traces, tool/host/source hashes and bounded callsite reports are retained; profiler timing/RSS is not mixed into the baseline, and outstanding-at-exit allocations are not automatically leaks.'
            echo 'These bounded runs do not establish long-term leak freedom, physical input, hardware GPU performance or macOS/Windows native GUI support.'
            echo 'All four React entries run the same source-fingerprinted generated module in development and as the input to inspected Bun AOT against that release host. The counter requires a stable active callback through rerender, one property Set/one keyed move/one deletion, complete native input revisions, final native paint, effect/ref cleanup and clean OS close.'
            echo 'React also consumes the shared capture/target/bubble event mapping. Development and AOT scenarios require real pointer/focus/keyboard events, Enter activation despite JavaScript propagation stops, caret insertion and selection replacement without native input echo, and revocation of every observed callback signal after OS close.'
            echo 'Eight React behavior scenarios in each mode require real native mount/update/unmount, state/reducer batching, effect/ref lifetime, boundary fallback/recovery, transient concurrent retry, terminal reporter and cleanup failures, and an independently usable survivor root. The non-suspending transition case waits for an explicit React commit and native acknowledgement; ordinary flush does not promise to drain every transition lane.'
            echo 'The React diagnostic requires 1,000 individual state updates, 1,000 values coalesced into 100 native updates, 1,000 keyed rotations, and 1,000 mount/update/dispose cycles in each mode. Fixed WeakRef checkpoints, row-owner counts and public resource counts guard bounded cleanup. Separate native-paint calibration observes the complete expected tree and actual GPU; recorded acknowledgement timings are single-run diagnostics, not a cross-framework performance claim.'
            echo 'The streaming-list soak replays one versioned 10,000-message, 2,400-token stream through Solid and React in development and AOT on the same release host. It requires real XTest navigation, pointer selection, theme/density restyle and WM resize, an unmoved detached window, visible-window node/listener bounds, one cross-adapter final digest and zero owners after OS close. Frame, RSS, thread and descriptor figures are recorded baselines on software GPU, not thresholds or presentation timing.'
          } >> "$GITHUB_STEP_SUMMARY"
