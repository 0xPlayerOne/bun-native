name: Windows runtime build control

# An explicitly labelled PR can run the expensive source-build control without
# allocating a Windows runner on every push. The label is only a trigger.
# A successful diagnostic records valid observations, including failures; it
# does not mean the original collectability assertion or benchmark passed.
on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: windows-runtime-control-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  local-runtime:
    if: vars.CI_BILLING_PAUSED == 'false' && github.event.pull_request.draft == false && (github.event.label.name == 'diagnostic:windows-runtime' || github.event.label.name == 'diagnostic:windows-zero-registers' || (github.event.label.name == 'diagnostic:windows-snapshot-roots' || github.event.label.name == 'diagnostic:windows-origin-ranges'))
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      BUN_NATIVE_DIAG_SNAPSHOT_SAFE: ${{ (github.event.label.name == 'diagnostic:windows-snapshot-roots' || github.event.label.name == 'diagnostic:windows-origin-ranges') && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check boundary report parsing
        if: github.event.label.name == 'diagnostic:windows-origin-ranges'
        shell: pwsh
        run: |
          $report = '{"stats":{"string":1,"String":2},"retentionObservation":{"stillReachable":[299]}}' | ConvertFrom-Json -AsHashtable
          if ($report.stats['string'] -ne 1 -or $report.stats['String'] -ne 2 -or $report.retentionObservation.stillReachable[0] -ne 299) { throw 'Case-sensitive report parsing failed' }
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - name: Check out exact Bun source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: oven-sh/bun
          ref: b1007f1177fd402fae67387b8548cae5ae9b5707
          path: .diagnostics/bun
          persist-credentials: false
      - name: Apply and record the build-only path patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $source = Join-Path $env:GITHUB_WORKSPACE '.diagnostics/bun'
          $revision = git -C $source rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne 'b1007f1177fd402fae67387b8548cae5ae9b5707') { throw 'Unexpected Bun source revision' }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/retention/bun-windows-relative-sources.patch'
          git -C $source apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Build patch does not apply cleanly' }
          git -C $source apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Build patch failed' }
          Copy-Item $patch (Join-Path $root 'build-only.patch')
          Get-FileHash $patch -Algorithm SHA256 | Format-List | Out-File (Join-Path $root 'build-patch-hash.txt')
          $revision | Out-File (Join-Path $root 'bun-source-revision.txt')
      - name: Check schema and unified source paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE '.diagnostics/bun'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $probe = Join-Path $source 'src/codegen/bun-native-schema-control.ts'
          @'
          import { pathToFileURL } from 'node:url'
          const { loadSchemaFile } = await import(pathToFileURL(process.env.BUN_NATIVE_LOADER!).href)
          const schema = await loadSchemaFile(process.env.BUN_NATIVE_SCHEMA_SPEC!)
          console.log(`loaded ${schema.origin.stem}`)
          '@ | Set-Content -Encoding utf8 $probe
          if (Test-Path 'X:\') { throw 'Drive X: is already in use' }
          subst X: $source
          if ($LASTEXITCODE -ne 0) { throw 'Could not map X:' }
          $pushed = $false
          try {
            Push-Location 'X:\'
            $pushed = $true
            $results = @()
            foreach ($entry in @('mapped', 'physical')) {
              foreach ($input in @('relative', 'physical')) {
                $script = if ($entry -eq 'mapped') { 'X:\src\codegen\bun-native-schema-control.ts' } else { $probe }
                $env:BUN_NATIVE_LOADER = if ($entry -eq 'mapped') { 'X:\src\codegen\bindgen-load.ts' } else { Join-Path $source 'src/codegen/bindgen-load.ts' }
                $schema = if ($input -eq 'relative') { 'src\css_jsc\color_js.bind.ts' } else { Join-Path $source 'src/css_jsc/color_js.bind.ts' }
                $env:BUN_NATIVE_SCHEMA_SPEC = "bun_css_jsc=$schema"
                & bun $script
                $code = $LASTEXITCODE
                $results += [pscustomobject]@{ entry = $entry; input = $input; exitCode = $code }
                Write-Host "Schema control: entry=$entry input=$input exit=$code"
              }
            }
            $results | ConvertTo-Json | Out-File (Join-Path $root 'schema-path-controls.json') -Encoding utf8
            foreach ($entry in @('mapped', 'physical')) {
              $selected = $results | Where-Object { $_.entry -eq $entry -and $_.input -eq 'relative' }
              if ($selected.exitCode -ne 0) { throw "Relative schema input failed with $entry loader" }
            }
            $mixed = $results | Where-Object { $_.entry -eq 'mapped' -and $_.input -eq 'physical' }
            if ($mixed.exitCode -eq 0) { throw 'Mixed-path negative control unexpectedly passed' }
            $env:BUN_NATIVE_SOURCE_ROOT = $source
            $env:BUN_NATIVE_UNIFIED_PROBE = Join-Path $root 'unified-probe'
            bun -e 'import { resolve } from "node:path"; import { pathToFileURL } from "node:url"; const root = process.env.BUN_NATIVE_SOURCE_ROOT; const { generateUnifiedSources } = await import(pathToFileURL(resolve(root, "scripts", "build", "unified.ts")).href); const files = ["root_certs.cpp", "root_certs_windows.cpp", "sni_tree.cpp"].map(name => resolve(root, "packages", "bun-usockets", "src", "crypto", name)); const result = generateUnifiedSources({ cwd: process.cwd(), buildDir: process.env.BUN_NATIVE_UNIFIED_PROBE, unifiedSources: true, release: true, windows: true, x64: true }, files); if (!result.standalone.includes(files[1]) || result.bundled.includes(files[1]) || !result.bundled.includes(files[0]) || !result.bundled.includes(files[2])) throw new Error("Unified source exclusions were not preserved"); console.log("Windows certificate source compiles separately")'
            if ($LASTEXITCODE -ne 0) { throw 'Unified source grouping control failed' }
          } finally {
            if ($pushed) { Pop-Location }
            subst X: /D
            Remove-Item $probe -ErrorAction SilentlyContinue
          }
      - name: Check out exact WebKit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: oven-sh/WebKit
          ref: 4d45755fed4aeef19e95beb90d3d0c884a2812bd
          path: .diagnostics/webkit
          persist-credentials: false
          sparse-checkout: |
            Source/JavaScriptCore
            Source/WTF
            Source/bmalloc
            Source/cmake
            Source/ThirdParty
            Tools/Scripts
            icu
      # This is an observational experiment, not a GC correctness or release fix.
      - name: Apply experimental saved-register initialization
        if: github.event.label.name == 'diagnostic:windows-zero-registers'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $webkit = Join-Path $env:GITHUB_WORKSPACE '.diagnostics/webkit'
          $revision = git -C $webkit rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne '4d45755fed4aeef19e95beb90d3d0c884a2812bd') { throw 'Unexpected WebKit source revision' }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/retention/webkit-windows-zero-registers-experiment.patch'
          git -C $webkit apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Experimental patch does not apply cleanly' }
          git -C $webkit apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Experimental patch failed' }
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          Copy-Item $patch (Join-Path $root 'experimental-zero-registers.patch')
          Get-FileHash $patch -Algorithm SHA256 | Format-List | Out-File (Join-Path $root 'experimental-zero-registers-hash.txt')
          'Experimental saved-register initialization; not a GC correctness or production AOT qualification.' | Out-File (Join-Path $root 'experimental-zero-registers-scope.txt')
      - name: Apply experimental conservative snapshot metadata
        if: (github.event.label.name == 'diagnostic:windows-snapshot-roots' || github.event.label.name == 'diagnostic:windows-origin-ranges')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $webkit = Join-Path $env:GITHUB_WORKSPACE '.diagnostics/webkit'
          $revision = git -C $webkit rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne '4d45755fed4aeef19e95beb90d3d0c884a2812bd') { throw 'Unexpected WebKit source revision' }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/retention/webkit-conservative-snapshot-experiment.patch'
          git -C $webkit apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Experimental snapshot patch does not apply' }
          git -C $webkit apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Experimental snapshot patch failed' }
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          Copy-Item $patch (Join-Path $root 'experimental-conservative-snapshot.patch')
          Get-FileHash $patch -Algorithm SHA256 | Format-List | Out-File (Join-Path $root 'experimental-conservative-snapshot-hash.txt')
          'Later debugging snapshot only; altered source build retains JIT and is not production AOT.' | Out-File (Join-Path $root 'experimental-conservative-snapshot-scope.txt')
      - name: Apply experimental conservative origin ranges
        if: github.event.label.name == 'diagnostic:windows-origin-ranges'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $webkit = Join-Path $env:GITHUB_WORKSPACE '.diagnostics/webkit'
          $patch = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/retention/webkit-conservative-origin-experiment.patch'
          git -C $webkit apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Experimental origin patch does not apply' }
          git -C $webkit apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Experimental origin patch failed' }
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          Copy-Item $patch (Join-Path $root 'experimental-conservative-origin.patch')
          Get-FileHash $patch -Algorithm SHA256 | Format-List | Out-File (Join-Path $root 'experimental-conservative-origin-hash.txt')
          'Later snapshot ranges only; no stack contents or slot addresses; not production AOT.' | Out-File (Join-Path $root 'experimental-conservative-origin-scope.txt')
      - name: Apply and check the WebKit ICU script patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $webkit = Join-Path $env:GITHUB_WORKSPACE '.diagnostics/webkit'
          $revision = git -C $webkit rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne '4d45755fed4aeef19e95beb90d3d0c884a2812bd') { throw 'Unexpected WebKit source revision' }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/retention/webkit-windows-icu-variable.patch'
          git -C $webkit apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'ICU script patch does not apply cleanly' }
          git -C $webkit apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'ICU script patch failed' }
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          Copy-Item $patch (Join-Path $root 'webkit-icu.patch')
          Get-FileHash $patch -Algorithm SHA256 | Format-List | Out-File (Join-Path $root 'webkit-icu-patch-hash.txt')
          $revision | Out-File (Join-Path $root 'webkit-source-revision.txt')
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $webkit 'build-icu.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Host $_ }; throw 'Patched ICU script did not parse' }
          $control = Join-Path $root 'tar-drive-control'
          New-Item -ItemType Directory -Force -Path $control | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $control 'source') | Out-Null
          Set-Content -NoNewline -Encoding utf8 (Join-Path $control 'source/input.txt') 'mapped-drive-control'
          if (Test-Path 'X:\') { throw 'Drive X: is already in use' }
          subst X: $control
          if ($LASTEXITCODE -ne 0) { throw 'Could not map X: for tar control' }
          try {
            $tar = Join-Path $env:SystemRoot 'System32/tar.exe'
            & $tar -czf (Join-Path $control 'probe.tar.gz') -C (Join-Path $control 'source') 'input.txt'
            if ($LASTEXITCODE -ne 0) { throw 'System tar could not create a physical-path archive' }
            New-Item -ItemType Directory -Path 'X:\output' | Out-Null
            $mappedOutput = 'X:\output'
            $physicalOutput = Join-Path $control ($mappedOutput.Substring(([System.IO.Path]::GetPathRoot($mappedOutput)).Length))
            & $tar -xzf (Join-Path $control 'probe.tar.gz') -C $physicalOutput
            if ($LASTEXITCODE -ne 0 -or (Get-Content 'X:\output\input.txt' -Raw) -ne 'mapped-drive-control') { throw 'Physical extraction was not visible through the mapped drive' }
            'System tar physical-path extraction visible through mapped drive' | Out-File (Join-Path $root 'tar-drive-control.txt')
          } finally {
            subst X: /D
            Remove-Item -Recurse -Force $control
          }
      - name: Verify the checked-out AOT source list bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $webkit = Join-Path $env:GITHUB_WORKSPACE '.diagnostics/webkit'
          $file = Join-Path $webkit 'Source/JavaScriptCore/aot/Sources.txt'
          $expected = git -C $webkit rev-parse 'HEAD:Source/JavaScriptCore/aot/Sources.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify the source-list blob' }
          $actual = git -C $webkit hash-object --no-filters $file
          if ($LASTEXITCODE -ne 0) { throw 'Cannot hash the checked-out source list' }
          Write-Host "AOT source list: checkout=$actual git-blob=$expected"
          if ($actual -ne $expected) { throw 'Checked-out source-list bytes differ from the pinned blob' }
      - name: Install verified LLVM and NASM into the runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvm = Join-Path $env:RUNNER_TEMP 'llvm-23.tar.zst'
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/clang%2Bllvm-23.1.1-x86_64-pc-windows-msvc.tar.zst' -OutFile $llvm
          if ((Get-FileHash $llvm -Algorithm SHA256).Hash.ToLower() -ne 'c8a12d754b5050c5668b56a5425c806792d46c70f7244b1216046164aa4b6462') { throw 'LLVM checksum mismatch' }
          $llvmParent = Join-Path $env:RUNNER_TEMP 'llvm-23'
          New-Item -ItemType Directory -Path $llvmParent | Out-Null
          tar -xf $llvm -C $llvmParent
          if ($LASTEXITCODE -ne 0) { throw 'LLVM archive extraction failed' }
          Remove-Item $llvm
          $llvmRoot = Join-Path $llvmParent 'clang+llvm-23.1.1-x86_64-pc-windows-msvc'
          & (Join-Path $llvmRoot 'bin/clang-cl.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'LLVM version probe failed' }
          "BUN_TOOLCHAIN_LLVM=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $nasm = Join-Path $env:RUNNER_TEMP 'nasm.zip'
          Invoke-WebRequest 'https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip' -OutFile $nasm
          if ((Get-FileHash $nasm -Algorithm SHA256).Hash.ToLower() -ne '161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7') { throw 'NASM checksum mismatch' }
          Expand-Archive $nasm -DestinationPath (Join-Path $env:RUNNER_TEMP 'nasm')
          (Join-Path $env:RUNNER_TEMP 'nasm/nasm-3.02') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          rustup toolchain install nightly-2026-09-15 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          'RUSTUP_TOOLCHAIN=nightly-2026-09-15' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the local runtime
        shell: pwsh
        timeout-minutes: 100
        run: |
          $ErrorActionPreference = 'Stop'
          $env:BUN_BUILD_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'bun-build-cache'
          $env:CARGO_BUILD_JOBS = '2'
          $env:PATH = "C:\Program Files\Git\usr\bin;$env:PATH"
          Get-PSDrive C | Format-List Free,Used
          $bunSource = Join-Path $env:GITHUB_WORKSPACE '.diagnostics/bun'
          $webkitSource = Join-Path $env:GITHUB_WORKSPACE '.diagnostics/webkit'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          $mapped = @()
          $pushed = $false
          try {
            foreach ($mapping in @(@('X:', $bunSource), @('Y:', $webkitSource))) {
              if (Test-Path ($mapping[0] + '\')) { throw "Drive $($mapping[0]) is already in use" }
              subst $mapping[0] $mapping[1]
              if ($LASTEXITCODE -ne 0) { throw "Could not map $($mapping[0])" }
              $mapped += $mapping[0]
            }
            $env:BUN_WEBKIT_PATH = 'Y:\'
            $env:BUN_NATIVE_SOURCE_ROOT = $bunSource
            $env:GITHUB_SHA = 'b1007f1177fd402fae67387b8548cae5ae9b5707'
            $env:BUILDKITE_COMMIT = $env:GITHUB_SHA
            Push-Location 'X:\'
            $pushed = $true
            . (Join-Path $bunSource 'scripts\vs-shell.ps1')
            bun install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'Bun source install failed' }
            bun -e 'import { realpathSync } from "node:fs"; import { isAbsolute, relative, resolve } from "node:path"; const root = realpathSync(process.env.BUN_NATIVE_SOURCE_ROOT); const file = realpathSync(resolve(root, "src/css_jsc/color_js.bind.ts")); const rel = relative(root, file); if (isAbsolute(rel) || rel.startsWith("..") || resolve(root, rel) !== file) throw new Error("Cannot relativize canonical codegen input"); console.log(`Canonical codegen input: ${rel}`)'
            if ($LASTEXITCODE -ne 0) { throw 'Canonical codegen path check failed' }
            bun scripts/build.ts --profile=release-local --build-dir=build/release-local --configure-only
            if ($LASTEXITCODE -ne 0) { throw 'Local Bun configuration failed' }
            $env:BUN_NATIVE_COMPILE_DATABASE = Join-Path $bunSource 'build/release-local/compile_commands.json'
            bun -e 'import { relative } from "node:path"; const commands = await Bun.file(process.env.BUN_NATIVE_COMPILE_DATABASE).json(); const find = suffix => { const matches = commands.filter(entry => entry.file.toLowerCase().replaceAll("\\", "/").endsWith(suffix)); if (matches.length !== 1) throw new Error(`Missing or duplicate compile command: ${suffix}`); return matches[0] }; const resource = find("/src/jsc/bindings/windows/rescle.cpp"); const cert = find("/packages/bun-usockets/src/crypto/root_certs_windows.cpp"); const eh = resource.arguments.filter(flag => /^\/EH/i.test(flag)); if (eh.at(-1) !== "/EHsc") throw new Error(`Missing Windows exception override: ${eh}`); for (const entry of [resource, cert]) { const i = entry.arguments.lastIndexOf("-o"); if (i < 0) throw new Error(`Missing object output: ${entry.file}`); const object = relative(entry.directory, entry.arguments[i + 1]).replaceAll("\\", "/"); if (!object.startsWith("obj/")) throw new Error(`Object outside build directory: ${object}`); console.log(`Verified object: ${object}`) } console.log(`Windows exception override: ${eh.at(-1)}`)'
            if ($LASTEXITCODE -ne 0) { throw 'Per-file build path control failed' }
            $commands = Join-Path $root 'expanded-commands.tmp'
            bun scripts/build.ts --profile=release-local --build-dir=build/release-local -t commands > $commands
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect generated commands' }
            $shellCommands = @(Get-Content $commands | Where-Object { $_ -match '^cmd(?:\.exe)? /c ' })
            if ($shellCommands.Count -eq 0) { throw 'No generated cmd commands found to check' }
            $longest = ($shellCommands | Measure-Object -Property Length -Maximum).Maximum
            "Generated cmd commands: $($shellCommands.Count); maximum length: $longest" | Tee-Object -FilePath (Join-Path $root 'command-lengths.txt')
            $shellCommands | Where-Object { $_.Length -gt 8191 } | ForEach-Object {
              $prefix = $_.Substring(0, [Math]::Min(300, $_.Length))
              $bindCount = ([regex]::Matches($_, '(?i)\.bind\.ts')).Count
              "length=$($_.Length); bindgenSources=$bindCount; prefix=$prefix"
            } | Tee-Object -FilePath (Join-Path $root 'oversized-command-metadata.txt')
            Remove-Item $commands
            if ($longest -gt 8191) { throw 'Generated command exceeds the Windows cmd limit' }
            bun scripts/build.ts --profile=release-local --build-dir=build/release-local -j2
            if ($LASTEXITCODE -ne 0) { throw 'Local Bun build failed' }
            $local = Join-Path $bunSource 'build/release-local/bun.exe'
            if (!(Test-Path $local)) { throw "Missing built runtime: $local" }
            & $local --revision
            if ($LASTEXITCODE -ne 0) { throw 'Built runtime did not start' }
            "LOCAL_BUN=$local" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally {
            if ($pushed) { Pop-Location }
            foreach ($drive in $mapped) { subst $drive /D }
          }
      - name: Build and inspect the workloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:CONTROL_ROOT = $root
          $baseline = (Get-Command bun -CommandType Application).Source
          $baseline | Out-File -FilePath (Join-Path $root 'baseline-path.txt') -Encoding utf8
          Get-FileHash $baseline, $env:LOCAL_BUN -Algorithm SHA256 | Format-List | Out-File (Join-Path $root 'runtime-hashes.txt')
          bun build tests/core/protocol-peer.ts --compile --outfile (Join-Path $root 'peer.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Peer compile failed' }
          bun -e 'import { bundleApplication } from "./scripts/native/bundle.ts"; await bundleApplication({ framework: "react", entry: "benchmarks/solid/react.tsx", outdir: process.env.CONTROL_ROOT + "/react", cwd: process.cwd() })'
          if ($LASTEXITCODE -ne 0) { throw 'React bundle failed' }
          $module = Join-Path $root 'react/application.js'
          foreach ($variant in @('baseline', 'local')) {
            $compiler = if ($variant -eq 'baseline') { $baseline } else { $env:LOCAL_BUN }
            $binary = Join-Path $root "$variant-aot.exe"
            & $compiler --no-install compile --no-script --production --explain=json $module --outfile $binary *> (Join-Path $root "$variant-compile.log")
            if ($LASTEXITCODE -ne 0) { throw "$variant AOT compile failed" }
            bun -e 'import { inspectBunExecutable } from "./scripts/native/inspect.ts"; import { inspectBunRuntime } from "./scripts/native/inspect-runtime.ts"; const graph = inspectBunExecutable(process.argv[1]); const runtime = inspectBunRuntime(process.argv[1]); console.log(JSON.stringify({ graph, runtime }, null, 2))' $binary > (Join-Path $root "$variant-inspection.json")
            if ($LASTEXITCODE -ne 0) { throw "$variant executable inspection failed" }
            if ($variant -eq 'baseline') {
              $inspection = Get-Content (Join-Path $root "$variant-inspection.json") -Raw | ConvertFrom-Json
              if (!$inspection.graph.hasCompiledProgram -or $inspection.runtime.jit -ne 'unused') { throw 'Reference executable is not qualified AOT' }
            }
          }
      - name: Verify experimental snapshot controls
        if: (github.event.label.name == 'diagnostic:windows-snapshot-roots' || github.event.label.name == 'diagnostic:windows-origin-ranges')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          $baseline = (Get-Content (Join-Path $root 'baseline-path.txt') -Raw).Trim()
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/retention/conservative-snapshot-control.ts'
          python benchmarks/retention/snapshot_safe_run.py $baseline $fixture (Join-Path $root 'negative-snapshot.json.gz') (Join-Path $root 'negative-report.json') *> (Join-Path $root 'negative-snapshot.log')
          if ($LASTEXITCODE -eq 0 -or !(Select-String -Quiet -Path (Join-Path $root 'negative-snapshot.log') -Pattern 'AssertionError: Experimental conservative root field is missing')) { throw 'Unpatched negative control did not reject the missing field' }
          if ((Test-Path (Join-Path $root 'negative-snapshot.json.gz')) -or (Test-Path (Join-Path $root 'negative-report.json'))) { throw 'Negative control unexpectedly wrote a snapshot' }
          $control = Join-Path $root 'snapshot-control.exe'
          & $env:LOCAL_BUN --no-install compile --no-script --production $fixture --outfile $control *> (Join-Path $root 'snapshot-control-compile.log')
          if ($LASTEXITCODE -ne 0) { throw 'Experimental snapshot control did not compile' }
          bun -e 'import { inspectBunExecutable } from "./scripts/native/inspect.ts"; import { inspectBunRuntime } from "./scripts/native/inspect-runtime.ts"; const graph = inspectBunExecutable(process.argv[1]); const runtime = inspectBunRuntime(process.argv[1]); if (!graph.hasCompiledProgram || runtime.jit !== "present") throw new Error("Unexpected experimental executable"); console.log(JSON.stringify({graph,runtime},null,2))' $control > (Join-Path $root 'snapshot-control-inspection.json')
          if ($LASTEXITCODE -ne 0) { throw 'Experimental executable inspection failed' }
          foreach ($mode in @('development', 'compiled-untrimmed')) {
            $snapshot = Join-Path $root "snapshot-control-$mode.json.gz"
            $report = Join-Path $root "snapshot-control-$mode.json"
            if ($mode -eq 'development') { python benchmarks/retention/snapshot_safe_run.py $env:LOCAL_BUN $fixture $snapshot $report *> (Join-Path $root "snapshot-control-$mode.log") }
            else { python benchmarks/retention/snapshot_safe_run.py $control $snapshot $report *> (Join-Path $root "snapshot-control-$mode.log") }
            if ($LASTEXITCODE -ne 0) { throw "Experimental $mode positive control failed" }
            bun benchmarks/retention/conservative-snapshot-analysis.ts $snapshot $report (Join-Path $root "snapshot-control-$mode-analysis.json")
            if ($LASTEXITCODE -ne 0) { throw "Experimental $mode analysis failed" }
          }
      - name: Verify native stack origin control
        if: github.event.label.name == 'diagnostic:windows-origin-ranges'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          $baseline = (Get-Content (Join-Path $root 'baseline-path.txt') -Raw).Trim()
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/retention/conservative-origin-control.ts'
          $source = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/retention/conservative-origin-pin.c'
          $object = Join-Path $root 'origin-pin.obj'
          $library = Join-Path $root 'origin-pin.dll'
          $clang = Join-Path $env:BUN_TOOLCHAIN_LLVM 'bin/clang-cl.exe'
          $linker = Join-Path $env:BUN_TOOLCHAIN_LLVM 'bin/lld-link.exe'
          & $clang /nologo /O2 /GS- /c $source "/Fo$object" *> (Join-Path $root 'origin-pin-compile.log')
          if ($LASTEXITCODE -ne 0) { throw 'Native stack control did not compile' }
          & $linker /dll /noentry /nodefaultlib "/out:$library" $object *> (Join-Path $root 'origin-pin-link.log')
          if ($LASTEXITCODE -ne 0) { throw 'Native stack control did not link' }
          $negative = Join-Path $root 'origin-negative.json'
          python benchmarks/retention/snapshot_safe_run.py $baseline $fixture $library $negative *> (Join-Path $root 'origin-negative.log')
          if ($LASTEXITCODE -eq 0 -or !(Select-String -Quiet -Path (Join-Path $root 'origin-negative.log') -Pattern 'Experimental conservative origin metadata is missing')) { throw 'Unpatched origin control did not reject missing metadata' }
          if (Test-Path $negative) { throw 'Unpatched origin control unexpectedly wrote output' }
          $compiled = Join-Path $root 'origin-control.exe'
          & $env:LOCAL_BUN --no-install compile --no-script --production $fixture --outfile $compiled *> (Join-Path $root 'origin-control-compile.log')
          if ($LASTEXITCODE -ne 0) { throw 'Origin control did not compile' }
          bun -e 'import { inspectBunExecutable } from "./scripts/native/inspect.ts"; import { inspectBunRuntime } from "./scripts/native/inspect-runtime.ts"; const graph = inspectBunExecutable(process.argv[1]); const runtime = inspectBunRuntime(process.argv[1]); if (!graph.hasCompiledProgram || runtime.jit !== "present") throw new Error("Unexpected experimental executable"); console.log(JSON.stringify({graph,runtime},null,2))' $compiled > (Join-Path $root 'origin-control-inspection.json')
          if ($LASTEXITCODE -ne 0) { throw 'Origin executable inspection failed' }
          foreach ($mode in @('development', 'compiled-untrimmed')) {
            $output = Join-Path $root "origin-positive-$mode.json"
            if ($mode -eq 'development') { python benchmarks/retention/snapshot_safe_run.py $env:LOCAL_BUN $fixture $library $output *> (Join-Path $root "origin-positive-$mode.log") }
            else { python benchmarks/retention/snapshot_safe_run.py $compiled $library $output *> (Join-Path $root "origin-positive-$mode.log") }
            if ($LASTEXITCODE -ne 0) { throw "Native stack origin control failed: $mode" }
          }
      - name: Run alternating development controls with common reference AOT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          $baseline = (Get-Content (Join-Path $root 'baseline-path.txt') -Raw).Trim()
          $module = Join-Path $root 'react/application.js'
          foreach ($trial in 0..2) {
            $order = if ($trial % 2 -eq 0) { @('baseline', 'local') } else { @('local', 'baseline') }
            foreach ($variant in $order) {
              $runtime = if ($variant -eq 'baseline') { $baseline } else { $env:LOCAL_BUN }
              # The Windows-hosted local build is not trimmable. Never treat its
              # compiled executable as a release AOT control. Both runs use the
              # same inspected distribution AOT binary as a reference.
              python benchmarks/retention/headless-adapter-control.py react (Join-Path $root 'peer.exe') $module (Join-Path $root 'baseline-aot.exe') (Join-Path $root "$trial-$variant") 1 $runtime
              if ($LASTEXITCODE -ne 0) { throw "$variant control failed outside its retention observation" }
            }
          }
      - name: Observe source-built compiled workload without release qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          $inspection = Get-Content (Join-Path $root 'local-inspection.json') -Raw | ConvertFrom-Json
          if (!$inspection.graph.hasCompiledProgram -or $inspection.runtime.jit -ne 'present') { throw 'Unexpected local executable format or JIT state' }
          @'
          This source-built executable contains a compiled program but retains the JIT.
          It is an exploratory runtime control, not a qualified production AOT executable.
          '@ | Out-File (Join-Path $root 'local-compiled-scope.txt') -Encoding utf8
          foreach ($trial in 0..2) {
            python benchmarks/retention/headless-adapter-control.py react (Join-Path $root 'peer.exe') (Join-Path $root 'react/application.js') (Join-Path $root 'local-aot.exe') (Join-Path $root "$trial-local-compiled-untrimmed") 1 $env:LOCAL_BUN
            if ($LASTEXITCODE -ne 0) { throw "Local compiled control $trial failed outside its retention observation" }
          }
      - name: Analyze retained targets in experimental snapshots
        if: (github.event.label.name == 'diagnostic:windows-snapshot-roots' || github.event.label.name == 'diagnostic:windows-origin-ranges')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          $analyzed = 0
          foreach ($trial in 0..2) {
            $prefix = Join-Path $root "$trial-local-compiled-untrimmed/00-aot.json.retention"
            $snapshot = "$prefix-heap.json.gz"
            $report = "$prefix.json"
            if ((Test-Path $snapshot) -and (Test-Path $report)) {
              bun benchmarks/retention/conservative-snapshot-analysis.ts $snapshot $report (Join-Path $root "snapshot-retention-$trial-analysis.json")
              if ($LASTEXITCODE -ne 0) { throw "Experimental snapshot $trial analysis failed" }
              $analyzed++
            }
          }
          if ($analyzed -eq 0) { throw 'No retained-target snapshot was available for analysis' }
          @{ analyzed = $analyzed; scope = 'Later snapshot only; absence of a path is inconclusive' } | ConvertTo-Json | Out-File (Join-Path $root 'snapshot-retention-summary.json') -Encoding utf8
      - name: Verify next-task origin reports
        if: github.event.label.name == 'diagnostic:windows-origin-ranges'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          $checked = 0
          foreach ($trial in 0..2) {
            $report = Join-Path $root "$trial-local-compiled-untrimmed/00-aot.json.retention.json"
            if (!(Test-Path $report)) { continue }
            $value = Get-Content -Raw $report | ConvertFrom-Json
            if ($value.error -or !$value.experimentalConservative -or $null -eq $value.experimentalConservative.originCounts.sameJob -or $null -eq $value.experimentalConservative.originCounts.nextTask) { throw "Missing validated origin metadata in report $trial" }
            $checked++
          }
          if ($checked -eq 0) { throw 'No origin report was available' }
      - name: Observe the instrumented collection boundary
        if: github.event.label.name == 'diagnostic:windows-origin-ranges'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/solid'
          $entry = Join-Path $sourceDir '.retention-boundary-react.tsx'
          $workload = Join-Path $sourceDir '.retention-boundary-workload.ts'
          'The headless runner calls its compiled mode aot; this source-built executable retains JIT and is not qualified release AOT.' | Out-File (Join-Path $root 'boundary-scope.txt') -Encoding utf8
          Copy-Item $env:LOCAL_BUN (Join-Path $root 'instrumented-runtime.bin')
          foreach ($variant in @('baseline', 'pin')) {
            if ((Test-Path $entry) -or (Test-Path $workload)) { throw 'Boundary fixture path already exists' }
            try {
              python benchmarks/retention/boundary-snapshot-control.py $variant $sourceDir
              if ($LASTEXITCODE -ne 0) { throw 'Boundary fixture generation failed' }
              Copy-Item $entry (Join-Path $root "boundary-$variant-entry.tsx.txt")
              Copy-Item $workload (Join-Path $root "boundary-$variant-workload.ts.txt")
              $env:BOUNDARY_ENTRY = $entry
              $env:BOUNDARY_OUT = Join-Path $root "boundary-$variant"
              bun -e 'import { bundleApplication } from "./scripts/native/bundle.ts"; await bundleApplication({ framework: "react", entry: process.env.BOUNDARY_ENTRY, outdir: process.env.BOUNDARY_OUT, cwd: process.cwd() })'
              if ($LASTEXITCODE -ne 0) { throw 'Boundary fixture bundling failed' }
            } finally {
              if (Test-Path $entry) { Remove-Item $entry }
              if (Test-Path $workload) { Remove-Item $workload }
            }
            $module = Join-Path $env:BOUNDARY_OUT 'application.js'
            $binary = Join-Path $root "boundary-$variant.exe"
            & $env:LOCAL_BUN --no-install compile --no-script --production --explain=json $module --outfile $binary *> (Join-Path $root "boundary-$variant-compile.log")
            if ($LASTEXITCODE -ne 0) { throw 'Boundary fixture compile failed' }
            $trials = if ($variant -eq 'baseline') { 3 } else { 1 }
            $output = Join-Path $root "boundary-$variant-runs"
            python benchmarks/retention/headless-adapter-control.py react (Join-Path $root 'peer.exe') $module $binary $output $trials $env:LOCAL_BUN
            if ($LASTEXITCODE -ne 0) { throw 'Boundary fixture report failed validation' }
            foreach ($trial in 0..($trials - 1)) {
              foreach ($mode in @('development', 'aot')) {
                $prefix = Join-Path $output ('{0:D2}-{1}.json' -f $trial, $mode)
                $report = Get-Content $prefix -Raw | ConvertFrom-Json -AsHashtable
                $targets = Get-Content "$prefix.boundary-targets.json" -Raw | ConvertFrom-Json
                if (@($targets.targets).Count -ne @($report.retentionObservation.stillReachable).Count) { throw 'Boundary targets do not match observed survivors' }
                $targetIndexes = @($targets.targets | ForEach-Object { $_.index } | Sort-Object) -join ','
                $survivorIndexes = @($report.retentionObservation.stillReachable | Sort-Object) -join ','
                if ($targetIndexes -ne $survivorIndexes) { throw 'Boundary target indexes do not match observed survivors' }
                if ($variant -eq 'pin') {
                  $expected = if ($mode -eq 'development') { 3 } else { 297 }
                  if ($expected -notin $report.retentionObservation.stillReachable) { throw 'Pinned boundary target was not detected' }
                }
                bun benchmarks/retention/conservative-snapshot-analysis.ts "$prefix.boundary.json.gz" "$prefix.boundary-targets.json" "$prefix.boundary-analysis.json"
                if ($LASTEXITCODE -ne 0) { throw 'Boundary snapshot analysis failed' }
                $analysis = Get-Content "$prefix.boundary-analysis.json" -Raw | ConvertFrom-Json
                if (@($analysis.targets | Where-Object { !$_.presentInSnapshot }).Count -ne 0) { throw 'Observed boundary target is absent from its snapshot' }
              }
            }
          }
      - name: Verify pinned-target controls with both runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          $baseline = (Get-Content (Join-Path $root 'baseline-path.txt') -Raw).Trim()
          foreach ($variant in @('baseline', 'local')) {
            $runtime = if ($variant -eq 'baseline') { $baseline } else { $env:LOCAL_BUN }
            # The AOT variants are compiled and inspected by the distribution;
            # the selected runtime applies only to the development observations.
            python benchmarks/retention/react-dispatch-control.py (Join-Path $root 'peer.exe') (Join-Path $root "pin-$variant") 1 cycle $runtime
            if ($LASTEXITCODE -ne 0) { throw "$variant pinned-target control failed" }
          }
      - name: Retain controls and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-local-runtime-control
          path: |
            ${{ runner.temp }}/runtime-build-control/
            !${{ runner.temp }}/runtime-build-control/*.exe
          if-no-files-found: warn
          retention-days: 30

  boundary-pairs:
    if: vars.CI_BILLING_PAUSED == 'false' && github.event.pull_request.draft == false && (github.event.label.name == 'diagnostic:windows-boundary-pairs' || github.event.label.name == 'diagnostic:windows-wrapper-release' || github.event.label.name == 'diagnostic:windows-capture-release' || github.event.label.name == 'diagnostic:windows-listener-release')
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - name: Download the identified diagnostic runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'boundary-reuse'
          gh run download 43762395712 --repo $env:GITHUB_REPOSITORY --name windows-local-runtime-control --dir $root
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic artifact download failed' }
          $source = Join-Path $root 'instrumented-runtime.bin'
          $expected = '49266f7b12bcf39af1befe7c7ca416ee239095a660fa9257fd50fe79410fc45f'
          if ((Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Diagnostic runtime hash mismatch' }
          Copy-Item $source (Join-Path $root 'instrumented-runtime.exe')
          & (Join-Path $root 'instrumented-runtime.exe') --revision
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic runtime could not start' }
      - name: Run paired boundary controls
        shell: pwsh
        env:
          BOUNDARY_EXPERIMENT: ${{ github.event.label.name == 'diagnostic:windows-listener-release' && 'listener-release' || github.event.label.name == 'diagnostic:windows-capture-release' && 'capture-release' || github.event.label.name == 'diagnostic:windows-wrapper-release' && 'wrapper-release' || 'collection' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'boundary-reuse'
          $peer = Join-Path $root 'paired-peer.exe'
          bun build tests/core/protocol-peer.ts --compile --outfile $peer
          if ($LASTEXITCODE -ne 0) { throw 'Peer compilation failed' }
          python benchmarks/retention/boundary-pairs.py (Join-Path $root 'instrumented-runtime.exe') $peer (Join-Path $root 'paired-results') 5 $env:BOUNDARY_EXPERIMENT
          if ($LASTEXITCODE -ne 0) { throw 'Paired controls failed validation' }
      - name: Retain paired controls
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-boundary-pairs
          path: |
            ${{ runner.temp }}/boundary-reuse/paired-results/
            !${{ runner.temp }}/boundary-reuse/paired-results/*.exe
          if-no-files-found: warn
          retention-days: 30

  production-capture:
    if: vars.CI_BILLING_PAUSED == 'false' && github.event.pull_request.draft == false && (github.event.label.name == 'diagnostic:windows-production-capture' || github.event.label.name == 'diagnostic:windows-production-detach')
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - name: Run production AOT capture controls
        shell: pwsh
        env:
          PRODUCTION_EXPERIMENT: ${{ github.event.label.name == 'diagnostic:windows-production-detach' && 'production-detach' || 'production-capture' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'production-capture'
          New-Item -ItemType Directory -Path $root | Out-Null
          $peer = Join-Path $root 'peer.exe'
          bun build tests/core/protocol-peer.ts --compile --outfile $peer
          if ($LASTEXITCODE -ne 0) { throw 'Peer compilation failed' }
          $runtime = (Get-Command bun -CommandType Application).Source
          python benchmarks/retention/boundary-pairs.py $runtime $peer (Join-Path $root 'results') 5 $env:PRODUCTION_EXPERIMENT
          if ($LASTEXITCODE -ne 0) { throw 'Production capture controls failed validation' }
      - name: Retain production AOT controls
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-production-capture
          path: |
            ${{ runner.temp }}/production-capture/results/
            !${{ runner.temp }}/production-capture/results/*.exe
          if-no-files-found: warn
          retention-days: 30

  candidate-runtime:
    if: vars.CI_BILLING_PAUSED == 'false' && github.event.pull_request.draft == false && github.event.label.name == 'diagnostic:windows-candidate'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - name: Prepare verified runtimes and workloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'candidate-runtime-control'
          New-Item -ItemType Directory -Path $root | Out-Null
          $baseline = (Get-Command bun -CommandType Application).Source
          $archive = Join-Path $root 'candidate.tgz'
          Invoke-WebRequest 'https://registry.npmjs.org/@oven/bun-windows-x64/-/bun-windows-x64-1.4.4-canary.20261114.1.tgz' -OutFile $archive
          $hash = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::HashData([System.IO.File]::ReadAllBytes($archive)))
          if ($hash -ne 'S8s0ZXYbgs+L0YWg9y2XX/Kx6Js//kEPLR3vOhpV4JvXqVjhF8//nzDldMa1nfLC+xra50gMTkVAH9ZkRqzECQ==') { throw 'Candidate archive integrity mismatch' }
          tar -xf $archive -C $root
          if ($LASTEXITCODE -ne 0) { throw 'Candidate extraction failed' }
          $candidate = Join-Path $root 'package/bin/bun.exe'
          $revision = & $candidate -e 'process.stdout.write(Bun.revision)'
          if ($LASTEXITCODE -ne 0 -or $revision -ne '9098897a17372d46559d1a68a44061f493546631') { throw 'Candidate revision mismatch' }
          Get-FileHash $baseline, $candidate -Algorithm SHA256 | Format-List | Out-File (Join-Path $root 'runtime-hashes.txt')
          $baseline | Out-File (Join-Path $root 'baseline-path.txt') -Encoding utf8
          bun build tests/core/protocol-peer.ts --compile --outfile (Join-Path $root 'peer.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Peer build failed' }
          $env:CONTROL_ROOT = $root
          bun -e 'import { bundleApplication } from "./scripts/native/bundle.ts"; await bundleApplication({framework:"react",entry:"benchmarks/solid/react.tsx",outdir:process.env.CONTROL_ROOT + "/react",cwd:process.cwd()})'
          if ($LASTEXITCODE -ne 0) { throw 'React bundle failed' }
          foreach ($variant in @('baseline', 'candidate')) {
            $compiler = if ($variant -eq 'baseline') { $baseline } else { $candidate }
            $binary = Join-Path $root "$variant-aot.exe"
            & $compiler --no-install compile --no-script --production --explain=json (Join-Path $root 'react/application.js') --outfile $binary *> (Join-Path $root "$variant-compile.log")
            if ($LASTEXITCODE -ne 0) { throw "$variant compile failed" }
            bun -e 'import { inspectBunExecutable } from "./scripts/native/inspect.ts"; import { inspectBunRuntime } from "./scripts/native/inspect-runtime.ts"; const graph=inspectBunExecutable(process.argv[1]); const runtime=inspectBunRuntime(process.argv[1]); if (!graph.hasCompiledProgram || runtime.jit !== "unused") throw new Error("Not AOT"); console.log(JSON.stringify({graph,runtime},null,2))' $binary > (Join-Path $root "$variant-inspection.json")
            if ($LASTEXITCODE -ne 0) { throw "$variant AOT inspection failed" }
          }
      - name: Compare paired runtimes and verify pinned targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'candidate-runtime-control'
          $baseline = (Get-Content (Join-Path $root 'baseline-path.txt') -Raw).Trim()
          $candidate = Join-Path $root 'package/bin/bun.exe'
          $toolchain = Join-Path $env:GITHUB_WORKSPACE 'toolchain.json'
          $original = [System.IO.File]::ReadAllBytes($toolchain)
          $originalPath = $env:PATH
          try {
            foreach ($trial in 0..4) {
              $order = if ($trial % 2 -eq 0) { @('baseline', 'candidate') } else { @('candidate', 'baseline') }
              foreach ($variant in $order) {
                $runtime = if ($variant -eq 'baseline') { $baseline } else { $candidate }
                $revision = & $runtime -e 'process.stdout.write(Bun.revision)'
                if ($LASTEXITCODE -ne 0) { throw "$variant revision probe failed" }
                $config = [System.Text.Encoding]::UTF8.GetString($original) | ConvertFrom-Json
                $config.bun.revision = $revision
                [System.IO.File]::WriteAllText($toolchain, ($config | ConvertTo-Json -Depth 30), [System.Text.UTF8Encoding]::new($false))
                python benchmarks/retention/headless-adapter-control.py react (Join-Path $root 'peer.exe') (Join-Path $root 'react/application.js') (Join-Path $root "$variant-aot.exe") (Join-Path $root "$trial-$variant") 1 $runtime
                if ($LASTEXITCODE -ne 0) { throw "$variant pair failed outside its retention observation" }
              }
            }
            foreach ($variant in @('baseline', 'candidate')) {
              $runtime = if ($variant -eq 'baseline') { $baseline } else { $candidate }
              $revision = & $runtime -e 'process.stdout.write(Bun.revision)'
              if ($LASTEXITCODE -ne 0) { throw "$variant revision probe failed" }
              $config = [System.Text.Encoding]::UTF8.GetString($original) | ConvertFrom-Json
              $config.bun.revision = $revision
              [System.IO.File]::WriteAllText($toolchain, ($config | ConvertTo-Json -Depth 30), [System.Text.UTF8Encoding]::new($false))
              $env:PATH = "$(Split-Path $runtime);$originalPath"
              python benchmarks/retention/react-dispatch-control.py (Join-Path $root 'peer.exe') (Join-Path $root "pin-$variant") 1 cycle $runtime
              if ($LASTEXITCODE -ne 0) { throw "$variant positive control failed" }
            }
          } finally {
            [System.IO.File]::WriteAllBytes($toolchain, $original)
            $env:PATH = $originalPath
          }
      - name: Retain diagnostic observations
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-candidate-runtime-control
          path: |
            ${{ runner.temp }}/candidate-runtime-control/
            !${{ runner.temp }}/candidate-runtime-control/*.exe
            !${{ runner.temp }}/candidate-runtime-control/package/
            !${{ runner.temp }}/candidate-runtime-control/*.tgz
            !${{ runner.temp }}/candidate-runtime-control/pin-*/*-aot.exe
          retention-days: 30
