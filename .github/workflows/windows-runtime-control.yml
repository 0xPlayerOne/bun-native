name: Windows runtime build control

# An explicitly labelled PR can run the expensive source-build control without
# allocating a Windows runner on every push. The label is only a trigger.
# A successful diagnostic records valid observations, including failures; it
# does not mean the original collectability assertion or benchmark passed.
on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: windows-runtime-control-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  local-runtime:
    if: vars.CI_BILLING_PAUSED == 'false' && github.event.pull_request.draft == false && github.event.label.name == 'diagnostic:windows-runtime'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - name: Check out exact Bun source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: oven-sh/bun
          ref: b1007f1177fd402fae67387b8548cae5ae9b5707
          path: .diagnostics/bun
          persist-credentials: false
      - name: Check out exact WebKit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: oven-sh/WebKit
          ref: 4d45755fed4aeef19e95beb90d3d0c884a2812bd
          path: .diagnostics/webkit
          persist-credentials: false
          sparse-checkout: |
            Source/JavaScriptCore
            Source/WTF
            Source/bmalloc
            Source/cmake
            Source/ThirdParty
            Tools/Scripts
            icu
      - name: Verify the checked-out AOT source list bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $webkit = Join-Path $env:GITHUB_WORKSPACE '.diagnostics/webkit'
          $file = Join-Path $webkit 'Source/JavaScriptCore/aot/Sources.txt'
          $expected = git -C $webkit rev-parse 'HEAD:Source/JavaScriptCore/aot/Sources.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify the source-list blob' }
          $actual = git -C $webkit hash-object --no-filters $file
          if ($LASTEXITCODE -ne 0) { throw 'Cannot hash the checked-out source list' }
          Write-Host "AOT source list: checkout=$actual git-blob=$expected"
          if ($actual -ne $expected) { throw 'Checked-out source-list bytes differ from the pinned blob' }
      - name: Install verified LLVM and NASM into the runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvm = Join-Path $env:RUNNER_TEMP 'llvm-23.tar.zst'
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/clang%2Bllvm-23.1.1-x86_64-pc-windows-msvc.tar.zst' -OutFile $llvm
          if ((Get-FileHash $llvm -Algorithm SHA256).Hash.ToLower() -ne 'c8a12d754b5050c5668b56a5425c806792d46c70f7244b1216046164aa4b6462') { throw 'LLVM checksum mismatch' }
          $llvmParent = Join-Path $env:RUNNER_TEMP 'llvm-23'
          New-Item -ItemType Directory -Path $llvmParent | Out-Null
          tar -xf $llvm -C $llvmParent
          if ($LASTEXITCODE -ne 0) { throw 'LLVM archive extraction failed' }
          Remove-Item $llvm
          $llvmRoot = Join-Path $llvmParent 'clang+llvm-23.1.1-x86_64-pc-windows-msvc'
          & (Join-Path $llvmRoot 'bin/clang-cl.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'LLVM version probe failed' }
          "BUN_TOOLCHAIN_LLVM=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $nasm = Join-Path $env:RUNNER_TEMP 'nasm.zip'
          Invoke-WebRequest 'https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip' -OutFile $nasm
          if ((Get-FileHash $nasm -Algorithm SHA256).Hash.ToLower() -ne '161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7') { throw 'NASM checksum mismatch' }
          Expand-Archive $nasm -DestinationPath (Join-Path $env:RUNNER_TEMP 'nasm')
          (Join-Path $env:RUNNER_TEMP 'nasm/nasm-3.02') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          rustup toolchain install nightly-2026-09-15 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          'RUSTUP_TOOLCHAIN=nightly-2026-09-15' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Apply and record the build-only path patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $source = Join-Path $env:GITHUB_WORKSPACE '.diagnostics/bun'
          $revision = git -C $source rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne 'b1007f1177fd402fae67387b8548cae5ae9b5707') { throw 'Unexpected Bun source revision' }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/retention/bun-windows-relative-sources.patch'
          git -C $source apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Build patch does not apply cleanly' }
          git -C $source apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Build patch failed' }
          Copy-Item $patch (Join-Path $root 'build-only.patch')
          Get-FileHash $patch -Algorithm SHA256 | Format-List | Out-File (Join-Path $root 'build-patch-hash.txt')
          $revision | Out-File (Join-Path $root 'bun-source-revision.txt')
      - name: Build the uninstrumented local runtime
        shell: pwsh
        timeout-minutes: 100
        run: |
          $ErrorActionPreference = 'Stop'
          $env:BUN_BUILD_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'bun-build-cache'
          $env:CARGO_BUILD_JOBS = '2'
          $env:PATH = "C:\Program Files\Git\usr\bin;$env:PATH"
          Get-PSDrive C | Format-List Free,Used
          $bunSource = Join-Path $env:GITHUB_WORKSPACE '.diagnostics/bun'
          $webkitSource = Join-Path $env:GITHUB_WORKSPACE '.diagnostics/webkit'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          $mapped = @()
          $pushed = $false
          try {
            foreach ($mapping in @(@('X:', $bunSource), @('Y:', $webkitSource))) {
              if (Test-Path ($mapping[0] + '\')) { throw "Drive $($mapping[0]) is already in use" }
              subst $mapping[0] $mapping[1]
              if ($LASTEXITCODE -ne 0) { throw "Could not map $($mapping[0])" }
              $mapped += $mapping[0]
            }
            $env:BUN_WEBKIT_PATH = 'Y:\'
            $env:BUN_NATIVE_SOURCE_ROOT = $bunSource
            $env:GITHUB_SHA = 'b1007f1177fd402fae67387b8548cae5ae9b5707'
            $env:BUILDKITE_COMMIT = $env:GITHUB_SHA
            Push-Location 'X:\'
            $pushed = $true
            . (Join-Path $bunSource 'scripts\vs-shell.ps1')
            bun install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'Bun source install failed' }
            bun -e 'import { realpathSync } from "node:fs"; import { isAbsolute, relative, resolve } from "node:path"; const root = realpathSync(process.env.BUN_NATIVE_SOURCE_ROOT); const file = realpathSync(resolve(root, "src/css_jsc/color_js.bind.ts")); const rel = relative(root, file); if (isAbsolute(rel) || rel.startsWith("..") || resolve(root, rel) !== file) throw new Error("Cannot relativize canonical codegen input"); console.log(`Canonical codegen input: ${rel}`)'
            if ($LASTEXITCODE -ne 0) { throw 'Canonical codegen path check failed' }
            bun scripts/build.ts --profile=release-local --build-dir=build/release-local --configure-only
            if ($LASTEXITCODE -ne 0) { throw 'Local Bun configuration failed' }
            $commands = Join-Path $root 'expanded-commands.tmp'
            bun scripts/build.ts --profile=release-local --build-dir=build/release-local -t commands > $commands
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect generated commands' }
            $shellCommands = @(Get-Content $commands | Where-Object { $_ -match '^cmd(?:\.exe)? /c ' })
            if ($shellCommands.Count -eq 0) { throw 'No generated cmd commands found to check' }
            $longest = ($shellCommands | Measure-Object -Property Length -Maximum).Maximum
            "Generated cmd commands: $($shellCommands.Count); maximum length: $longest" | Tee-Object -FilePath (Join-Path $root 'command-lengths.txt')
            $shellCommands | Where-Object { $_.Length -gt 8191 } | ForEach-Object {
              $prefix = $_.Substring(0, [Math]::Min(300, $_.Length))
              $bindCount = ([regex]::Matches($_, '(?i)\.bind\.ts')).Count
              "length=$($_.Length); bindgenSources=$bindCount; prefix=$prefix"
            } | Tee-Object -FilePath (Join-Path $root 'oversized-command-metadata.txt')
            Remove-Item $commands
            if ($longest -gt 8191) { throw 'Generated command exceeds the Windows cmd limit' }
            bun scripts/build.ts --profile=release-local --build-dir=build/release-local -j2
            if ($LASTEXITCODE -ne 0) { throw 'Local Bun build failed' }
            $local = Join-Path $bunSource 'build/release-local/bun.exe'
            if (!(Test-Path $local)) { throw "Missing built runtime: $local" }
            & $local --revision
            if ($LASTEXITCODE -ne 0) { throw 'Built runtime did not start' }
            "LOCAL_BUN=$local" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally {
            if ($pushed) { Pop-Location }
            foreach ($drive in $mapped) { subst $drive /D }
          }
      - name: Build and inspect the matched workloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:CONTROL_ROOT = $root
          $baseline = (Get-Command bun -CommandType Application).Source
          $baseline | Out-File -FilePath (Join-Path $root 'baseline-path.txt') -Encoding utf8
          Get-FileHash $baseline, $env:LOCAL_BUN -Algorithm SHA256 | Format-List | Out-File (Join-Path $root 'runtime-hashes.txt')
          bun build tests/core/protocol-peer.ts --compile --outfile (Join-Path $root 'peer.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Peer compile failed' }
          bun -e 'import { bundleApplication } from "./scripts/native/bundle.ts"; await bundleApplication({ framework: "react", entry: "benchmarks/solid/react.tsx", outdir: process.env.CONTROL_ROOT + "/react", cwd: process.cwd() })'
          if ($LASTEXITCODE -ne 0) { throw 'React bundle failed' }
          $module = Join-Path $root 'react/application.js'
          foreach ($variant in @('baseline', 'local')) {
            $compiler = if ($variant -eq 'baseline') { $baseline } else { $env:LOCAL_BUN }
            $binary = Join-Path $root "$variant-aot.exe"
            & $compiler --no-install compile --no-script --production --explain=json $module --outfile $binary *> (Join-Path $root "$variant-compile.log")
            if ($LASTEXITCODE -ne 0) { throw "$variant AOT compile failed" }
            bun -e 'import { inspectBunExecutable } from "./scripts/native/inspect.ts"; import { inspectBunRuntime } from "./scripts/native/inspect-runtime.ts"; const graph = inspectBunExecutable(process.argv[1]); const runtime = inspectBunRuntime(process.argv[1]); if (!graph.hasCompiledProgram || runtime.jit !== "unused") throw new Error("Not an AOT executable"); console.log(JSON.stringify({ graph, runtime }, null, 2))' $binary > (Join-Path $root "$variant-inspection.json")
            if ($LASTEXITCODE -ne 0) { throw "$variant AOT inspection failed" }
          }
      - name: Run alternating fresh-process controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'runtime-build-control'
          $baseline = (Get-Content (Join-Path $root 'baseline-path.txt') -Raw).Trim()
          $module = Join-Path $root 'react/application.js'
          foreach ($trial in 0..2) {
            $order = if ($trial % 2 -eq 0) { @('baseline', 'local') } else { @('local', 'baseline') }
            foreach ($variant in $order) {
              $runtime = if ($variant -eq 'baseline') { $baseline } else { $env:LOCAL_BUN }
              python benchmarks/retention/headless-adapter-control.py react (Join-Path $root 'peer.exe') $module (Join-Path $root "$variant-aot.exe") (Join-Path $root "$trial-$variant") 1 $runtime
              if ($LASTEXITCODE -ne 0) { throw "$variant control failed outside its retention observation" }
            }
          }
      - name: Retain controls and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-local-runtime-control
          path: |
            ${{ runner.temp }}/runtime-build-control/
            !${{ runner.temp }}/runtime-build-control/*.exe
          if-no-files-found: warn
          retention-days: 30
