name: M5 Bun PTY and bounded stream sources
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
concurrency:
  group: bun-pty-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pty:
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; node24
        with:
          python-version: '3.11'
      - name: Install frozen application-side dependencies
        run: bun install --frozen-lockfile
      - name: Validate bounded source scheduling
        run: bun test tests/stream-source.test.ts tests/stream-source-fairness.test.ts
      - name: Qualify actual Bun PTYs on Linux or macOS
        if: runner.os != 'Windows'
        run: |
          bun test tests/terminal-service.test.ts tests/terminal-service-real.test.ts
          bun run qualify:services
          bun scripts/qualify-bun-pty.ts
      - name: Qualify actual Bun PTYs as a Windows standard user
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/hosted-windows.ps1 -Suite pty
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; node24
        if: ${{ !cancelled() }}
        with:
          name: bun-pty-${{ matrix.os }}
          path: .bunly/pty-evidence/qualification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
