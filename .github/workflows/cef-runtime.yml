name: Native CEF runtime, authority and fault supervision
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to test (standard GitHub-hosted runners only)
        type: choice
        required: true
        default: windows
        options: [windows, linux, macos, all]
      suite:
        description: Portable checks, prebuilt smoke matrix, or full native qualification
        type: choice
        required: true
        default: full
        options: [portable, smoke, full, m4-acceptance]
permissions:
  contents: read
concurrency:
  group: cef-${{ github.event_name }}-${{ github.ref }}-${{ inputs.platform || 'automatic' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cef:
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
      CEF_PATH: ${{ github.workspace }}/.bunly/cef-cache
      PYTHON: python
      EXPECTED_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; node24
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; node24
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .bunly/cef-cache
          key: auto-cef-${{ matrix.target }}-rust191-${{ hashFiles('native/cef-host/Cargo.lock') }}
      - name: Native contributor prerequisites
        shell: bash
        run: |
          mkdir -p .bunly/hosted-evidence
          rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy
          if [ '${{ runner.os }}' = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y ninja-build libgtk-3-dev libnss3 libasound2 libgbm1 xvfb dbus-x11
          fi
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-dev.txt
          python -c 'import os,sys; open(os.environ["GITHUB_ENV"],"a").write("PYTHON="+sys.executable+"\n")'
      - name: Configure Windows C++ toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $script = Join-Path $env:RUNNER_TEMP 'bunly-vs-env.cmd'
          @('@echo off', ('call "' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul'), 'if errorlevel 1 exit /b %errorlevel%', 'set') | Set-Content $script
          $lines = & cmd.exe /c $script
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment initialization failed' }
          foreach ($line in $lines) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion|VSINSTALLDIR)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      # Contributor probes are compiled only into this qualification artifact.
      - name: Compile native host and helpers
        shell: bash
        run: |
          cargo +1.91.0 fmt --manifest-path native/cef-host/Cargo.toml --check
          cargo +1.91.0 clippy --locked --manifest-path native/cef-host/Cargo.toml --all-targets --features packaging -- -D warnings
          cargo +1.91.0 test --locked --manifest-path native/cef-host/Cargo.toml --lib
          cargo +1.91.0 test --locked --manifest-path native/cef-host/Cargo.toml --bin bunly-terminal-owner
          cargo +1.91.0 clippy --locked --manifest-path native/cef-host/Cargo.toml --all-targets --features packaging,rpc-qualification -- -D warnings
          cargo +1.91.0 test --locked --manifest-path native/cef-host/Cargo.toml --lib --features rpc-qualification
          cargo +1.91.0 build --locked --manifest-path native/cef-host/Cargo.toml --features packaging,rpc-qualification --release > .bunly/hosted-evidence/build.log 2>&1 || { tail -180 .bunly/hosted-evidence/build.log; exit 1; }
          tail -10 .bunly/hosted-evidence/build.log
      - name: Build TypeScript application without native compilation
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun scripts/build-cef-fixture.ts
      - name: Assemble contributor runtime bundle
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.91.0
        run: |
          cargo +1.91.0 run --locked --manifest-path native/cef-host/Cargo.toml --features packaging,rpc-qualification --release --bin bunly-bundle -- "$GITHUB_WORKSPACE/.bunly/cef-bundle"
          python scripts/hosted_cef.py prepare
      - name: Run the shared prebuilt matrix on Linux or macOS
        if: runner.os != 'Windows'
        timeout-minutes: 20
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- python scripts/hosted_cef.py run --suite full
          else
            python scripts/hosted_cef.py run --suite full
          fi
      - name: Run the shared Windows matrix as a standard user
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/hosted-windows.ps1 -Suite full
      # Native owner execution precedes the unchanged eight CEF/provider stages.
      # Both automatic/manual runs use the standard-user runner and deadlines.
      - name: Preserve native build diagnostics
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p .bunly/hosted-evidence
          if [ -f native/cef-host/Cargo.lock ]; then cp native/cef-host/Cargo.lock .bunly/hosted-evidence/Cargo.lock; fi
          python scripts/hosted_cef.py collect
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; node24
        if: success() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .bunly/cef-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; node24
        if: ${{ !cancelled() }}
        with:
          name: cef-native-${{ matrix.os }}
          path: .bunly/hosted-evidence/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  # Explicit maintainer dispatch is independent of the automatic billing pause.
  manual-plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        name: Select only allowlisted hosted platforms
        env:
          PLATFORM: ${{ inputs.platform }}
          SUITE: ${{ inputs.suite }}
        run: |
          python3 - <<'PY'
          import json, os
          rows = {
              'windows': {'os': 'windows-2022', 'target': 'win32-x64'},
              'linux': {'os': 'ubuntu-22.04', 'target': 'linux-x64'},
              'macos': {'os': 'macos-15', 'target': 'darwin-arm64'},
          }
          name = os.environ['PLATFORM']
          if name not in (*rows, 'all') or os.environ['SUITE'] not in ('portable', 'smoke', 'full', 'm4-acceptance'):
              raise SystemExit('Unsupported platform or test suite')
          matrix = {'include': list(rows.values()) if name == 'all' else [rows[name]]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          PY
  manual-native:
    if: github.event_name == 'workflow_dispatch'
    needs: manual-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manual-plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      CEF_PATH: ${{ github.workspace }}/.bunly/cef-cache
      QUALIFICATION_SUITE: ${{ inputs.suite }}
      EXPECTED_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; node24
        with:
          python-version: '3.11'
      - name: Install frozen contributor tools
        run: |
          mkdir -p .bunly/hosted-evidence
          bun install --frozen-lockfile
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -c 'import os,sys; open(os.environ["GITHUB_ENV"],"a").write("PYTHON="+sys.executable+"\n")'
      - name: Portable checks
        run: bun run check:portable 2>&1 | tee .bunly/hosted-evidence/check.log
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; node24
        if: inputs.suite != 'portable'
        id: manual-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .bunly/cef-cache
          key: manual-cef-${{ matrix.target }}-rust191-${{ hashFiles('native/cef-host/Cargo.lock') }}
      - name: Native contributor prerequisites
        if: inputs.suite != 'portable'
        run: |
          rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y ninja-build libgtk-3-dev libnss3 libasound2 libgbm1 xvfb dbus-x11
          fi
      - name: Configure MSVC for the Windows contributor build
        if: inputs.suite != 'portable' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $script = Join-Path $env:RUNNER_TEMP 'bunly-manual-vs-env.cmd'
          @('@echo off', ('call "' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul'), 'if errorlevel 1 exit /b %errorlevel%', 'set') | Set-Content $script
          $lines = & cmd.exe /c $script
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment initialization failed' }
          foreach ($line in $lines) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion|VSINSTALLDIR)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      - name: Build and assemble the exact native runtime
        if: inputs.suite != 'portable'
        run: |
          bun scripts/build-cef-fixture.ts
          cargo +1.91.0 fmt --manifest-path native/cef-host/Cargo.toml --check
          cargo +1.91.0 clippy --locked --manifest-path native/cef-host/Cargo.toml --all-targets --features packaging -- -D warnings
          cargo +1.91.0 build --locked --manifest-path native/cef-host/Cargo.toml --features packaging,rpc-qualification --release 2>&1 | tee .bunly/hosted-evidence/build.log
          cargo +1.91.0 test --locked --manifest-path native/cef-host/Cargo.toml --lib 2>&1 | tee .bunly/hosted-evidence/native-tests.log
          cargo +1.91.0 run --locked --manifest-path native/cef-host/Cargo.toml --features packaging,rpc-qualification --release --bin bunly-bundle -- "$GITHUB_WORKSPACE/.bunly/cef-bundle"
          python scripts/hosted_cef.py prepare
      - name: Execute unprivileged Linux or macOS qualification
        if: inputs.suite != 'portable' && runner.os != 'Windows'
        timeout-minutes: 20
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- python scripts/hosted_cef.py run --suite "$QUALIFICATION_SUITE"
          else
            python scripts/hosted_cef.py run --suite "$QUALIFICATION_SUITE"
          fi
      - name: Execute Windows qualification as a temporary standard user
        if: inputs.suite != 'portable' && runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/hosted-windows.ps1 -Suite $env:QUALIFICATION_SUITE
      - name: Save immutable download inputs after successful qualification
        if: success() && inputs.suite != 'portable' && steps.manual-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; node24
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .bunly/cef-cache
          key: ${{ steps.manual-cache.outputs.cache-primary-key }}
      - name: Preserve diagnostics even when qualification fails
        if: ${{ !cancelled() }}
        run: python scripts/hosted_cef.py collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; node24
        if: ${{ !cancelled() }}
        with:
          name: native-${{ matrix.target }}-${{ inputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bunly/hosted-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
