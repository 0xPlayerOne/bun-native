name: M3 native CEF runtime
on:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to test (standard GitHub-hosted runners only)
        type: choice
        required: true
        default: windows
        options: [windows, linux, macos, all]
      suite:
        description: Portable checks, prebuilt smoke matrix, or full native qualification
        type: choice
        required: true
        default: full
        options: [portable, smoke, full]
permissions:
  contents: read
concurrency:
  group: cef-${{ github.event_name }}-${{ github.ref }}-${{ inputs.platform || 'automatic' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contributor-snapshot:
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Capture contributor-only native tools for isolated checks
        shell: bash
        run: |
          rustup toolchain install 1.91.0 --profile minimal --component rustfmt
          cargo +1.91.0 fetch --manifest-path native/cef-host/Cargo.toml
          mkdir -p .bunly
          tar -czf .bunly/rust-toolchain.tgz -C "$HOME/.rustup/toolchains/1.91.0-x86_64-unknown-linux-gnu" bin lib
          tar -czf .bunly/cargo-cache.tgz -C "$HOME/.cargo" registry git
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cef-rust-contributor
          path: |
            .bunly/rust-toolchain.tgz
            .bunly/cargo-cache.tgz
            native/cef-host/Cargo.lock
          include-hidden-files: true
          retention-days: 1
  cef:
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
      CEF_PATH: ${{ github.workspace }}/.bunly/cef-cache
      PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/cef-host/target
            .bunly/cef-cache
          key: ${{ runner.os }}-cef154-rust191-${{ hashFiles('native/cef-host/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cef154-rust191-${{ hashFiles('native/cef-host/Cargo.toml') }}-
            ${{ runner.os }}-cef154-rust190-${{ hashFiles('native/cef-host/Cargo.toml') }}-
      - name: Native contributor prerequisites
        shell: bash
        run: |
          mkdir -p .bunly/cef-evidence
          rustup toolchain install 1.91.0 --profile minimal --component rustfmt
          if [ '${{ runner.os }}' = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y ninja-build libgtk-3-dev libnss3 libasound2t64 libgbm1 xvfb > .bunly/cef-evidence/prerequisites.log 2>&1
          fi
          python -m pip install --disable-pip-version-check --only-binary=:all: psutil==7.0.0
      - name: Configure Windows C++ toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $script = Join-Path $env:RUNNER_TEMP 'bunly-vs-env.cmd'
          @('@echo off', ('call "' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul'), 'if errorlevel 1 exit /b %errorlevel%', 'set') | Set-Content $script
          $lines = & cmd.exe /c $script
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment initialization failed' }
          foreach ($line in $lines) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion|VSINSTALLDIR)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      - name: Compile native host and helpers
        shell: bash
        run: |
          cargo +1.91.0 build --manifest-path native/cef-host/Cargo.toml --features packaging --release > .bunly/cef-evidence/build.log 2>&1 || { tail -180 .bunly/cef-evidence/build.log; exit 1; }
          tail -10 .bunly/cef-evidence/build.log
      - name: Build TypeScript application without native compilation
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun scripts/build-cef-fixture.ts
      - name: Assemble contributor runtime bundle
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.91.0
        run: cargo +1.91.0 run --manifest-path native/cef-host/Cargo.toml --features packaging --release --bin bunly-bundle -- "$GITHUB_WORKSPACE/.bunly/cef-bundle"
      - name: Run actual packaged application
        shell: bash
        run: |
          if [ '${{ runner.os }}' = Linux ]; then
            sandbox="$GITHUB_WORKSPACE/.bunly/cef-bundle/chrome-sandbox"
            if [ -f "$sandbox" ]; then
              sudo chown root:root "$sandbox"
              sudo chmod 4755 "$sandbox"
              export CHROME_DEVEL_SANDBOX="$sandbox"
            fi
            xvfb-run -a bun scripts/qualify-cef-runtime.ts
          else
            bun scripts/qualify-cef-runtime.ts
          fi
      - name: Preserve native build diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p .bunly/cef-evidence
          if [ -f native/cef-host/Cargo.lock ]; then cp native/cef-host/Cargo.lock .bunly/cef-evidence/Cargo.lock; fi
          find .bunly/cef-cache -name archive.json -exec cat {} \; > .bunly/cef-evidence/cef-archive.json || true
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/cef-host/target
            .bunly/cef-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cef-native-${{ matrix.os }}
          path: .bunly/cef-evidence/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  # Explicit maintainer dispatch is independent of the automatic billing pause.
  manual-plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        name: Select only allowlisted hosted platforms
        env:
          PLATFORM: ${{ inputs.platform }}
          SUITE: ${{ inputs.suite }}
        run: |
          python3 - <<'PY'
          import json, os
          rows = {
              'windows': {'os': 'windows-2022', 'target': 'win32-x64'},
              'linux': {'os': 'ubuntu-22.04', 'target': 'linux-x64'},
              'macos': {'os': 'macos-15', 'target': 'darwin-arm64'},
          }
          name = os.environ['PLATFORM']
          if name not in (*rows, 'all') or os.environ['SUITE'] not in ('portable', 'smoke', 'full'):
              raise SystemExit('Unsupported platform or test suite')
          matrix = {'include': list(rows.values()) if name == 'all' else [rows[name]]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          PY
  manual-native:
    if: github.event_name == 'workflow_dispatch'
    needs: manual-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manual-plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      CEF_PATH: ${{ github.workspace }}/.bunly/cef-cache
      QUALIFICATION_SUITE: ${{ inputs.suite }}
      EXPECTED_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install frozen contributor tools
        run: |
          mkdir -p .bunly/hosted-evidence
          bun install --frozen-lockfile
          python -m pip install --disable-pip-version-check -r requirements-dev.txt -r benchmarks/adapters/frontend/requirements.txt
          python -c 'import os,sys; open(os.environ["GITHUB_ENV"],"a").write("PYTHON="+sys.executable+"\n")'
      - name: Portable checks
        run: |
          bun run check 2>&1 | tee .bunly/hosted-evidence/check.log
          bun run typecheck:browser 2>&1 | tee .bunly/hosted-evidence/browser.log
          python -m unittest discover -s tests -p '*_test.py' 2>&1 | tee .bunly/hosted-evidence/python.log
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: inputs.suite != 'portable'
        id: manual-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .bunly/cef-cache
          key: manual-cef-${{ matrix.target }}-rust191-${{ hashFiles('native/cef-host/Cargo.lock') }}
      - name: Native contributor prerequisites
        if: inputs.suite != 'portable'
        run: |
          rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y ninja-build libgtk-3-dev libnss3 libasound2 libgbm1 xvfb dbus-x11
          fi
      - name: Configure MSVC for the Windows contributor build
        if: inputs.suite != 'portable' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $script = Join-Path $env:RUNNER_TEMP 'bunly-manual-vs-env.cmd'
          @('@echo off', ('call "' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul'), 'if errorlevel 1 exit /b %errorlevel%', 'set') | Set-Content $script
          $lines = & cmd.exe /c $script
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment initialization failed' }
          foreach ($line in $lines) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion|VSINSTALLDIR)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      - name: Build and assemble the exact native runtime
        if: inputs.suite != 'portable'
        run: |
          bun scripts/build-cef-fixture.ts
          cargo +1.91.0 build --locked --manifest-path native/cef-host/Cargo.toml --features packaging --release 2>&1 | tee .bunly/hosted-evidence/build.log
          cargo +1.91.0 test --locked --manifest-path native/cef-host/Cargo.toml --lib 2>&1 | tee .bunly/hosted-evidence/native-tests.log
          cargo +1.91.0 run --locked --manifest-path native/cef-host/Cargo.toml --features packaging --release --bin bunly-bundle -- "$GITHUB_WORKSPACE/.bunly/cef-bundle"
          python scripts/hosted_cef.py prepare
      - name: Execute unprivileged Linux or macOS qualification
        if: inputs.suite != 'portable' && runner.os != 'Windows'
        timeout-minutes: 20
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- python scripts/hosted_cef.py run --suite "$QUALIFICATION_SUITE"
          else
            python scripts/hosted_cef.py run --suite "$QUALIFICATION_SUITE"
          fi
      - name: Execute Windows qualification as a temporary standard user
        if: inputs.suite != 'portable' && runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/hosted-windows.ps1 -Suite $env:QUALIFICATION_SUITE
      - name: Save immutable download inputs after successful qualification
        if: success() && inputs.suite != 'portable' && steps.manual-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .bunly/cef-cache
          key: ${{ steps.manual-cache.outputs.cache-primary-key }}
      - name: Preserve diagnostics even when qualification fails
        if: ${{ !cancelled() }}
        run: python scripts/hosted_cef.py collect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: native-${{ matrix.target }}-${{ inputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bunly/hosted-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
