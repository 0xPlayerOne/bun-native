name: M6 reload mechanism qualification
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
concurrency:
  group: m6-reload-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reload:
    if: vars.CI_BILLING_PAUSED == 'false' && github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; node24
        with:
          python-version: '3.11'
      - name: Install frozen fixture dependencies
        run: |
          bun install --frozen-lockfile
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements.txt
      - name: Validate evidence and actual negative fixtures
        run: bun test tests/reload-mechanisms.test.ts
      - name: Qualify four mechanisms and replay the exact-source report
        shell: bash
        env:
          PYTHON: python
        run: |
          bun run qualify:reload
          for report in .bunly/m6/reload/run-*/report.json; do
            bun run verify:reload "$report"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; node24
        if: ${{ !cancelled() }}
        with:
          name: reload-mechanisms-${{ matrix.os }}
          path: .bunly/m6/reload/run-*/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
