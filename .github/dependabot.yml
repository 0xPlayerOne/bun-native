version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: sunday
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    multi-ecosystem-group: dependencies
    patterns: ['*']
    ignore:
      # Code Foundry runtime pins are maintained together with runtime_ref.
      - dependency-name: 'AndrewM-F/code-foundry*'
      - dependency-name: 'AndrewM-F/code-foundry*'
  - package-ecosystem: bun
    directory: /
    target-branch: main
    multi-ecosystem-group: dependencies
    patterns: ['*']
    ignore:
      # Solid's pinned preset requires Babel 7; qualify the next major in #316.
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
  - package-ecosystem: cargo
    directory: /
    target-branch: main
    multi-ecosystem-group: dependencies
    patterns: ['*']
    ignore:
      # These need a coordinated GPUI upgrade; remove the holds with #697.
      - dependency-name: accesskit
        versions: ['>= 0.25.0']
      - dependency-name: accesskit_consumer
        versions: ['>= 0.39.0']
      - dependency-name: base64
        versions: ['>= 0.23.0']
      - dependency-name: xkbcommon
        versions: ['>= 0.9.0']
  - package-ecosystem: pip
    directory: /scripts/quality
    target-branch: main
    multi-ecosystem-group: dependencies
    patterns: ['*']
