version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: sunday
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    multi-ecosystem-group: dependencies
    patterns: ['*']
    ignore:
      # Code Foundry runtime pins are maintained together with runtime_ref.
      - dependency-name: 'AndrewM-F/code-foundry*'
      - dependency-name: '0xPlayerOne/code-foundry*'
  - package-ecosystem: bun
    directory: /
    target-branch: main
    multi-ecosystem-group: dependencies
    patterns: ['*']
    ignore:
      # Solid's pinned preset requires Babel 7; qualify the next major in #316.
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
  - package-ecosystem: cargo
    directory: /
    target-branch: main
    multi-ecosystem-group: dependencies
    patterns: ['*']
  - package-ecosystem: pip
    directory: /scripts/quality
    target-branch: main
    multi-ecosystem-group: dependencies
    patterns: ['*']
