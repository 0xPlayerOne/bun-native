version: 2
multi-ecosystem-groups:
  dependencies:
    # A multi-ecosystem group owns the target branch; setting it on a member
    # update is rejected by Dependabot's config parser.
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ['*']
    ignore:
      # Code Foundry runtime pins are maintained together with runtime_ref.
      - dependency-name: 'AndrewM-F/code-foundry*'
  - package-ecosystem: bun
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ['*']
    ignore:
      # Solid's pinned preset requires Babel 7; qualify the next major in #316.
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ['*']
    ignore:
      # These need a coordinated GPUI upgrade; remove the holds with #697.
      - dependency-name: accesskit
        versions: ['>= 0.25.0']
      - dependency-name: accesskit_consumer
        versions: ['>= 0.39.0']
      - dependency-name: base64
        versions: ['>= 0.23.0']
      - dependency-name: xkbcommon
        versions: ['>= 0.9.0']
      # zed-xim (pinned git revision under vendored gpui_linux) still requires
      # x11rb ^0.13, so 0.14 cannot unify and duplicates x11rb-protocol. See #710.
      - dependency-name: x11rb
        versions: ['>= 0.14.0']
  - package-ecosystem: pip
    directory: /scripts/quality
    multi-ecosystem-group: dependencies
    patterns: ['*']
