[workspace]
members = [
  "native/protocol",
  "native/gpui-host",
  "native/macos-surface",
  "native/posix-services",
  "native/windows-services",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch."https://github.com/gfx-rs/wgpu"]
wgpu-hal = { path = "native/vendor/wgpu-hal" }
