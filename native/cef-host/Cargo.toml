[package]
name = "bunly_host"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "MIT"

[workspace]
# Honor the declared contributor MSRV when resolving optional packaging tools.
resolver = "3"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "bunly_host"
path = "src/main.rs"

[[bin]]
name = "bunly_helper"
path = "src/helper.rs"

[[bin]]
name = "bunly-bundle"
path = "src/bundle.rs"
required-features = ["packaging"]

[features]
default = ["sandbox"]
sandbox = ["cef/sandbox"]
packaging = ["cef/build-util", "dep:semver"]

[package.metadata.cef.bundle]
helper_name = "bunly_helper"
resources_path = "resources"

[dependencies]
semver = { version = "=1.0.28", optional = true }
cef = { git = "https://github.com/tauri-apps/cef-rs", rev = "163744c8286d5f593d89202c7807751a7898db28", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
url = "=2.5.7"
percent-encoding = "=2.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.3"
objc2-foundation = "=0.3.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSEvent", "NSResponder", "NSRunningApplication"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.177"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
lto = "thin"
debug = 1
