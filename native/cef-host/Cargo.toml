[package]
name = "bunly_host"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "MIT"

[workspace]
# Honor the declared contributor MSRV when resolving optional packaging tools.
resolver = "3"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "bunly_host"
path = "src/main.rs"

[[bin]]
name = "bunly_helper"
path = "src/helper.rs"

[[bin]]
name = "bunly-terminal-owner"
path = "src/terminal_owner.rs"

[[bin]]
name = "bunly-terminal-fixture-host"
path = "src/terminal_fixture_host.rs"
required-features = ["rpc-qualification"]

[[bin]]
name = "bunly-bundle"
path = "src/bundle.rs"
required-features = ["packaging"]

[features]
default = ["sandbox"]
sandbox = ["cef/sandbox"]
packaging = ["cef/build-util", "dep:semver"]
# Contributor fixture only. No page-callable test or debugging endpoints.
rpc-qualification = []
# Bounded native-only provenance for a separately prepared diagnostic fixture.
rpc-context-diagnostics = ["rpc-qualification"]
# Native-only callback lifetime receipts; never enables a browser endpoint.
shutdown-diagnostics = []
# Explicit development manifest opt-in is also required. Never opens a listener.
browser-actions = []

[package.metadata.cef.bundle]
helper_name = "bunly_helper"
resources_path = "resources"

[dependencies]
semver = { version = "=1.0.28", optional = true }
cef = { git = "https://github.com/tauri-apps/cef-rs", rev = "a46b48c6221f99414a5c6b37ff86491772f9b0a2", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
url = "=2.5.7"
percent-encoding = "=2.3.2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# This leaf host opts into upstream Apple ARM SHA instructions. Other target
# feature selections stay unchanged; application builds still use prebuilt hosts.
sha2 = { version = "=0.10.9", features = ["asm"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.3"
objc2-foundation = "=0.3.2"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CFRunLoop",
  "CFString",
  "block2",
] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "NSApplication",
  "NSWorkspace",
  "NSEvent",
  "NSGraphicsContext",
  "NSButton",
  "NSControl",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "objc2-core-foundation",
  "NSResponder",
  "NSRunningApplication",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSOpenPanel",
  "NSSavePanel",
  "NSPanel",
  "NSWindow",
  "NSView",
  "block2",
] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.177"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_SystemServices",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_StationsAndDesktops",
  "Win32_Graphics_Dwm",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
] }

[profile.release]
lto = "thin"
debug = 1
