[package]
name = "bun-native-host"
version = "0.0.0"
edition = "2024"
license = "MIT AND Apache-2.0"
publish.workspace = true

[dependencies]
# The exact AccessKit node types GPUI's accessibility tree accepts.
accesskit = "=0.24.1"
bun-native-protocol = { path = "../protocol" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d", default-features = false, features = [
  "font-kit",
  "wayland",
  "x11",
] }
async-channel = "=2.5.0"
base64 = "=0.22.1"
log = { version = "=0.4.35", features = ["std"] }
serde_json.workspace = true
unicode-segmentation = "=1.13.3"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "=0.6.2"
pty-process = "=0.5.4"
rustix = { version = "=1.1.6", features = ["event", "fs", "net", "process", "termios"] }
x11rb = "=0.13.2"
futures = { version = "=0.3.34", default-features = false, features = ["std"] }
futures-lite = "=2.6.1"
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "=0.22.1"
bun-native-macos-surface = { path = "../macos-surface" }
pty-process = "=0.5.4"
raw-window-handle = "=0.6.2"
rustix = { version = "=1.1.6", features = ["event", "fs", "process", "termios"] }

[lints]
workspace = true
