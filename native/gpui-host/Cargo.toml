[package]
name = "bun-native-host"
version = "0.0.0"
edition = "2024"
license = "MIT AND Apache-2.0"
publish.workspace = true

[dependencies]
# The exact AccessKit node types GPUI's accessibility tree accepts.
accesskit = "=0.24.1"
bun-native-protocol = { path = "../protocol" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d", default-features = false, features = [
  "font-kit",
  "wayland",
  "x11",
] }
async-channel = "=2.5.0"
base64 = "=0.22.1"
log = { version = "=0.4.35", features = ["std"] }
serde_json.workspace = true
unicode-segmentation = "=1.13.3"
# Pure Windows task dialog rules (compiled everywhere) and the Windows-only calls.
bun-native-windows-services = { path = "../windows-services" }

[target.'cfg(target_os = "linux")'.dependencies]
# Not used directly. GPUI's XIM client enables ahash `compile-time-rng`, whose
# hasher keys are then its only randomness. CONST_RANDOM_SEED is pinned for
# reproducible builds (.cargo/config.toml), so unify in `runtime-rng` to keep
# the keys randomized per process at runtime.
ahash = { version = "=0.8.12", default-features = false, features = ["runtime-rng"] }
raw-window-handle = "=0.6.2"
bun-native-posix-services = { path = "../posix-services" }
pty-process = "=0.5.4"
rustix = { version = "=1.1.6", features = ["event", "fs", "net", "process", "termios"] }
x11rb = "=0.13.2"
futures = { version = "=0.3.34", default-features = false, features = ["std"] }
futures-lite = "=2.6.1"
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
# Keysyms and US-layout keycodes for keys forwarded to AT-SPI on Wayland; the
# version GPUI's Linux backend already locks.
xkbcommon = { version = "=0.8.0", default-features = false }

# The Wayland test's input peer (examples/wayland-input-peer.rs); the same
# versions GPUI's Wayland backend already locks.
[dev-dependencies]
# Polls the report pump in its unit tests; already locked through GPUI.
futures-lite = "=2.6.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-client = "=0.31.15"
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "=0.22.1"
bun-native-macos-surface = { path = "../macos-surface" }
bun-native-posix-services = { path = "../posix-services" }
pty-process = "=0.5.4"
raw-window-handle = "=0.6.2"
rustix = { version = "=1.1.6", features = ["event", "fs", "process", "termios"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "=0.6.2"

[lints]
workspace = true
