[package]
name = "bun-native-host"
version = "0.0.0"
edition = "2024"
license = "MIT AND Apache-2.0"
publish.workspace = true

[dependencies]
bun-native-protocol = { path = "../protocol" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d", default-features = false, features = [
  "font-kit",
  "wayland",
  "x11",
] }
async-channel = "=2.5.0"
serde_json.workspace = true
unicode-segmentation = "=1.13.3"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "=0.6.2"
rustix = { version = "=1.1.6", features = ["event", "net"] }
x11rb = "=0.13.2"

[lints]
workspace = true
