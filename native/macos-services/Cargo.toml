[package]
name = "bun-native-macos-services"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Already in the lockfile through GPUI and the standard library's dependencies.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"
pty-process = "=0.5.4"

# Only this private platform boundary permits the reviewed `fchdir` in a child
# between fork and exec. The protocol and host keep the workspace-wide
# unsafe_code = forbid policy.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
all = "warn"
