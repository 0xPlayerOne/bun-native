[package]
name = "bun-native-macos-surface"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSResponder",
  "NSView",
  "objc2-quartz-core",
] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CALayer",
  "objc2-core-foundation",
] }
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSGeometry"] }

# Only this private platform boundary permits its reviewed borrowed-view cast.
# The protocol and host keep the workspace-wide unsafe_code = forbid policy.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
all = "warn"
