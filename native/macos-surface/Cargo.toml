[package]
name = "bun-native-macos-surface"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CFRunLoop",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSBundle",
  "NSError",
  "NSGeometry",
  "NSNotification",
  "NSOperation",
  "NSRunLoop",
  "NSSet",
  "NSString",
  "NSURL",
] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLDevice"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSAlert",
  "NSApplication",
  "NSButton",
  "NSControl",
  "NSCell",
  "NSEvent",
  "NSGraphics",
  "NSMenu",
  "NSMenuItem",
  "NSOpenPanel",
  "NSPanel",
  "NSPasteboard",
  "NSResponder",
  "NSSavePanel",
  "NSScreen",
  "NSView",
  "NSWindow",
  # NSWindow::backingScaleFactor returns a CGFloat (popup placement).
  "objc2-core-foundation",
  "objc2-quartz-core",
  "objc2-uniform-type-identifiers",
] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CALayer",
  "CAMetalLayer",
  "objc2-core-foundation",
  "objc2-metal",
] }
# Already locked through GPUI's macOS backend: the content types a file
# panel filters by (`UTType` from a file name extension).
objc2-uniform-type-identifiers = { version = "=0.3.2", default-features = false, features = [
  "std",
  "UTType",
] }
# Already locked through GPUI's macOS backend: plain-text notifications
# through UNUserNotificationCenter.
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = [
  "std",
  "block2",
  "UNNotification",
  "UNNotificationAction",
  "UNNotificationCategory",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSGeometry"] }

# Only this private platform boundary permits its reviewed borrowed-view cast.
# The protocol and host keep the workspace-wide unsafe_code = forbid policy.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
all = "warn"
