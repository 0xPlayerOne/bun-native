[package]
name = "bun-native-posix-services"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[target.'cfg(unix)'.dependencies]
pty-process = "=0.5.4"
rustix = { version = "=1.1.6", features = ["process"] }

# Only this private platform boundary permits its two reviewed `pre_exec`
# calls. The protocol and host keep the workspace-wide unsafe_code = forbid
# policy; the descriptor handling here is safe code.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
all = "warn"
